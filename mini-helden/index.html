/* Seifenblase (durchsichtig, Regenbogen-Schimmer, Glanz) */
function FE_bubble(c, x, y, r, t, glow = 0) {
  if (glow > 0) { c.save(); c.globalAlpha = Math.min(1, glow) * (0.55 + 0.35 * Math.sin(t * 9)); Draw.circle(c, x, y, r + 16); c.lineWidth = 14; c.strokeStyle = PAL.yellow; c.stroke(); c.restore(); }
  const g = c.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, 'rgba(255,255,255,0.06)'); g.addColorStop(0.72, 'rgba(210,235,255,0.16)'); g.addColorStop(1, 'rgba(190,150,255,0.45)');
  Draw.circle(c, x, y, r); c.fillStyle = g; c.fill();
  c.lineWidth = 5;
  ['rgba(255,120,200,0.55)', 'rgba(120,200,255,0.55)', 'rgba(255,230,120,0.6)'].forEach((col, i) => { c.strokeStyle = col; c.beginPath(); c.arc(x, y, r - 7 - i * 5, 0.3 + t * 0.6 + i * 1.3, 1.5 + t * 0.6 + i * 1.3); c.stroke(); });
  Draw.circle(c, x, y, r); c.lineWidth = 5; c.strokeStyle = 'rgba(255,255,255,0.95)'; c.stroke();
  c.lineWidth = 2; c.strokeStyle = 'rgba(38,33,58,0.35)'; c.stroke();
  c.save(); c.globalAlpha = 0.85; Draw.ellipse(c, x - r * 0.42, y - r * 0.5, r * 0.2, r * 0.1, -0.6); c.fillStyle = '#fff'; c.fill(); Draw.circle(c, x - r * 0.12, y - r * 0.68, r * 0.05); c.fill(); c.restore();
}

class FE_AnimalsGame extends MiniGame {
  constructor() { super('animals'); this.rounds = 3; this.bubbles = []; this.free = []; this.hops = []; this.target = null; this.used = []; this.nick = null; this.asked = false; }
  get nickHome() { return { x: View.R - 150, y: 150 }; }
  instruction() {
    if (this.target && this.target.state === 'trapped') { const a = FE_ANIMALS[this.target.kind]; return a.snd + ' Wer macht ' + a.short + '? Tipp auf das Tier!'; }
    return 'Tier-Stimmen! Nebel-Nick hat die Tiere in Seifenblasen gesperrt. Hör gut zu, und tipp auf das richtige Tier!';
  }
  start() {
    const h = this.nickHome; this.nick = { x: View.R + 160, y: h.y, s: 0.62, mood: 'grin', spin: 0 };
    this.setupRound(0);
  }
  nextRound(r) { this.setupRound(r); }
  exit() { this.bubbles = []; this.hops = []; this.free = []; }
  setupRound(r) {
    this.locked = true; this.target = null; this.free = []; this.hops = [];
    const n = this.small ? [2, 3, 3][r] : [3, 4, 4][r];
    let pool = Object.keys(FE_ANIMALS).filter((k) => !this.used.includes(k));
    if (pool.length < n) { this.used = []; pool = Object.keys(FE_ANIMALS); }
    const kinds = sample(pool, n); this.used = this.used.concat(kinds);
    const R = n <= 3 ? 108 : 96, sp = n <= 3 ? 270 : 220, cx = DW / 2 - 20;
    const nick = this.nick, home = this.nickHome;
    tween(nick, { x: home.x, y: home.y }, 0.8, { ease: 'outBack', owner: this });
    nick.mood = 'grin'; nick.spin = 0; nick.s = 0.62;
    this.bubbles = kinds.map((k, i) => ({ kind: k, tx: cx + (i - (n - 1) / 2) * sp, ty: 330 + (i % 2) * 34, x: home.x, y: home.y, r: R, s: 0, state: 'trapped', wob: 0, glow: 0, ph: rand(0, 6) }));
    after(0.7, () => { nick.mood = 'puff'; Sound.play('whoosh'); }, this);
    this.bubbles.forEach((b, i) => after(0.8 + i * 0.28, () => { Sound.play('pop', { pitch: 1.4 + i * 0.1 }); tween(b, { x: b.tx, y: b.ty, s: 1 }, 0.7, { ease: 'outBack', owner: this }); }, this));
    const ready = 0.8 + n * 0.28 + 0.8;
    after(ready, () => {
      nick.mood = 'grin'; this.locked = false;
      if (r === 0) Voice.say('Oh nein! Nebel-Nick hat die Tiere in Seifenblasen gesperrt! Hör gut zu!', { force: true });
      this.askT = Game.time + (r === 0 ? 4.6 : 0.2); this.asked = false;
    }, this);
  }
  ask() {
    const left = this.bubbles.filter((b) => b.state === 'trapped'); if (!left.length) return;
    this.target = pick(left); this.asked = true;
    Voice.say(this.instruction(), { force: true }); Game.lastInput = Game.time;
  }
  onDown(p) {
    for (const b of this.bubbles) {
      if (b.state !== 'trapped' || b.s < 0.8 || !inCircle(p, b.x, b.y, b.r + 12)) continue;
      if (!this.target) { this.target = b; this.asked = true; }
      if (b === this.target) this.rescue(b); else this.wrongTap(b);
      return;
    }
    for (const f of this.free) if (inCircle(p, f.x, f.y - 10, 70)) { const a = FE_ANIMALS[f.kind]; f.hop = 1; Sound.play('boing'); Voice.say(a.short + '!', { ifIdle: true }); return; }
  }
  rescue(b) {
    const a = FE_ANIMALS[b.kind]; b.state = 'free'; b.glow = 0; this.target = null; this.locked = true;
    Sound.play('pop'); Sound.play('sparkle');
    Particles.burst('bubble', b.x, b.y, 16, { speed: 320, size: 16, life: 0.9 });
    Particles.burst('star', b.x, b.y, 14, { speed: 280, size: 15, colors: [PAL.yellow, '#fff', PAL.pink], life: 0.9 });
    Particles.pow(b.x, b.y, 80, '#fff');
    Voice.say(a.art + ' ' + a.name + '! ' + a.snd, { force: true });
    this.nick.mood = 'dizzy'; after(0.9, () => { if (this.nick.mood === 'dizzy') this.nick.mood = 'grin'; }, this);
    const slot = this.free.length + this.hops.length, n = this.bubbles.length;
    const fx = DW / 2 - 20 + (slot - (n - 1) / 2) * Math.min(220, 820 / Math.max(1, n - 1 || 1)), fy = 650;
    const hp = { kind: b.kind, x: b.x, y: b.y, sx: b.x, sy: b.y, k: 0, s: 1, fx, fy };
    this.hops.push(hp);
    tween(hp, { k: 1 }, 1.0, { ease: 'inOutQuad', owner: this, update: () => { hp.x = lerp(hp.sx, hp.fx, hp.k); hp.y = lerp(hp.sy, hp.fy, hp.k) - Math.sin(hp.k * Math.PI) * 150; hp.s = lerp(1, 0.78, hp.k); }, done: () => {
      this.hops = this.hops.filter((q) => q !== hp); this.free.push({ kind: hp.kind, x: hp.fx, y: hp.fy, hop: 1, ph: rand(0, 6) }); Sound.play('thud');
    } });
    after(2.0, () => {
      if (this.bubbles.some((q) => q.state === 'trapped')) { this.locked = false; this.ask(); }
      else this.roundEnd();
    }, this);
  }
  wrongTap(b) {
    const a = FE_ANIMALS[b.kind], tg = FE_ANIMALS[this.target.kind];
    b.wob = 1; this.target.glow = 1; Sound.play('boing');
    Voice.say('Das ist ' + a.art.toLowerCase() + ' ' + a.name + '. ' + a.short + '! Wer macht ' + tg.short + '?', { force: true });
    Game.lastInput = Game.time;
  }
  roundEnd() {
    const nick = this.nick; nick.mood = 'sad';
    Voice.say('Menno! Alle Tiere sind frei!', { force: true });
    after(1.0, () => { Sound.play('whoosh'); tween(nick, { x: View.R + 200, y: 80, spin: 1.2 }, 0.9, { ease: 'inBack', owner: this }); }, this);
    after(1.4, () => { for (const f of this.free) f.hop = 1; Sound.play('yay'); this.roundDone(); }, this);
  }
  hint() { if (this.locked || !this.target || this.target.state !== 'trapped') return null; return { x1: this.target.x, y1: this.target.y + 10 }; }
  update(dt) {
    if (!this.locked && !this.asked && this.askT && Game.time >= this.askT && !Voice.busy) this.ask();
    if (!this.locked && !this.asked && this.askT && Game.time >= this.askT + 6) this.ask();
    for (const b of this.bubbles) { b.wob = Math.max(0, b.wob - dt * 1.6); if (b.glow > 0 && b !== this.target) b.glow = Math.max(0, b.glow - dt); }
    for (const f of this.free) f.hop = Math.max(0, f.hop - dt * 1.5);
  }
  drawFarm(c) {
    const w = this.W, t = Game.time, gy = 520;
    Draw.sky(c, w.skyTop, w.skyBottom);
    if (w.id === 'girls') Draw.rainbow(c, 330, gy + 20, 250, 16, 0.5); else Draw.sun(c, 150, 120, 42);
    for (let i = 0; i < 3; i++) { const cx = ((i * 380 + t * (12 + i * 5)) % (View.vw + 400)) + View.L - 200; Draw.cloud(c, cx, 95 + (i % 2) * 60, 30 + i * 6, '#fff', 0); }
    // Hügel
    c.fillStyle = shade(w.grass, -0.1); Draw.ellipse(c, 200, gy + 30, 380, 110); c.fill(); Draw.ellipse(c, 820, gy + 40, 420, 120); c.fill();
    // Scheune
    c.save(); c.translate(Math.max(View.L + 120, 110), gy + 12);
    Draw.rrPath(c, -95, -150, 190, 156, 6); Draw.fs(c, '#d9453a', 4);
    c.beginPath(); c.moveTo(-112, -146); c.lineTo(0, -236); c.lineTo(112, -146); c.closePath(); Draw.fs(c, '#8a2f2a', 4);
    Draw.rrPath(c, -42, -92, 84, 98, 4); Draw.fs(c, '#fff', 4); c.lineWidth = 7; c.strokeStyle = '#d9453a';
    c.beginPath(); c.moveTo(-36, -86); c.lineTo(36, 0); c.moveTo(36, -86); c.lineTo(-36, 0); c.stroke();
    Draw.rrPath(c, -20, -192, 40, 34, 4); Draw.fs(c, '#fff3c4', 3.5);
    c.restore();
    // Zaun
    c.lineWidth = 4; c.strokeStyle = INK;
    for (let x = Math.floor((View.L - 40) / 60) * 60; x < View.R + 60; x += 60) { if (x > -20 && x < 230) continue; Draw.rrPath(c, x - 7, gy - 44, 14, 60, 4); Draw.fs(c, '#f2d3a0', 3.5); }
    for (const yy of [gy - 30, gy - 8]) { Draw.rrPath(c, Math.max(View.L, 230) - 10, yy, View.R - Math.max(View.L, 230) + 20, 9, 4); Draw.fs(c, '#e8c088', 3); }
    // Wiese
    c.fillStyle = w.grass; c.fillRect(View.L - 5, gy, View.vw + 10, View.B - gy + 10);
    c.lineWidth = 5; c.strokeStyle = INK; c.beginPath(); c.moveTo(View.L - 5, gy); c.lineTo(View.R + 5, gy); c.stroke();
    for (let i = 0; i < 16; i++) { const fx = View.L + ((i * 137) % Math.max(1, View.vw)), fy = gy + 40 + ((i * 53) % Math.max(40, View.B - gy - 50)); Draw.circle(c, fx, fy, 6); c.fillStyle = ['#fff', PAL.yellow, '#ff9fd0'][i % 3]; c.fill(); }
  }
  draw(c) {
    const t = Game.time;
    this.drawFarm(c);
    for (const f of this.free) { const hop = Math.abs(Math.sin((t + f.ph) * 3)) * 6 + Math.sin(f.hop * Math.PI) * 40; Draw.shadow(c, f.x, f.y + 60, 44, 9, 0.18); FE_drawAnimal(c, f.kind, f.x, f.y - hop, 0.78, t + f.ph); }
    for (const b of this.bubbles) {
      if (b.state !== 'trapped' || b.s <= 0.01) continue;
      const bob = Math.sin(t * 1.6 + b.ph) * 10, wob = b.wob > 0 ? Math.sin(b.wob * 28) * 0.08 * b.wob : 0;
      c.save(); c.translate(b.x, b.y + bob); c.scale(b.s * (1 + wob), b.s * (1 - wob));
      FE_drawAnimal(c, b.kind, 0, -4, b.r / 112, t + b.ph, { rot: Math.sin(t * 1.2 + b.ph) * 0.08 });
      FE_bubble(c, 0, 0, b.r, t + b.ph, b.glow);
      c.restore();
    }
    for (const h of this.hops) FE_drawAnimal(c, h.kind, h.x, h.y, h.s * 0.95, t);
    const n = this.nick; if (n && typeof FA_drawNick === 'function') FA_drawNick(c, n.x, n.y, n.s, t, n.mood, n.spin);
    this.drawHud(c);
  }
}

/* ---------- Baby: Kopf (x, y = Kopfmitte, Radius ≈ 46·s) ----------
   o.face: 'happy' | 'laugh' | 'cry' | 'sleepy' | 'sleep' | 'eat'; o.open 0…1 (Mund beim Essen); o.chew; o.bow; o.paci */
function FD_babyHead(c, x, y, s, o = {}) {
  const t = o.t !== undefined ? o.t : Game.time, face = o.face || 'happy';
  c.save(); c.translate(x, y); c.scale(s, s);
  for (const sx of [-1, 1]) { Draw.circle(c, sx * 45, 4, 11); Draw.fs(c, FD_SKIN, 3.5); Draw.circle(c, sx * 45, 4, 5); c.fillStyle = FD_SKIN2; c.fill(); }
  Draw.circle(c, 0, 0, 46); Draw.fs(c, FD_SKIN, 4);
  Draw.shine(c, -18, -24, 11, 6, 0.45);
  // Haarlocke
  c.lineCap = 'round';
  c.beginPath(); c.moveTo(-2, -44); c.quadraticCurveTo(-12, -62, 4, -66); c.quadraticCurveTo(18, -64, 14, -52); c.quadraticCurveTo(10, -44, 2, -52);
  c.lineWidth = 9; c.strokeStyle = INK; c.stroke(); c.lineWidth = 4.5; c.strokeStyle = FD_HAIR; c.stroke();
  // Bäckchen
  for (const sx of [-1, 1]) { c.save(); c.globalAlpha = 0.45; Draw.ellipse(c, sx * 27, 13, 9, 6); c.fillStyle = '#ff7f9f'; c.fill(); c.restore(); }
  // Augen
  const blink = (t % 4.1) < 0.12;
  for (const sx of [-1, 1]) {
    const ex = sx * 16, ey = -5;
    c.lineWidth = 3.5; c.strokeStyle = INK;
    if (face === 'laugh') { c.beginPath(); c.moveTo(ex - 8, ey + 3); c.quadraticCurveTo(ex, ey - 7, ex + 8, ey + 3); c.stroke(); continue; }
    if (face === 'cry') {
      c.beginPath(); c.moveTo(ex + sx * 7, ey - 6); c.lineTo(ex - sx * 6, ey); c.lineTo(ex + sx * 7, ey + 6); c.stroke();
      const k = ((t * 0.9 + (sx > 0 ? 0.45 : 0)) % 1);
      c.save(); c.globalAlpha = 1 - k; const dx = ex + sx * 11, dy = ey + 8 + k * 30;
      c.beginPath(); c.moveTo(dx, dy - 7); c.quadraticCurveTo(dx + 5, dy, dx, dy + 4); c.quadraticCurveTo(dx - 5, dy, dx, dy - 7); c.fillStyle = '#7fd3ff'; c.fill(); c.restore();
      continue;
    }
    if (face === 'sleep' || blink) { c.beginPath(); c.moveTo(ex - 8, ey); c.quadraticCurveTo(ex, ey + 6, ex + 8, ey); c.stroke(); continue; }
    Draw.ellipse(c, ex, ey, 9, 11); Draw.fs(c, '#fff', 3);
    Draw.circle(c, ex, ey + 1.5, 6.5); c.fillStyle = INK; c.fill();
    Draw.circle(c, ex - 2, ey - 1.5, 2.3); c.fillStyle = '#fff'; c.fill();
    if (face === 'sleepy') {
      c.save(); Draw.ellipse(c, ex, ey, 9, 11); c.clip(); c.fillStyle = FD_SKIN; c.fillRect(ex - 10, ey - 12, 20, 12 + Math.sin(t * 2) * 2); c.restore();
      c.beginPath(); c.moveTo(ex - 9, ey + Math.sin(t * 2) * 2); c.lineTo(ex + 9, ey + Math.sin(t * 2) * 2); c.stroke();
    }
  }
  // Nase
  c.lineWidth = 2.5; c.strokeStyle = shade(FD_SKIN2, -0.2); c.beginPath(); c.arc(0, 8, 4, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
  // Mund
  c.lineWidth = 3.5; c.strokeStyle = INK;
  if (o.paci) {
    Draw.ellipse(c, 0, 24, 15, 10); Draw.fs(c, o.paci, 3); Draw.circle(c, 0, 24, 5); c.fillStyle = '#fff'; c.fill();
    c.beginPath(); c.arc(0, 36, 7, 0, TAU); c.lineWidth = 3.5; c.stroke();
  } else if (face === 'laugh') {
    c.beginPath(); c.moveTo(-13, 17); c.quadraticCurveTo(0, 38, 13, 17); c.closePath(); Draw.fs(c, '#7a1d3a', 3); Draw.ellipse(c, 0, 26, 6, 4); c.fillStyle = '#ff8fb1'; c.fill();
  } else if (face === 'cry') {
    Draw.ellipse(c, 0, 25, 9, 7 + Math.sin(t * 9) * 1.5); Draw.fs(c, '#7a1d3a', 3);
  } else if (face === 'sleep' || face === 'sleepy') {
    Draw.circle(c, 0, 24, 3.5 + Math.sin(t * 2.2) * 0.8); Draw.fs(c, '#7a1d3a', 2.5);
  } else if (face === 'eat') {
    const op = o.open || 0;
    if (op > 0.08) { Draw.ellipse(c, 0, 23, 8 + op * 7, 3 + op * 12); Draw.fs(c, '#7a1d3a', 3); Draw.ellipse(c, 0, 25 + op * 7, 5 + op * 3, 2 + op * 3); c.fillStyle = '#ff8fb1'; c.fill(); }
    else { const ch = Math.sin(t * 16) * 2.5 * (o.chew || 0); c.beginPath(); c.moveTo(-9, 22); c.quadraticCurveTo(-4.5, 26 + ch, 0, 22); c.quadraticCurveTo(4.5, 26 - ch, 9, 22); c.stroke(); }
  } else { c.beginPath(); c.moveTo(-10, 19); c.quadraticCurveTo(0, 29, 10, 19); c.stroke(); }
  // Schleife (Mädels-Welt)
  if (o.bow) {
    c.save(); c.translate(-26, -38); c.rotate(-0.35);
    for (const sx of [-1, 1]) { c.beginPath(); c.moveTo(0, 0); c.lineTo(sx * 17, -10); c.lineTo(sx * 17, 10); c.closePath(); Draw.fs(c, o.bow, 3); }
    Draw.circle(c, 0, 0, 5); Draw.fs(c, shade(o.bow, -0.15), 3); c.restore();
  }
  c.restore();
}

/* Baby im Sitzen (x, y = Kopfmitte); Strampler in Weltfarbe mit Emblem und Mini-Umhang */
function FD_baby(c, x, y, s, o = {}) {
  const w = o.w || Game.world, t = o.t !== undefined ? o.t : Game.time;
  const bounce = o.bounce ? -Math.abs(Math.sin(t * 9)) * 8 * o.bounce : 0;
  c.save(); c.translate(x, y + bounce * s); c.scale(s, s);
  const onesie = w.ui;

    c.beginPath(); c.moveTo(-24, 48); c.quadraticCurveTo(-52, 88, -48 + wv, 124); c.quadraticCurveTo(0, 136, 48 - wv, 124); c.quadraticCurveTo(52, 88, 24, 48); c.closePath();
    Draw.fs(c, w.accent, 4);
  }
  if (!o.noLegs) for (const sx of [-1, 1]) { Draw.ellipse(c, sx * 22, 118, 21, 13); Draw.fs(c, onesie, 4); Draw.ellipse(c, sx * 30, 122, 9, 7); c.fillStyle = shade(onesie, 0.4); c.fill(); }
  Draw.ellipse(c, 0, 82, 40, 42); Draw.fs(c, onesie, 4);
  Draw.shine(c, -18, 58, 8, 12, 0.3);
  Draw.circle(c, 0, 78, 14); Draw.fs(c, '#fff', 3); Draw.symbol(c, w.emblem, 0, 78, 8.5, w.accent, 2);
  for (const sx of [-1, 1]) {
    const up = o.armsUp, wig = Math.sin(t * 6 + sx) * 4;
    const hx = sx * (up ? 58 : 48), hy = up ? 34 + wig : 104;
    c.lineCap = 'round'; c.lineWidth = 22; c.strokeStyle = INK; c.beginPath(); c.moveTo(sx * 28, 62); c.lineTo(hx, hy); c.stroke();
    c.lineWidth = 15; c.strokeStyle = onesie; c.stroke();
    Draw.circle(c, hx, hy, 11); Draw.fs(c, FD_SKIN, 3.5);
  }
  c.restore();
  FD_babyHead(c, x, y + bounce * s, s, { ...o, bow: o.bow !== undefined ? o.bow : (w.id === 'girls' ? '#ff6fc8' : null) });
}

function FD_window(c, x, y, w, h, world, night) {

  g.addColorStop(0, night > 0.5 ? '#1d1b4a' : world.skyTop); g.addColorStop(1, night > 0.5 ? '#433a86' : world.skyBottom);
  c.fillStyle = g; c.fillRect(x - w / 2, y - h / 2, w, h);
  if (night > 0.01 && night <= 0.5) { c.save(); c.globalAlpha = night * 2; const g2 = c.createLinearGradient(0, y - h / 2, 0, y + h / 2); g2.addColorStop(0, '#1d1b4a'); g2.addColorStop(1, '#433a86'); c.fillStyle = g2; c.fillRect(x - w / 2, y - h / 2, w, h); c.restore(); }
  if (night < 0.6) { c.save(); c.globalAlpha = 1 - night / 0.6; Draw.cloud(c, x - 30, y + 10, 20, '#fff', 0); Draw.sun(c, x + 55, y - 35, 20); c.restore(); }
  if (night > 0.2) {
    c.save(); c.globalAlpha = Math.min(1, (night - 0.2) * 1.6);
    Draw.moonPath(c, x + 40, y - 25, 24); Draw.fs(c, '#fff3a8', 3);
    for (const [sx, sy] of [[-60, -40], [-25, 30], [10, -50], [-70, 40], [70, 40]]) { Draw.starPath(c, x + sx, y + sy, 7, 3, 5); c.fillStyle = '#fff'; c.fill(); }
    c.restore();
  }
  c.restore();
  c.lineWidth = 5; c.strokeStyle = '#fff'; c.beginPath(); c.moveTo(x, y - h / 2); c.lineTo(x, y + h / 2); c.moveTo(x - w / 2, y); c.lineTo(x + w / 2, y); c.stroke();

    c.beginPath(); const cx = x + sx * (w / 2 + 4);

  Draw.rrPath(c, x - w / 2 - 40, y - h / 2 - 30, w + 80, 14, 7); Draw.fs(c, '#d9a066', 3.5);
}

class FD_BabyGame extends MiniGame {
  constructor() { super('baby'); this.rounds = 4; this.mode = 'room'; this.done = {}; this.fade = 0; this.trans = false; this.heartPop = {}; }
  get mash() { return this.W.id === 'girls' ? '#ff8fc0' : '#ff9f43'; }
  instruction() { if (this.mode === 'bath' && this.bath && this.bath.phase !== 'spots') return FD_SAY.shower; return FD_SAY[this.mode] || FD_SAY.room; }
  start() { this.mode = 'room'; this.roomEnter(true); this.sayIntro(0.5); }

  musicQuiet() { if (this.savedLevel === undefined) { this.savedLevel = Music.level; Music.level = 0.04; Music.applyLevel(); } }

  goRoom(then) { this.switchMode('room', then); }

      Draw.circle(c, 0, 0, 78); c.lineWidth = 4; c.strokeStyle = INK; c.stroke();
      Draw.circle(c, 0, 0, 88); c.lineWidth = 5; c.strokeStyle = INK; c.stroke();

  /* ================= Füttern ================= */
  feedEnter() {

  }
  get mouth() { return { x: 650, y: 332 }; }
  feedDown(p) {

  feedBite() {

  /* ================= Schaukeln ================= */
  rockEnter() {
    this.rock = { a: 0, v: 0, sleep: 0, asleep: false, lastSign: 0, note: 0, drag: false, lx: 0, moved: 0, whimper: 1.5, zs: [], notes: [] };
    this.musicQuiet();
    after(0.35, () => Voice.say(FD_SAY.rock, { force: true }), this);
  }
  get cradleP() { return { x: 512, y: 660 }; }
  rockDown(p) { const r = this.rock; if (r.asleep) return; r.drag = true; r.lx = p.x; r.moved = 0; }
  rockMove(p) {
    const r = this.rock; if (!r.drag || r.asleep) return;
    const dx = clamp(p.x - r.lx, -60, 60); r.lx = p.x; r.moved += Math.abs(dx);
    r.v = clamp(r.v + dx * 0.012, -2.6, 2.6);
  }
  rockUp() {
    const r = this.rock; if (!r.drag) return; r.drag = false;
    if (r.moved < 14 && !r.asleep) r.v = clamp(r.v + (r.a > 0.02 ? -1.5 : 1.5), -2.6, 2.6);
  }
  rockUpdate(dt) {
    const r = this.rock, P = this.cradleP;
    r.v += (-r.a * 8 - r.v * (r.asleep ? 1.6 : 0.7)) * dt; r.a += r.v * dt;
    if (Math.abs(r.a) > 0.42) { r.a = Math.sign(r.a) * 0.42; r.v *= -0.3; }
    const sg = r.a > 0.015 ? 1 : r.a < -0.015 ? -1 : 0;
    if (sg !== 0 && sg !== r.lastSign) {
      r.lastSign = sg;
      if (Math.abs(r.v) > 0.3) {
        const m = FD_LULLABY[r.note++ % FD_LULLABY.length];
        Sound.tone({ f: NOTE(m), dur: 1.5, vol: 0.13, a: 0.004 }); Sound.tone({ f: NOTE(m + 12), dur: 0.7, vol: 0.04, a: 0.003 });
        r.notes.push({ x: P.x + rand(-160, 160), y: P.y - 330, t: 0, ph: rand(0, 6) });
      }
    }
    if (!r.asleep) {
      r.sleep = Math.min(1, r.sleep + Math.min(Math.abs(r.v), 1.4) * dt * (this.small ? 0.19 : 0.13));
      r.whimper -= dt;
      if (r.sleep < 0.3 && r.whimper <= 0 && Math.abs(r.v) < 0.3) { r.whimper = 3; Sound.tone({ f: 460, f2: 380, dur: 0.35, vol: 0.05, type: 'triangle' }); }
      if (r.sleep >= 1) this.rockAsleep();
    } else {
      r.zt = (r.zt || 0) - dt;
      if (r.zt <= 0) { r.zt = 0.9; r.zs.push({ x: 0, y: 0, t: 0 }); }
    }
    for (const z of r.zs) z.t += dt; r.zs = r.zs.filter((z) => z.t < 2.6);
    for (const n of r.notes) n.t += dt; r.notes = r.notes.filter((n) => n.t < 2.2);
  }
  rockAsleep() {
    const r = this.rock; r.asleep = true; Hand.stop();
    Voice.say('Psst! Das Baby schläft!', { force: true, rate: 0.8, pitch: 1.0 });
    Sound.play('magic');
    after(4.2, () => this.activityDone('rock'), this);
  }
  rockHint() { const r = this.rock; if (r.asleep || Math.abs(r.v) > 0.6) return null; const P = this.cradleP; return { x1: P.x - 130, y1: P.y - 160, x2: P.x + 130, y2: P.y - 160 }; }
  rockDraw(c) {
    const w = this.W, r = this.rock, P = this.cradleP, t = Game.time;
    const night = Math.min(1, r.sleep * 1.1);
    this.drawRoomBg(c, night);
    FD_window(c, 170, 230, 190, 150, w, night);
    if (night > 0.05) { c.save(); c.globalAlpha = night; for (let i = 0; i < 14; i++) { const sx = 360 + ((i * 137) % 600), sy = 90 + ((i * 89) % 230); Draw.starPath(c, sx, sy, 6 + (i % 3) * 3, 2.6 + (i % 3), 5); c.fillStyle = 'rgba(255,246,200,' + (0.5 + 0.5 * Math.sin(t * 2 + i)) + ')'; c.fill(); } c.restore(); }
    // Mobile
    const my = 176, rot = Math.cos(t * 0.7);
    c.lineWidth = 3; c.strokeStyle = INK; c.beginPath(); c.moveTo(P.x, 148); c.lineTo(P.x, my); c.stroke();
    Draw.circle(c, P.x, 146, 6); Draw.fs(c, '#d9a066', 3);
    c.lineWidth = 4; c.beginPath(); c.moveTo(P.x - 90 * rot, my); c.lineTo(P.x + 90 * rot, my); c.stroke();
    for (const [k, sym, col] of [[-1, 'star', PAL.yellow], [-0.33, 'heart', '#ff9ec7'], [0.33, 'moon', '#fff3a8'], [1, 'star', '#9fe3ff']]) { const hx = P.x + k * 90 * rot; c.lineWidth = 2.5; c.beginPath(); c.moveTo(hx, my); c.lineTo(hx, my + 26 + Math.abs(k) * 18); c.stroke(); Draw.symbol(c, sym, hx, my + 42 + Math.abs(k) * 18, 14, col, 3); }
    // Held (leise daneben)
    Draw.hero(c, this.H, Math.max(View.L + 100, 110), 560, 0.8, { pose: 'stand', face: r.asleep ? 'happy' : 'smile' });
    // Wiege
    c.save(); c.translate(P.x, P.y); c.rotate(r.a); FD_cradle(c, w, r.sleep); c.restore();
    // Noten
    for (const n of r.notes) {
      const k = n.t / 2.2, x = n.x + Math.sin(n.t * 3 + n.ph) * 16, y = n.y - n.t * 60;
      c.save(); c.globalAlpha = 1 - k; c.fillStyle = '#fff'; c.strokeStyle = INK; c.lineWidth = 3;
      Draw.ellipse(c, x, y, 10, 7.5, -0.4); Draw.fs(c, w.id === 'girls' ? '#ff6fc8' : '#4f8cff', 3);
      c.beginPath(); c.moveTo(x + 9, y - 2); c.lineTo(x + 9, y - 34); c.quadraticCurveTo(x + 22, y - 26, x + 20, y - 16); c.stroke();
      c.restore();
    }
    // Z z z
    if (r.asleep) {
      const hp = { x: P.x - 92 * Math.cos(r.a) + 246 * Math.sin(r.a), y: P.y - 246 * Math.cos(r.a) - 92 * Math.sin(r.a) };
      for (const z of r.zs) { const k = z.t / 2.6; c.save(); c.globalAlpha = 1 - k; Draw.label(c, 'Z', hp.x + 50 + z.t * 30, hp.y - 50 - z.t * 50, 26 + z.t * 12, '#fff', INK); c.restore(); }
    }
    // Schlaf-Anzeige: Mond füllt sich
    const y = View.T + 118;

  }
}

/* ===== src/games/flight.js ===== */
/* =====================================================================
   Sternen-Flug – Hand-Auge-Koordination & Zählen.
   Der Held fliegt über die Stadt; der Finger bestimmt die Höhe.
   Jeder Stern fliegt in die Zählleiste oben, die Stimme zählt mit.
   (Nebel-Nick-Zeichnung kommt aus fog.js: FA_drawNick)
   ===================================================================== */
const FA_NUM = ['Null', 'Eins', 'Zwei', 'Drei', 'Vier', 'Fünf', 'Sechs', 'Sieben', 'Acht', 'Neun', 'Zehn'];
const FA_mod = (a, n) => ((a % n) + n) % n;

function FA_drawStar(c, x, y, r, ph, glow = 1) {
  c.save(); c.translate(x, y);
  if (glow > 0) { c.save(); c.globalAlpha = (0.3 + Math.sin(ph * 5) * 0.08) * glow; Draw.circle(c, 0, 0, r * 1.75); c.fillStyle = '#fff7b0'; c.fill(); c.restore(); }
  c.rotate(Math.sin(ph * 2) * 0.18);
  Draw.starPath(c, 0, 0, r, r * 0.52, 5); Draw.fs(c, PAL.yellow, Math.max(2, r * 0.11));
  Draw.shine(c, -r * 0.26, -r * 0.32, r * 0.18, r * 0.1, 0.75);
  c.fillStyle = INK;
  Draw.circle(c, -r * 0.2, -r * 0.03, r * 0.085); c.fill(); Draw.circle(c, r * 0.2, -r * 0.03, r * 0.085); c.fill();
  c.lineWidth = Math.max(1.5, r * 0.07); c.strokeStyle = INK; c.beginPath(); c.arc(0, r * 0.06, r * 0.16, 0.25, Math.PI - 0.25); c.stroke();
  c.restore();
}

/* Seitlich scrollende Stadt (Parallaxe) */
function FA_flightBg(c, w, scroll, gy) {
  Draw.sky(c, w.skyTop, w.skyBottom);
  if (w.id === 'girls') Draw.rainbow(c, 760, gy - 30, 300, 18, 0.45); else Draw.sun(c, 860, 120, 44);
  const span = View.vw + 500;
  c.save(); c.globalAlpha = 0.9;
  for (let i = 0; i < 6; i++) { const x = FA_mod(i * 290 - scroll * 0.22, span) + View.L - 220; Draw.cloud(c, x, 110 + (i % 3) * 95, 28 + (i % 3) * 9, '#fff', 0); }
  c.restore();
  // ferne Skyline
  c.save(); c.globalAlpha = 0.45; c.fillStyle = w.cityFar;
  const o1 = scroll * 0.35, i1 = Math.floor((View.L + o1) / 70) - 1;
  for (let i = i1; i < i1 + Math.ceil(View.vw / 70) + 3; i++) { const h = 130 + FA_mod(i * 53, 7) * 22; Draw.rrPath(c, i * 70 - o1, gy - h - 40, 64, h + 60, 6); c.fill(); }
  c.restore();
  // nahe Häuser
  const cols = w.cityColors, o2 = scroll * 0.75, i2 = Math.floor((View.L + o2) / 124) - 1;
  for (let i = i2; i < i2 + Math.ceil(View.vw / 124) + 3; i++) {
    const h = 100 + FA_mod(i * 47, 5) * 24;
    Draw.building(c, i * 124 - o2 + 62, gy, 100, h, cols[FA_mod(i, cols.length)], { roof: ['flat', 'antenna', 'dome', 'flat', 'spike'][FA_mod(i, 5)], heart: w.id === 'girls' });
  }
  // Boden
  if (w.id === 'girls') {
    c.fillStyle = w.grass; c.fillRect(View.L - 5, gy, View.vw + 10, View.B - gy + 10);
    c.lineWidth = 5; c.strokeStyle = INK; c.beginPath(); c.moveTo(View.L - 5, gy); c.lineTo(View.R + 5, gy); c.stroke();
    c.fillStyle = shade(w.grass, -0.12);
    const o3 = FA_mod(scroll, 60);
    for (let xx = Math.floor(View.L / 60) * 60 - o3; xx < View.R + 60; xx += 60) { c.beginPath(); c.moveTo(xx, gy + 28); c.lineTo(xx + 8, gy + 8); c.lineTo(xx + 16, gy + 28); c.closePath(); c.fill(); }
    for (let xx = Math.floor(View.L / 180) * 180 - FA_mod(scroll, 180); xx < View.R + 180; xx += 180) { Draw.heartPath(c, xx + 90, gy + 60, 9); c.fillStyle = '#ff9ccf'; c.fill(); }
  } else {
    c.fillStyle = w.sidewalk; c.fillRect(View.L - 5, gy, View.vw + 10, 24);
    c.fillStyle = w.road; c.fillRect(View.L - 5, gy + 24, View.vw + 10, View.B - gy);
    c.lineWidth = 5; c.strokeStyle = INK; c.beginPath(); c.moveTo(View.L - 5, gy); c.lineTo(View.R + 5, gy); c.moveTo(View.L - 5, gy + 24); c.lineTo(View.R + 5, gy + 24); c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.85)';
    const o3 = FA_mod(scroll, 120);
    for (let xx = Math.floor(View.L / 120) * 120 - o3 - 120; xx < View.R + 120; xx += 120) { Draw.rrPath(c, xx + 20, gy + 50, 70, 10, 5); c.fill(); }
  }
}

class FlightGame extends MiniGame {
  constructor() { super('flight'); this.rounds = 1; }
  get yMin() { return Math.max(View.T + 160, -240); }
  get yMax() { return 600; }
  get counterY() { return (View.T + 50); }
  slotPos(i) {
    const n = this.goal, gap = n > 5 ? 56 : 70;
    return { x: DW / 2 - ((n - 1) * gap) / 2 + i * gap, y: this.counterY };
  }
  start() {
    this.goal = this.small ? 5 : 10;
    this.got = 0; this.filled = 0; this.scroll = 0; this.speed = 210; this.t = 0;
    this.hero = { x: View.L - 170, y: 384, tx: 260, ty: 384, vy: 0, spinT: 0, s: 0.72 };
    tween(this.hero, { x: 260 }, 1.2, { ease: 'outCubic', owner: this });
    this.stars = []; this.flying = []; this.nextStar = 1.6; this.nick = null; this.nextNick = 8; this.ending = false; this.zoom = false; this.slotFx = [];
    this.dragging = false;
    Sound.play('rocket');
    this.sayIntro(0.5);
  }
  setTarget(p) { const h = this.hero; h.ty = clamp(p.y, this.yMin, this.yMax); h.tx = clamp(lerp(260, p.x, 0.35), 200, 440); }
  onDown(p) { this.dragging = true; this.setTarget(p); }
  onMove(p) { if (this.dragging) this.setTarget(p); }
  onUp() { this.dragging = false; }
  catchPoint() {
    const h = this.hero, rot = 1.25 + this.tilt();
    return { x: h.x + Math.sin(rot) * 52, y: h.y - Math.cos(rot) * 52 };
  }
  tilt() { return clamp(this.hero.vy * 0.0011, -0.35, 0.35); }
  collect(s) {
    s.got = true; this.got++;
    const n = this.got;
    Sound.play('count', { n }); Sound.play('sparkle');
    Voice.say(FA_NUM[n] + '!', { force: true });
    Particles.burst('spark', s.x, s.y, 12, { speed: 260, size: 13, colors: [PAL.yellow, '#fff'], life: 0.6 });
    const tp = this.slotPos(n - 1);
    this.flying.push({ sx: s.x, sy: s.y, tx: tp.x, ty: tp.y, t: 0, i: n - 1, ph: s.ph, r: s.r });
    if (this.got >= this.goal) this.ending = true;
  }
  arrive(f) {
    this.filled = Math.max(this.filled, f.i + 1); this.slotFx[f.i] = 1;
    Sound.play('pop', { pitch: 1 + f.i * 0.06 });
    Particles.burst('star', f.tx, f.ty, 8, { speed: 180, size: 10, colors: [PAL.yellow, '#fff'], life: 0.6, layer: 1 });
    if (this.filled >= this.goal && !this.zoom) {
      this.zoom = true; this.locked = true;
      Voice.say(FA_NUM[this.goal] + ' Sterne! Super!', { force: true });
      const h = this.hero;
      after(0.7, () => { Sound.play('rocket'); tween(h, { x: View.R + 280, y: h.y - 140 }, 1.1, { ease: 'inCubic', owner: this }); }, this);
      after(2.0, () => this.roundDone(), this);
    }
  }
  bump(n) {
    n.hit = true; this.hero.spinT = 0.9;
    Sound.play('boing'); Sound.play('giggle');
    Particles.burst('puff', n.x, n.y, 10, { color: '#d9d4ea', speed: 160, size: 26, life: 0.8 });
    Particles.pow(n.x - 40, n.y, 70, '#d8c8ff');
  }
  update(dt) {
    const h = this.hero; this.t += dt;
    this.scroll += this.speed * dt;
    const py = h.y;
    if (!this.zoom) { h.y += (h.ty - h.y) * Math.min(1, dt * 7); if (this.t > 1.2) h.x += (h.tx - h.x) * Math.min(1, dt * 4); }
    h.vy = this.zoom ? 0 : (h.y - py) / Math.max(dt, 0.001);
    h.spinT = Math.max(0, h.spinT - dt);
    // neue Sterne in Reichweite der aktuellen Flughöhe
    this.nextStar -= dt;
    const active = this.stars.filter((s) => !s.got).length;
    if (!this.ending && this.nextStar <= 0 && active < (this.small ? 2 : 3)) {
      const sgn = Math.random() < 0.5 ? -1 : 1, mag = this.small ? rand(50, 120) : rand(80, 210);
      let y = clamp(h.ty + sgn * mag, this.yMin, this.yMax);
      if (Math.abs(y - h.ty) < 40) y = clamp(h.ty - sgn * mag, this.yMin, this.yMax);
      this.stars.push({ x: View.R + 60, y, ph: rand(0, TAU), sp: rand(0.95, 1.1), got: false, r: 34 });
      this.nextStar = this.small ? rand(1.5, 2.0) : rand(1.0, 1.6);
    }
    const cp = this.catchPoint();
    for (const s of this.stars) {
      if (s.got) continue;
      s.x -= this.speed * s.sp * dt; s.ph += dt;
      if (this.small && s.x > h.x - 30 && s.x - h.x < 420) s.y += (h.y - s.y) * Math.min(1, dt * 0.5);
      if (!this.ending && dist(s.x, s.y, cp.x, cp.y) < 90) this.collect(s);
    }
    this.stars = this.stars.filter((s) => !s.got && s.x > View.L - 90);
    // Sterne fliegen in die Zählleiste
    for (const f of this.flying) { f.t += dt / 0.6; if (f.t >= 1 && !f.done) { f.done = true; this.arrive(f); } }
    this.flying = this.flying.filter((f) => !f.done);
    for (let i = 0; i < this.slotFx.length; i++) if (this.slotFx[i]) this.slotFx[i] = Math.max(0, this.slotFx[i] - dt * 2.5);
    // Nebel-Nick schwebt ab und zu vorbei (Anstupsen ist nur lustig)
    this.nextNick -= dt;
    if (!this.nick && !this.ending && this.got >= 1 && this.nextNick <= 0) {
      this.nick = { x: View.R + 130, y: clamp(h.y + rand(-170, 170), this.yMin + 30, 520), hit: false, ph: 0, spin: 0, s: 0.55 };
      this.nextNick = rand(9, 13);
    }
    const n = this.nick;
    if (n) {
      n.ph += dt; n.x -= this.speed * 0.75 * dt; n.y += Math.sin(n.ph * 2) * 22 * dt;
      if (n.hit) { n.y -= 190 * dt; n.x += 60 * dt; n.spin += dt * 7; }
      else if (!this.zoom && dist(cp.x, cp.y, n.x, n.y) < 88) this.bump(n);
      if (n.x < View.L - 170 || n.y < View.T - 170) this.nick = null;
    }
  }
  hint() {
    if (this.ending || this.t < 1.5) return null;
    const h = this.hero, hx = h.x + 46;
    const s = this.stars.filter((q) => !q.got && q.x > h.x + 60).sort((a, b) => a.x - b.x)[0];
    let ty = s && Math.abs(s.y - h.y) > 50 ? s.y : (h.y > 330 ? h.y - 170 : h.y + 170);
    ty = clamp(ty, this.yMin, this.yMax);
    return { x1: hx, y1: h.y - 10, x2: hx, y2: ty - 10 };
  }
  drawCounter(c) {
    const n = this.goal, r = n > 5 ? 22 : 28, a = this.slotPos(0), b = this.slotPos(n - 1);
    Draw.rrPath(c, a.x - r - 20, a.y - r - 12, b.x - a.x + 2 * r + 40, 2 * r + 24, r + 12); c.fillStyle = 'rgba(255,255,255,0.6)'; c.fill();
    for (let i = 0; i < n; i++) {
      const p = this.slotPos(i), fx = this.slotFx[i] || 0;
      c.save(); c.translate(p.x, p.y); c.scale(1 + fx * 0.5, 1 + fx * 0.5); Draw.starSlot(c, 0, 0, r, i < this.filled); c.restore();
    }
  }
  draw(c) {
    const gy = 690;
    FA_flightBg(c, this.W, this.scroll, gy);
    for (const s of this.stars) if (!s.got) FA_drawStar(c, s.x, s.y + Math.sin(s.ph * 3) * 6, s.r, s.ph);
    const n = this.nick;
    if (n) FA_drawNick(c, n.x, n.y, n.s, Game.time, n.hit ? 'dizzy' : 'grin', n.spin);
    const h = this.hero, spin = h.spinT > 0 ? TAU * (1 - h.spinT / 0.9) : 0;
    Draw.speedLines(c, h.x - 46, h.y + 6, 100, 3, '#fff', 0.65);
    Draw.hero(c, this.H, h.x, h.y, h.s, { pose: 'fly', rot: 1.25 + this.tilt() + spin, face: 'happy' });
    for (const f of this.flying) {
      const k = Ease.inOutQuad(Math.min(1, f.t)), x = lerp(f.sx, f.tx, k), y = lerp(f.sy, f.ty, k) - Math.sin(k * Math.PI) * 90;
      FA_drawStar(c, x, y, f.r * (1 - k * 0.3), f.ph + Game.time, 0.5);
    }
    this.drawCounter(c);
    this.drawHud(c);
  }
}

/* ===== src/games/fog.js ===== */
/* =====================================================================
   Nebel-Alarm – Wischen, Ursache & Wirkung, Wortschatz.
   Nebel-Nick (freche, aber liebe Wolke) pustet grauen Nebel über die
   Stadt. Mit dem Finger wegwischen → versteckte Dinge tauchen auf und
   werden benannt. Enthält auch FA_drawNick (wird von Sternen-Flug genutzt).
   ===================================================================== */
function FA_drawNick(c, x, y, s, t, mood = 'grin', spin = 0) {
  c.save(); c.translate(x, y); c.rotate(spin); c.scale(s, s);
  c.translate(0, Math.sin(t * 2.2) * 4);
  const body = '#a69fc4';
  const parts = [[-62, 10, 40], [-30, -28, 46], [22, -34, 48], [62, 4, 40], [0, 22, 54], [-40, 34, 34], [42, 34, 34]];
  c.lineWidth = 8; c.strokeStyle = INK;
  for (const [px, py, pr] of parts) { c.beginPath(); c.arc(px, py, pr, 0, TAU); c.stroke(); }
  c.fillStyle = body;
  for (const [px, py, pr] of parts) { c.beginPath(); c.arc(px, py, pr, 0, TAU); c.fill(); }
  c.save(); c.globalAlpha = 0.28; Draw.ellipse(c, 0, 44, 74, 22); c.fillStyle = '#6e6790'; c.fill(); c.restore();
  Draw.shine(c, -36, -44, 16, 9, 0.55);
  const sad = mood === 'sad';
  c.lineWidth = 5; c.strokeStyle = INK;
  for (const sx of [-1, 1]) { c.beginPath(); c.moveTo(sx * 10, sad ? -34 : -27); c.lineTo(sx * 36, sad ? -25 : -38); c.stroke(); }
  for (const sx of [-1, 1]) {
    Draw.ellipse(c, sx * 22, -10, 12, 14); Draw.fs(c, '#fff', 3.5);
    if (mood === 'dizzy') { c.lineWidth = 3; c.strokeStyle = INK; c.beginPath(); for (let a = 0; a < TAU * 1.6; a += 0.3) { const rr = 1 + a * 1.4; c.lineTo(sx * 22 + Math.cos(a + t * 8) * rr, -10 + Math.sin(a + t * 8) * rr); } c.stroke(); continue; }
    Draw.circle(c, sx * 22 - 3, -8, 6.5); c.fillStyle = INK; c.fill();
    Draw.circle(c, sx * 22 - 5, -11, 2.2); c.fillStyle = '#fff'; c.fill();
  }
  c.lineWidth = 4; c.strokeStyle = INK;
  if (mood === 'puff') {
    for (const sx of [-1, 1]) { c.save(); c.globalAlpha = 0.5; Draw.circle(c, sx * 34, 16, 13); c.fillStyle = '#ff9ec4'; c.fill(); c.restore(); }
    Draw.circle(c, 0, 22, 9); Draw.fs(c, '#5a2140', 3.5);
  } else if (sad) { c.beginPath(); c.arc(0, 34, 14, Math.PI + 0.45, TAU - 0.45); c.stroke(); }
  else if (mood === 'dizzy') { Draw.ellipse(c, 0, 24, 8, 10); Draw.fs(c, '#5a2140', 3.5); }
  else {
    c.beginPath(); c.moveTo(-22, 12); c.quadraticCurveTo(0, 38, 24, 8); c.quadraticCurveTo(2, 20, -22, 12); c.closePath(); Draw.fs(c, '#5a2140', 3.5);
    c.fillStyle = '#fff'; c.fillRect(-3, 15, 9, 7);
  }
  for (const sx of [-1, 1]) { c.save(); c.globalAlpha = 0.35; Draw.ellipse(c, sx * 44, 10, 10, 6); c.fillStyle = '#ff7fae'; c.fill(); c.restore(); }
  c.restore();
}

    for (const o of this.objs) if (o.revealed) this.drawObj(c, o, true);
    const n = this.nick; if (n && n.s > 0.01) FA_drawNick(c, n.x, n.y, n.s, Game.time, n.mood, n.spin);
    this.drawHud(c);
  }
}

/* =====================================================================
   Farben-Garage – Farben lernen: jedes Auto in die Garage mit gleicher Farbe
   ===================================================================== */
class GarageGame extends DragMatch {
  constructor() { super('garage'); this.rounds = 3; this.GY = 440; this.cheer = 0; }
  makeRound(r) {
    const n = this.small ? [2, 3, 3][r] : [3, 4, 5][r];
    const pool = this.small ? ['red', 'blue', 'yellow', 'green'] : COLOR_KEYS;
    const keys = sample(pool, n);
    const sp = n > 1 ? Math.min(230, 560 / (n - 1)) : 0, gs = Math.min(1, (sp || 230) / 205);
    const cx = 610;
    const targets = keys.map((k, i) => {
      const tg = { key: k, x: cx + (i - (n - 1) / 2) * sp, y: this.GY - 70 * gs, gs, open: 0, done: 0, app: 0, snapR: 110 + 20 * gs };
      tween(tg, { app: 1 }, 0.5, { ease: 'outBack', delay: i * 0.1, owner: this });
      return tg;
    });
    let order = shuffle(keys.slice());
    for (let k = 0; k < 5 && n > 1 && order.every((v, i) => v === keys[i]); k++) order = shuffle(keys.slice());
    const csp = n > 1 ? Math.min(220, 740 / (n - 1)) : 0, cs = Math.min(0.85, (csp || 220) / 215);
    const items = order.map((k, i) => ({ key: k, x: 530 + (i - (n - 1) / 2) * csp, y: 620, cs, r: 85 }));
    return { items, targets };
  }
  instruction() { return 'Farben-Garage! Fahr jedes Auto in die Garage mit der gleichen Farbe!'; }
  onPick(it) { Voice.say('Das ' + COLOR_DE[it.key][1] + ' Auto!', { force: true }); }
  placePos(it, tg) { return { x: tg.x, y: tg.y + 8 * tg.gs, sc: 0.62 * tg.gs / it.cs * 0.85 }; }
  onCorrect(it, tg) {
    Voice.say(cap(COLOR_DE[it.key][0]) + '! ' + pick(['Super!', 'Toll!', 'Richtig!', 'Klasse!']), { force: true });
    tween(tg, { open: 1 }, 0.25, { owner: this });
    after(0.5, () => {
      Sound.play('honk');
      tween(it, { y: tg.y - 10 * tg.gs, sc: it.sc * 0.7 }, 0.3, { ease: 'inQuad', owner: this, done: () => {
        it.hidden = true; tg.done = 1;
        tween(tg, { open: 0 }, 0.3, { owner: this });
        Particles.burst('star', tg.x, this.GY - 175 * tg.gs, 16, { speed: 260, size: 14, colors: [PAL.yellow, '#fff', PAL[it.key]], life: 0.9 });
        Sound.play('ding');
      } });
    }, this);
  }
  onWrong(it) { Voice.say('Hoppla! Das Auto ist ' + COLOR_DE[it.key][0] + '.', { force: true }); }
  onAllPlaced() {
    after(1.0, () => { this.cheer = 1; Sound.play('yay'); this.heroFlyBy(170, 1); }, this);
    return 1.4;
  }
  nextRound(r) { this.cheer = 0; super.nextRound(r); }
  hint() { const h = super.hint(); if (h) h.y2 = h.y2 + 10; return h; }
  drawScene(c) {
    Draw.city(c, this.W, { groundY: this.GY, ground: 'street', deco: false });
    // Fahrspur-Pfeile zeigen nach oben zu den Garagen
    c.save(); c.globalAlpha = 0.35; c.fillStyle = '#fff';
    for (const x of [200, 860]) { c.beginPath(); c.moveTo(x, 500); c.lineTo(x + 26, 530); c.lineTo(x + 10, 530); c.lineTo(x + 10, 560); c.lineTo(x - 10, 560); c.lineTo(x - 10, 530); c.lineTo(x - 26, 530); c.closePath(); c.fill(); }
    c.restore();
    const hx = Math.max(View.L + 95, 95);
    Draw.hero(c, this.H, hx, this.GY - 42, 0.72, { pose: this.cheer ? 'cheer' : 'point', face: this.cheer ? 'happy' : 'smile' });
  }
  drawTarget(c, tg) {
    if (tg.app <= 0.01) return;
    c.save(); c.translate(tg.x, this.GY); c.scale(tg.gs * tg.app, tg.gs * tg.app);
    const glow = Math.max(tg.glow * (0.5 + 0.5 * Math.sin(Game.time * 12)), tg.hover ? 0.7 : 0);
    Draw.garage(c, 0, 0, PAL[tg.key], tg.open, { sym: tg.done ? 'star' : this.H.sym, glow });
    if (tg.done) { c.save(); c.globalAlpha = 0.6 + 0.4 * Math.sin(Game.time * 5); Draw.starPath(c, 0, -178, 16, 7, 5); c.fillStyle = PAL.yellow; c.fill(); c.restore(); }
    c.restore();
  }
  drawItem(c, it) {
    Draw.car(c, 0, 0, it.cs, PAL[it.key], { sym: this.H.sym, symColor: it.key === 'yellow' ? PAL.red : PAL.yellow, bob: it.lift > 0 ? 0 : undefined });
  }
}

/* =====================================================================
   Kätzchen-Rettung – Zählen: Der Held rettet Kätzchen aus dem Baum,
   die Stimme zählt mit, über dem Korb stehen Zahl und Punkte.
   ===================================================================== */
const FB_NUM = ['Null', 'Eins', 'Zwei', 'Drei', 'Vier', 'Fünf', 'Sechs', 'Sieben', 'Acht', 'Neun', 'Zehn'];
const FB_KCOLORS = [
  { fur: '#ffb35c', belly: '#fff4e6', stripes: '#e08a2e' },
  { fur: '#b9c0cf', belly: '#ffffff', stripes: '#8f97a8' },
  { fur: '#ffffff', belly: '#ffe9f2' },
  { fur: '#5b5566', belly: '#d9d4e6', ear: '#e9a0c0' },
  { fur: '#f3d4a8', belly: '#fffaf0', stripes: '#d9ad72' },
  { fur: '#c98d5a', belly: '#f8e2c8', stripes: '#9c6436' },
  { fur: '#ffcce3', belly: '#ffffff' },
];
// Sitzplätze im Baum (Mitte des Kätzchens), Baumstamm bei x = 700
const FB_KSLOTS = [[700, 150], [560, 215], [840, 215], [630, 318], [772, 322], [512, 405], [890, 400]];
const FB_TREE_X = 700, FB_GROUND = 640;

/* Kätzchen (sitzend, von vorn). (x, y) = Bauchmitte; s = 1 ≈ 115 px hoch */
function FB_kitten(c, x, y, s, col, o = {}) {
  const t = o.t !== undefined ? o.t : Game.time;
  c.save(); c.translate(x, y); c.scale(s, s);
  if (o.tilt) c.rotate(o.tilt);
  c.lineCap = 'round'; c.lineJoin = 'round';
  // Schwanz
  const sw = Math.sin(t * 2.6 + (o.ph || 0)) * 0.5;
  c.beginPath();
  if (o.hang) { c.moveTo(16, 28); c.quadraticCurveTo(40 + sw * 10, 50, 30 + sw * 18, 80); }
  else { c.moveTo(20, 26); c.quadraticCurveTo(54, 22, 44 + sw * 10, -14); }
  c.lineWidth = 15; c.strokeStyle = INK; c.stroke(); c.lineWidth = 8; c.strokeStyle = col.fur; c.stroke();
  // Körper & Pfoten
  Draw.ellipse(c, 0, 10, 28, 27); Draw.fs(c, col.fur, 4);
  Draw.ellipse(c, 0, 15, 15, 16); c.fillStyle = col.belly; c.fill();
  for (const sx of [-1, 1]) { Draw.ellipse(c, sx * 12, 33, 11, 8); Draw.fs(c, col.fur, 3.5); }
  // Ohren & Kopf
  const ear = col.ear || '#ffb3cf';
  for (const sx of [-1, 1]) {
    c.beginPath(); c.moveTo(sx * 27, -40); c.lineTo(sx * 22, -74); c.lineTo(sx * 3, -58); c.closePath(); Draw.fs(c, col.fur, 4);
    c.beginPath(); c.moveTo(sx * 22, -47); c.lineTo(sx * 20, -64); c.lineTo(sx * 9, -57); c.closePath(); c.fillStyle = ear; c.fill();
  }
  Draw.circle(c, 0, -34, 29); Draw.fs(c, col.fur, 4);
  Draw.shine(c, -13, -50, 7, 4, 0.45);
  if (col.stripes) { c.strokeStyle = col.stripes; c.lineWidth = 4; for (const dx of [-8, 0, 8]) { c.beginPath(); c.moveTo(dx, -61); c.lineTo(dx * 0.8, -52); c.stroke(); } }
  Draw.ellipse(c, 0, -23, 14, 9); c.fillStyle = col.belly; c.fill();
  // Augen
  const blink = ((t + (o.ph || 0)) % 3.7) < 0.12;
  for (const sx of [-1, 1]) {
    const ex = sx * 11, ey = -38;
    if (o.happy || blink) {
      c.lineWidth = 3.5; c.strokeStyle = INK; c.beginPath();
      if (o.happy) { c.moveTo(ex - 6, ey + 2); c.quadraticCurveTo(ex, ey - 6, ex + 6, ey + 2); } else { c.moveTo(ex - 6, ey); c.quadraticCurveTo(ex, ey + 4, ex + 6, ey); }
      c.stroke(); continue;
    }
    Draw.ellipse(c, ex, ey, 7.5, 8.5); Draw.fs(c, '#fff', 2.5);
    Draw.circle(c, ex, ey + 1, 5); c.fillStyle = INK; c.fill();
    Draw.circle(c, ex - 1.6, ey - 1.6, 1.8); c.fillStyle = '#fff'; c.fill();
    if (o.worried) { c.lineWidth = 3; c.strokeStyle = INK; c.beginPath(); c.moveTo(ex + sx * 6, ey - 11); c.lineTo(ex - sx * 5, ey - 15); c.stroke(); }
  }
  // Nase, Mund, Schnurrhaare
  c.beginPath(); c.moveTo(-4.5, -29); c.lineTo(4.5, -29); c.lineTo(0, -24.5); c.closePath(); Draw.fs(c, '#ff7fae', 2);
  c.lineWidth = 2.8; c.strokeStyle = INK;
  if (o.meow > 0.05) { Draw.ellipse(c, 0, -17, 5, 4 + o.meow * 3); Draw.fs(c, '#7a1d3a', 2.5); }
  else if (o.happy) { c.beginPath(); c.moveTo(-7, -20); c.quadraticCurveTo(0, -11, 7, -20); c.closePath(); Draw.fs(c, '#7a1d3a', 2.5); }
  else { c.beginPath(); c.moveTo(-7, -21); c.quadraticCurveTo(-3.5, -16, 0, -21); c.quadraticCurveTo(3.5, -16, 7, -21); c.stroke(); }
  c.lineWidth = 2; for (const sx of [-1, 1]) for (const k of [-1, 1]) { c.beginPath(); c.moveTo(sx * 13, -25 + k * 3); c.lineTo(sx * 34, -28 + k * 7); c.stroke(); }
  for (const sx of [-1, 1]) { c.save(); c.globalAlpha = 0.35; Draw.ellipse(c, sx * 19, -26, 6, 4); c.fillStyle = '#ff6f91'; c.fill(); c.restore(); }
  c.restore();
}

/* Baum mit Krone; branches = Liste der Sitzplätze, unter die ein Ast gezeichnet wird */
function FB_tree(c, branches, w) {
  const tx = FB_TREE_X, gy = FB_GROUND;
  // Stamm
  c.beginPath(); c.moveTo(tx - 58, gy + 4); c.quadraticCurveTo(tx - 30, gy - 30, tx - 32, gy - 160); c.lineTo(tx - 24, gy - 320);
  c.lineTo(tx + 24, gy - 320); c.lineTo(tx + 32, gy - 160); c.quadraticCurveTo(tx + 30, gy - 30, tx + 58, gy + 4); c.closePath();
  Draw.fs(c, '#a0693a', 5);
  c.strokeStyle = 'rgba(70,40,20,0.35)'; c.lineWidth = 4;
  for (const [x1, y1, y2] of [[-10, gy - 40, gy - 110], [12, gy - 150, gy - 220], [-6, gy - 230, gy - 290]]) { c.beginPath(); c.moveTo(tx + x1, y1); c.quadraticCurveTo(tx + x1 + 8, (y1 + y2) / 2, tx + x1, y2); c.stroke(); }
  // Krone (zuerst Kontur, dann Füllung → eine zusammenhängende Wolke)
  const blobs = [[700, 235, 172], [545, 300, 128], [855, 300, 128], [618, 392, 108], [782, 392, 108], [606, 158, 104], [794, 158, 104], [700, 110, 96]];
  c.lineWidth = 10; c.strokeStyle = INK;
  for (const [x, y, r] of blobs) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.stroke(); }
  c.fillStyle = '#45b84a';
  for (const [x, y, r] of blobs) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
  c.fillStyle = '#6fd25c';
  for (const [x, y, r] of blobs) { c.beginPath(); c.arc(x - r * 0.22, y - r * 0.24, r * 0.62, 0, TAU); c.fill(); }
  // Äpfel (Jungs) oder Blüten (Mädels)
  const dots = [[640, 120], [760, 95], [520, 250], [880, 250], [600, 420], [800, 430], [690, 300], [470, 330], [930, 330]];
  for (const [x, y] of dots) {
    if (w.id === 'girls') { for (let i = 0; i < 5; i++) { const a = (i / 5) * TAU; Draw.circle(c, x + Math.cos(a) * 8, y + Math.sin(a) * 8, 7); c.fillStyle = '#ffb3dd'; c.fill(); } Draw.circle(c, x, y, 5); c.fillStyle = PAL.yellow; c.fill(); }
    else { Draw.circle(c, x, y, 11); Draw.fs(c, PAL.red, 3); Draw.shine(c, x - 4, y - 4, 3, 2, 0.7); c.lineWidth = 3; c.strokeStyle = '#6b4423'; c.beginPath(); c.moveTo(x, y - 10); c.lineTo(x + 2, y - 16); c.stroke(); }
  }
  // Äste unter den Kätzchen
  const segs = branches.map(([sx, sy]) => { const py = sy + 42, fy = clamp(py + 90, 270, 450); return { sx, py, fy }; });
  for (const pass of [0, 1]) {
    c.lineCap = 'round'; c.lineWidth = pass ? 17 : 27; c.strokeStyle = pass ? '#a0693a' : INK;
    for (const s of segs) {
      c.beginPath(); c.moveTo(tx, s.fy); c.quadraticCurveTo((tx + s.sx) / 2, Math.min(s.fy, s.py) - 6, s.sx, s.py); c.stroke();
      c.beginPath(); c.moveTo(s.sx - 46, s.py + 2); c.lineTo(s.sx + 46, s.py + 2); c.stroke();
    }
  }
}

/* Rettungskorb: part 'back' (Öffnung) oder 'front' (Vorderseite mit Emblem) */
function FB_basket(c, x, part, w) {
  const top = 548, gy = FB_GROUND;
  if (part === 'back') { Draw.ellipse(c, x, top, 104, 22); Draw.fs(c, '#6b4423', 4); return; }
  c.beginPath(); c.moveTo(x - 106, top); c.lineTo(x - 84, gy - 6); c.quadraticCurveTo(x, gy + 8, x + 84, gy - 6); c.lineTo(x + 106, top); c.closePath();
  Draw.fs(c, '#d9a05b', 5);
  c.save(); c.beginPath(); c.moveTo(x - 106, top); c.lineTo(x - 84, gy - 6); c.quadraticCurveTo(x, gy + 8, x + 84, gy - 6); c.lineTo(x + 106, top); c.closePath(); c.clip();
  c.strokeStyle = 'rgba(110,60,20,0.45)'; c.lineWidth = 4;
  for (let yy = top + 22; yy < gy; yy += 22) { c.beginPath(); c.moveTo(x - 110, yy); c.lineTo(x + 110, yy); c.stroke(); }
  for (let i = -5; i <= 5; i++) for (let j = 0; j < 4; j++) { const xx = x + i * 20 + (j % 2) * 10, yy = top + 4 + j * 22; c.beginPath(); c.moveTo(xx, yy + 4); c.lineTo(xx, yy + 16); c.stroke(); }
  c.restore();
  Draw.rrPath(c, x - 114, top - 12, 228, 24, 12); Draw.fs(c, '#c58840', 4);
  Draw.circle(c, x, top + 50, 24); Draw.fs(c, '#fff', 4); Draw.symbol(c, w.emblem, x, top + 50, 14, w.accent, 3);
}

/* Fluglage: Kopf zeigt in Flugrichtung, nie kopfüber */
function FB_flyRot(a, flip) {
  const phi = flip ? Math.atan2(-Math.cos(a), -Math.sin(a)) : Math.atan2(Math.cos(a), -Math.sin(a));
  return clamp(phi, 0.7, 1.75);
}

class FB_KittenGame extends MiniGame {
  constructor() { super('kittens'); this.rounds = 3; }
  counts() { return this.small ? [2, 3, 4] : [3, 5, 7]; }
  start() {
    this.home = { x: 140, y: 590 };
    this.bx = 330;
    this.hero = { x: this.home.x, y: this.home.y, pose: 'point', flip: false, dirA: 0, rot: 1.25, busy: false, face: 'smile' };
    this.inBasket = []; this.leaving = []; this.carry = null; this.drop = null;
    this.panel = { n: 0, pop: 0, show: 0, big: 0 };
    this.meowT = 2.5; this.roundOver = false;
    this.setup(0);
    this.sayIntro(0.5);
    after(5, () => { if (this.hero.pose === 'point') this.hero.pose = 'stand'; }, this);
  }
  setup(r) {
    const n = this.counts()[r];
    const order = n >= 5 ? [0, 1, 2, 3, 4, 5, 6] : n === 4 ? [1, 2, 3, 4] : n === 3 ? [0, 1, 2] : [1, 2];
    const cols = shuffle(FB_KCOLORS.slice());
    this.kittens = order.slice(0, n).map((si, i) => ({ slot: si, x: FB_KSLOTS[si][0], y: FB_KSLOTS[si][1], col: cols[i % cols.length], s: 0, state: 'tree', ph: rand(0, 6), meow: 0, sel: 0, happy: false }));
    this.kittens.forEach((k, i) => tween(k, { s: 1 }, 0.5, { ease: 'outBack', delay: 0.2 + i * 0.12, owner: this }));
    this.total = n; this.saved = 0; this.queue = []; this.roundOver = false;
  }
  nextRound(r) {
    this.hero.pose = 'stand'; this.hero.face = 'smile';
    this.inBasket.forEach((k, i) => {
      k.state = 'leaving'; k.happy = true;
      tween(k, { y: 612 }, 0.3, { ease: 'outQuad', owner: this, delay: i * 0.08 });
      tween(k, { x: View.L - 120 }, 1.1, { ease: 'inQuad', owner: this, delay: i * 0.08 });
    });
    this.leaving = this.inBasket; this.inBasket = [];
    after(2, () => { this.leaving = []; }, this);
    this.panel.n = 0; tween(this.panel, { show: 0 }, 0.25, { owner: this });
    this.setup(r);
    Voice.say('Oh nein! Noch mehr Kätzchen im Baum!', { force: true });
  }
  onDown(p) {
    if (this.roundOver) return;
    let best = null, bd = 1e9;
    for (const k of this.kittens) {
      if (k.state !== 'tree' || k.s < 0.5) continue;
      const d = dist(p.x, p.y, k.x, k.y - 15);
      if (d < 82 && d < bd) { best = k; bd = d; }
    }
    if (!best) return;
    best.state = 'queued'; best.sel = 1; best.meow = 1; tween(best, { meow: 0 }, 0.6, { owner: this });
    Sound.play('meow'); Particles.burst('heart', best.x, best.y - 40, 6, { speed: 120, size: 10, color: '#ff6fa8', life: 0.9, g: -60 });
    this.queue.push(best);
    if (!this.hero.busy) this.rescueNext();
  }
  /* Fluganimation entlang eines Bogens */
  flyTo(x, y, done) {
    const h = this.hero, sx = h.x, sy = h.y, d = dist(sx, sy, x, y);
    const dur = clamp(d / 850, 0.45, 1.0), lift = Math.min(110, Math.abs(x - sx) * 0.25);
    h.pose = 'fly'; if (Math.abs(x - sx) > 4) h.flip = x < sx;
    Sound.play('whoosh');
    const o = { t: 0 };
    tween(o, { t: 1 }, dur, {
      ease: 'inOutQuad', owner: this,
      update: () => {
        const nx = lerp(sx, x, o.t), ny = lerp(sy, y, o.t) - Math.sin(o.t * Math.PI) * lift;
        const vx = nx - h.x, vy = ny - h.y;
        if (Math.abs(vx) + Math.abs(vy) > 0.6) h.dirA = Math.atan2(vy, vx);
        h.x = nx; h.y = ny;
      },
      done,
    });
  }
  rescueNext() {
    const h = this.hero;
    const k = this.queue.shift();
    if (!k) { this.flyHome(); return; }
    h.busy = true; h.face = 'smile';
    const side = k.x < h.x ? 1 : -1; // von welcher Seite der Held kommt
    this.flyTo(side > 0 ? k.x + 78 : k.x - 78, k.y + 8, () => {
      k.state = 'carried'; k.happy = true; this.carry = k;
      Sound.play('pop'); Sound.play('meow'); h.face = 'happy';
      Particles.burst('star', k.x, k.y, 10, { speed: 200, size: 12, colors: [PAL.yellow, '#fff'], life: 0.7 });
      after(0.12, () => this.flyTo(this.bx + 70, 452, () => this.release(k)), this);
    });
  }
  carryPos() {
    const h = this.hero, phi = h.rot, s = 0.78;
    const dx = h.flip ? -Math.sin(phi) : Math.sin(phi), dy = -Math.cos(phi);
    return { x: h.x + dx * 46 * s, y: h.y + dy * 46 * s + 50 };
  }
  basketPos(i) {
    const row = Math.floor(i / 4), col = i % 4;
    return { x: this.bx - 63 + col * 42 + (row % 2) * 21, y: 530 - row * 14 };
  }
  release(k) {
    const h = this.hero, from = this.carryPos(), to = this.basketPos(this.inBasket.length);
    this.carry = null; k.state = 'drop'; k.x = from.x; k.y = from.y; this.drop = k;
    const o = { t: 0 };
    Sound.play('boing');
    tween(o, { t: 1 }, 0.55, {
      ease: 'linear', owner: this,
      update: () => { k.x = lerp(from.x, to.x, o.t); k.y = lerp(from.y, to.y, o.t) - Math.sin(o.t * Math.PI) * 70; },
      done: () => {
        k.state = 'basket'; this.drop = null; this.inBasket.push(k);
        this.saved++;
        Sound.play('count', { n: this.saved }); Sound.play('plop');
        Voice.say(FB_NUM[this.saved] + '!', { force: true });
        this.panel.n = this.saved; this.panel.pop = 1;
        if (this.panel.show < 1) tween(this.panel, { show: 1 }, 0.4, { ease: 'outBack', owner: this });
        Particles.burst('heart', to.x, to.y - 40, 8, { speed: 160, size: 11, colors: ['#ff6fa8', '#ff9ec7'], life: 1, g: -80 });
        Particles.burst('star', this.bx, 318, 10, { speed: 220, size: 12, colors: [PAL.yellow, '#fff'], life: 0.8 });
        if (this.saved >= this.total) this.finishRound();
      },
    });
    after(0.25, () => { if (this.queue.length) this.rescueNext(); else this.flyHome(); }, this);
  }
  flyHome() {
    const h = this.hero;
    this.flyTo(this.home.x, this.home.y, () => {
      h.flip = false; h.dirA = 0;
      h.pose = this.roundOver ? 'cheer' : 'stand';
      if (this.queue.length) this.rescueNext(); else h.busy = false;
    });
  }
  finishRound() {
    this.roundOver = true; this.locked = true;
    after(0.6, () => {
      tween(this.panel, { big: 1 }, 0.5, { ease: 'outBack', owner: this });
      Voice.say(FB_NUM[this.total] + ' Kätzchen gerettet!', { force: true });
      Sound.play('yay');
      if (!this.hero.busy) this.hero.pose = 'cheer';
      this.hero.face = 'happy';
      Particles.burst('heart', this.bx, 520, 16, { speed: 260, size: 13, colors: ['#ff6fa8', '#ff9ec7', '#fff'], life: 1.2, g: -60 });
    }, this);
    after(3.1, () => { tween(this.panel, { big: 0 }, 0.3, { owner: this }); this.roundDone(); }, this);
  }
  hint() {
    if (this.locked || this.hero.busy) return null;
    const k = this.kittens.find((q) => q.state === 'tree' && q.s > 0.5);
    return k ? { x1: k.x, y1: k.y - 10 } : null;
  }
  update(dt) {
    const h = this.hero;
    const target = h.pose === 'fly' ? FB_flyRot(h.dirA, h.flip) : 1.25;
    h.rot = lerp(h.rot, target, Math.min(1, dt * 10));
    this.panel.pop = Math.max(0, this.panel.pop - dt * 3);
    for (const k of this.kittens) k.sel = Math.max(0, k.sel - dt * 0.5);
    this.meowT -= dt;
    if (this.meowT <= 0) {
      this.meowT = rand(3.2, 5.5);
      const cands = this.kittens.filter((k) => k.state === 'tree' && k.s > 0.9);
      if (cands.length && !Voice.busy) { const k = pick(cands); k.meow = 1; tween(k, { meow: 0 }, 0.8, { owner: this }); Sound.play('meow'); }
    }
  }
  draw(c) {
    const w = this.W, t = Game.time;
    Draw.city(c, w, { groundY: FB_GROUND, ground: 'grass' });
    FB_tree(c, this.kittens.map((k) => FB_KSLOTS[k.slot]), w);
    // Kätzchen im Baum
    for (const k of this.kittens) {
      if (k.state !== 'tree' && k.state !== 'queued') continue;
      if (k.s <= 0.01) continue;
      const bob = Math.sin(t * 2 + k.ph) * 2, sc = 1.12 * k.s * (1 + k.meow * 0.08);
      if (k.state === 'queued') { c.save(); c.globalAlpha = 0.5 + Math.sin(t * 8) * 0.2; Draw.circle(c, k.x, k.y - 12, 70); c.lineWidth = 8; c.strokeStyle = '#fff'; c.stroke(); c.restore(); }
      FB_kitten(c, k.x, k.y + bob, sc, k.col, { hang: true, worried: k.state === 'tree', meow: k.meow, ph: k.ph, tilt: Math.sin(t * 1.5 + k.ph) * 0.06 });
    }
    // Korb mit geretteten Kätzchen
    FB_basket(c, this.bx, 'back', w);
    const inB = this.inBasket.slice().sort((a, b) => a.y - b.y);
    for (const k of inB) FB_kitten(c, k.x, k.y + Math.sin(t * 3 + k.ph) * 1.5, 0.76, k.col, { happy: true, ph: k.ph, tilt: Math.sin(t * 2 + k.ph) * 0.08 });
    FB_basket(c, this.bx, 'front', w);
    this.drawPanel(c);
    // Held
    const h = this.hero;
    if (h.pose === 'fly') {
      const sp = Math.abs(Math.cos(h.dirA)) > 0.3;
      if (sp) Draw.speedLines(c, h.x + (h.flip ? 60 : -60), h.y, 70, 3, '#fff', 0.55);
      Draw.hero(c, this.H, h.x, h.y, 0.78, { pose: 'fly', flip: h.flip, rot: h.rot, face: h.face });
    } else Draw.hero(c, this.H, h.x, h.y, 0.85, { pose: h.pose, face: h.face });
    if (this.carry) { const cp = this.carryPos(); FB_kitten(c, cp.x, cp.y, 0.8, this.carry.col, { happy: true, ph: this.carry.ph }); }
    if (this.drop) FB_kitten(c, this.drop.x, this.drop.y, 0.76, this.drop.col, { happy: true, ph: this.drop.ph });
    for (const k of this.leaving) FB_kitten(c, k.x, k.y + Math.abs(Math.sin(t * 12 + k.ph)) * -10, 0.72, k.col, { happy: true, ph: k.ph });
    this.drawHud(c);
  }
  drawPanel(c) {
    const P = this.panel; if (P.show <= 0.01) return;
    const x = this.bx, y = 318, s = P.show * (1 + P.pop * 0.18 + P.big * 0.22), n = P.n;
    c.save(); c.translate(x, y); c.scale(s, s);
    if (P.big > 0.01) { c.save(); c.globalAlpha = P.big; c.rotate(Game.time * 0.6); Draw.burst(c, 0, 0, 125, '#fff3a8', 14, 4); c.restore(); }
    const rows = n > 5 ? 2 : 1, ph = 128 + rows * 28;
    Draw.rrPath(c, -86, -ph / 2, 172, ph, 30); Draw.fs(c, '#fff', 5);
    const dy = -ph / 2 + 62;
    Draw.label(c, String(n), 0, dy, 96, this.W.ui, INK, 700);
    for (let i = 0; i < n; i++) {
      const row = Math.floor(i / 5), inRow = row === 0 ? Math.min(n, 5) : n - 5, col = i % 5;
      const dx = (col - (inRow - 1) / 2) * 30, yy = dy + 66 + row * 28;
      Draw.circle(c, dx, yy, 11); Draw.fs(c, PAL.orange, 3.5);
    }
    c.restore();
  }
}

   Zu Rundenbeginn liegen die Karten kurz offen („Schau gut hin!“).

const FB_MEM_OBJECTS = [
  { kind: 'rocket', say: 'Eine Rakete!' },
  { kind: 'star', say: 'Ein Stern!' },
  { kind: 'heart', say: 'Ein Herz!' },
  { kind: 'car', say: 'Ein Auto!' },
  { kind: 'sun', say: 'Die Sonne!' },
  { kind: 'moon', say: 'Der Mond!' },
];

function FB_cuteFace(c, x, y, s) {
  c.save(); c.translate(x, y); c.scale(s, s);
  for (const sx of [-1, 1]) { Draw.ellipse(c, sx * 14, -6, 6, 8); c.fillStyle = INK; c.fill(); Draw.circle(c, sx * 14 - 2, -9, 2.4); c.fillStyle = '#fff'; c.fill(); }
  c.lineWidth = 4; c.strokeStyle = INK; c.lineCap = 'round'; c.beginPath(); c.moveTo(-10, 8); c.quadraticCurveTo(0, 18, 10, 8); c.stroke();
  for (const sx of [-1, 1]) { c.save(); c.globalAlpha = 0.4; Draw.ellipse(c, sx * 25, 6, 7, 4.5); c.fillStyle = '#ff6f91'; c.fill(); c.restore(); }
  c.restore();
}

function FB_rocket(c, x, y, s) {
  c.save(); c.translate(x, y); c.scale(s, s); c.rotate(0.35);
  const fl = 1 + Math.sin(Game.time * 18) * 0.12;
  c.beginPath(); c.moveTo(-22, 66); c.quadraticCurveTo(0, 66 + 70 * fl, 22, 66); c.closePath(); Draw.fs(c, PAL.orange, 4);
  c.beginPath(); c.moveTo(-11, 66); c.quadraticCurveTo(0, 66 + 40 * fl, 11, 66); c.closePath(); c.fillStyle = PAL.yellow; c.fill();
  for (const sx of [-1, 1]) { c.beginPath(); c.moveTo(sx * 28, 14); c.lineTo(sx * 58, 72); c.lineTo(sx * 24, 62); c.closePath(); Draw.fs(c, PAL.red, 4); }
  c.beginPath(); c.moveTo(0, -94); c.bezierCurveTo(48, -60, 42, 30, 30, 70); c.lineTo(-30, 70); c.bezierCurveTo(-42, 30, -48, -60, 0, -94); c.closePath(); Draw.fs(c, '#f4f6fb', 4);
  c.save(); c.clip(); c.fillStyle = PAL.red; c.fillRect(-60, -110, 120, 52); c.fillStyle = 'rgba(0,0,0,0.08)'; c.fillRect(12, -110, 60, 200); c.restore();
  c.beginPath(); c.moveTo(0, -94); c.bezierCurveTo(48, -60, 42, 30, 30, 70); c.lineTo(-30, 70); c.bezierCurveTo(-42, 30, -48, -60, 0, -94); c.closePath(); c.lineWidth = 4; c.strokeStyle = INK; c.stroke();
  c.lineWidth = 4; c.beginPath(); c.moveTo(-34, -58); c.lineTo(34, -58); c.stroke();
  Draw.circle(c, 0, -12, 20); Draw.fs(c, '#7fd3ff', 4); Draw.shine(c, -6, -18, 6, 4, 0.7);
  c.restore();
}

/* Bild auf der Vorderseite (zentriert, passend zur Kartenbreite w) */
function FB_memPicture(c, f, w) {
  switch (f.kind) {
    case 'hero': Draw.heroHead(c, HEROES[f.id], 0, w * 0.1, w / 185, { face: 'happy' }); break;
    case 'rocket': FB_rocket(c, 0, -w * 0.04, w / 270); break;
    case 'star': Draw.starPath(c, 0, w * 0.03, w * 0.37, w * 0.18, 5); Draw.fs(c, PAL.yellow, 5); Draw.shine(c, -w * 0.1, -w * 0.08, w * 0.05, w * 0.03, 0.7); FB_cuteFace(c, 0, w * 0.07, w / 220); break;
    case 'heart': Draw.heartPath(c, 0, -w * 0.02, w * 0.33); Draw.fs(c, '#ff4f6d', 5); Draw.shine(c, -w * 0.14, -w * 0.12, w * 0.06, w * 0.035, 0.7); FB_cuteFace(c, 0, w * 0.02, w / 210); break;
    case 'car': Draw.car(c, 0, w * 0.02, w / 245, f.color, { bob: 0, sym: 'star' }); break;
    case 'sun': {
      c.save(); c.rotate(Game.time * 0.4);
      for (let i = 0; i < 10; i++) { c.save(); c.rotate((i / 10) * TAU); c.beginPath(); c.moveTo(-w * 0.05, -w * 0.25); c.lineTo(0, -w * 0.37); c.lineTo(w * 0.05, -w * 0.25); c.closePath(); Draw.fs(c, '#ffb81f', 3.5); c.restore(); }
      c.restore();
      Draw.circle(c, 0, 0, w * 0.24); Draw.fs(c, PAL.yellow, 5); FB_cuteFace(c, 0, w * 0.02, w / 200); break;
    }
    case 'moon': {
      Draw.moonPath(c, w * 0.04, 0, w * 0.32); Draw.fs(c, '#ffe066', 5);
      c.save(); c.lineWidth = 4; c.strokeStyle = INK; c.lineCap = 'round';
      c.beginPath(); c.moveTo(-w * 0.2, -w * 0.06); c.quadraticCurveTo(-w * 0.15, -w * 0.02, -w * 0.1, -w * 0.06); c.stroke();
      c.beginPath(); c.moveTo(-w * 0.2, w * 0.08); c.quadraticCurveTo(-w * 0.14, w * 0.13, -w * 0.08, w * 0.08); c.stroke(); c.restore();
      Draw.starPath(c, w * 0.26, -w * 0.22, w * 0.07, w * 0.03, 5); Draw.fs(c, '#fff', 3);
      Draw.starPath(c, w * 0.3, w * 0.12, w * 0.05, w * 0.022, 5); Draw.fs(c, '#fff', 3);
      break;
    }
    default: break;
  }
}
function FB_cardBack(c, w, h, W) {
  Draw.rrPath(c, -w / 2, -h / 2, w, h, w * 0.12); Draw.fs(c, W.card, 5);
  c.save(); Draw.rrPath(c, -w / 2, -h / 2, w, h, w * 0.12); c.clip();
  c.fillStyle = 'rgba(255,255,255,0.18)';
  const step = w / 4;
  for (let yy = -h / 2 + step / 2, j = 0; yy < h / 2; yy += step, j++) for (let xx = -w / 2 + step / 2 + (j % 2) * step / 2; xx < w / 2; xx += step) {
    if (W.id === 'girls') { Draw.heartPath(c, xx, yy, step * 0.16); c.fill(); } else { Draw.starPath(c, xx, yy, step * 0.18, step * 0.08, 5); c.fill(); }
  }
  c.restore();
  Draw.rrPath(c, -w / 2 + 9, -h / 2 + 9, w - 18, h - 18, w * 0.09); c.lineWidth = 5; c.strokeStyle = 'rgba(255,255,255,0.85)'; c.stroke();
  Draw.circle(c, 0, 0, w * 0.25); Draw.fs(c, '#fff', 4.5);
  Draw.symbol(c, W.emblem, 0, 0, w * 0.15, W.accent, 4);
}
function FB_cardFront(c, w, h, W, face, glow = 0) {
  if (glow > 0) { c.save(); c.globalAlpha = glow; Draw.rrPath(c, -w / 2 - 9, -h / 2 - 9, w + 18, h + 18, w * 0.15); c.fillStyle = '#ffe14d'; c.fill(); c.restore(); }
  Draw.rrPath(c, -w / 2, -h / 2, w, h, w * 0.12); Draw.fs(c, '#fffaf0', 5);
  Draw.rrPath(c, -w / 2 + 9, -h / 2 + 9, w - 18, h - 18, w * 0.09); c.lineWidth = 5; c.strokeStyle = rgba(W.card, 0.35); c.stroke();
  c.save(); Draw.rrPath(c, -w / 2 + 6, -h / 2 + 6, w - 12, h - 12, w * 0.1); c.clip();
  FB_memPicture(c, face, w);
  c.restore();
}

class FB_MemoryGame extends MiniGame {
  constructor() { super('memory'); this.rounds = 3; }
  pairsFor(r) { return (this.small ? [2, 3, 4] : [3, 4, 6])[r]; }
  start() {
    this.cards = []; this.oldCards = []; this.open = []; this.pending = null;
    this.peek = { show: 0, side: 1 };
    this.deal(0);
    this.sayIntro(0.4);
  }
  nextRound(r) {
    this.locked = true;
    this.oldCards = this.cards;
    this.oldCards.forEach((cd, i) => tween(cd, { s: 0 }, 0.3, { ease: 'inBack', delay: i * 0.03, owner: this }));
    this.cards = [];
    after(0.45, () => { this.oldCards = []; this.deal(r); Voice.say('Schau gut hin!', { force: true }); }, this);
  }
  layout(n) {
    const [cols, rows] = n <= 4 ? [n, 1] : n === 6 ? [3, 2] : n === 8 ? [4, 2] : [4, 3];
    const AW = 900, AH = 620, gap = 22, aspect = 1.18, top = 128;
    const w = Math.min((AW - (cols - 1) * gap) / cols, (AH - (rows - 1) * gap) / rows / aspect, 205), h = w * aspect;
    const cy = top + AH / 2, pos = [];
    for (let i = 0; i < n; i++) { const col = i % cols, row = Math.floor(i / cols); pos.push({ x: DW / 2 + (col - (cols - 1) / 2) * (w + gap), y: cy + (row - (rows - 1) / 2) * (h + gap) }); }
    return { w, h, pos };
  }
  deal(r) {
    const n = this.pairsFor(r), W = this.W;
    const heroes = shuffle(W.heroes.map((id) => ({ kind: 'hero', id, key: 'h-' + id, say: HEROES[id].name + '!' })));
    const objs = shuffle(FB_MEM_OBJECTS.map((o) => ({ ...o, key: o.kind, color: pick([PAL.red, PAL.blue, PAL.green, PAL.purple, PAL.orange]) })));
    const nh = Math.min(heroes.length, Math.ceil(n / 2));
    const faces = heroes.slice(0, nh).concat(objs.slice(0, n - nh));
    const deck = shuffle(faces.concat(faces).map((f) => f));
    const L = this.layout(deck.length); this.cw = L.w; this.ch = L.h;
    this.cards = deck.map((f, i) => ({ face: f, x: L.pos[i].x, y: L.pos[i].y, s: 0, flip: 1, jy: 0, open: false, matched: false, glow: 0 }));
    this.cards.forEach((cd, i) => tween(cd, { s: 1 }, 0.4, { ease: 'outBack', delay: 0.05 + i * 0.06, owner: this }));
    this.open = []; this.pending = null; this.locked = true;
    const preview = r === 0 ? 3.4 : (this.small ? 2.4 : 1.7);
    after(preview, () => {
      Sound.play('flip');
      this.cards.forEach((cd, i) => tween(cd, { flip: 0 }, 0.3, { ease: 'inOutQuad', delay: i * 0.04, owner: this }));
      after(0.35 + this.cards.length * 0.04, () => { this.locked = false; Game.lastInput = Game.time; }, this);
    }, this);
  }
  cardAt(p) {
    for (const cd of this.cards) if (inRect(p, cd.x, cd.y, this.cw + 12, this.ch + 12)) return cd;
    return null;
  }
  onDown(p) {
    const cd = this.cardAt(p);
    if (!cd || cd.matched || cd.open) return;
    if (this.pending) { Timers.cancel(this.pending.timer); this.closePair(this.pending.a, this.pending.b, true); this.pending = null; }
    this.openCard(cd);
  }
  openCard(cd) {
    cd.open = true; Sound.play('flip');
    tween(cd, { flip: 1 }, 0.3, { ease: 'outQuad', owner: this });
    this.open.push(cd);
    if (this.open.length < 2) { Voice.say(cd.face.say, { force: true }); return; }
    const [a, b] = this.open; this.open = [];
    if (a.face.key === b.face.key) {
      Voice.say(b.face.say + ' Super!', { force: true });
      after(0.35, () => this.matchPair(a, b), this);
    } else {
      Voice.say(b.face.say, { force: true });
      this.pending = { a, b, timer: after(1.3, () => { this.pending = null; this.closePair(a, b); }, this) };
    }
  }
  matchPair(a, b) {
    for (const cd of [a, b]) {
      cd.matched = true; cd.jy = -34; tween(cd, { jy: 0 }, 0.6, { ease: 'outBounce', owner: this });
      Particles.burst('star', cd.x, cd.y, 16, { speed: 300, size: 15, colors: [PAL.yellow, '#fff', this.W.ui], life: 0.9 });
    }
    Sound.play('ding');
    this.peekHero();
    if (this.cards.every((cd) => cd.matched)) {
      this.locked = true;
      after(0.5, () => { Particles.pow(DW / 2, 430, 120, PAL.yellow, 0); Sound.play('yay'); }, this);
      after(1.5, () => this.roundDone(), this);
    }
  }
  closePair(a, b, quick) {
    for (const cd of [a, b]) { cd.open = false; tween(cd, { flip: 0 }, quick ? 0.18 : 0.3, { ease: 'inOutQuad', owner: this }); }
    if (!quick) Sound.play('boop');
  }
  peekHero() {
    const P = this.peek; P.side = -P.side;
    Tweens.kill(P); P.show = 0;
    tween(P, { show: 1 }, 0.35, { ease: 'outBack', owner: this });
    tween(P, { show: 0 }, 0.35, { ease: 'inQuad', delay: 1.4, owner: this });
  }
  hint() {
    if (this.locked || this.pending) return null;
    if (this.open.length === 1) {
      const o = this.open[0], partner = this.cards.find((cd) => cd !== o && !cd.matched && cd.face.key === o.face.key);
      return partner ? { x1: partner.x, y1: partner.y } : null;
    }
    const closed = this.cards.filter((cd) => !cd.matched && !cd.open);
    if (!closed.length) return null;
    const cd = closed[Math.floor((Game.time * 0.37) % closed.length)];
    return { x1: cd.x, y1: cd.y };
  }
  update(dt) {
    for (const cd of this.cards) if (cd.matched) cd.glow = 0.55 + Math.sin(Game.time * 4 + cd.x * 0.01) * 0.25;
  }
  drawCard(c, cd) {
    if (cd.s <= 0.01) return;
    const k = Math.abs(Math.cos(cd.flip * Math.PI)), front = cd.flip > 0.5;
    c.save(); c.translate(cd.x, cd.y + cd.jy);

/* =====================================================================
   Helden-Musik – Musik, Farben, Hör-Gedächtnis.
   Runde 1: frei spielen (Xylophon mit 6 Farben). Runden 2–3: der Held
   spielt eine kleine Melodie vor, das Kind spielt sie nach.
   ===================================================================== */
const FF_XYL = [
  { key: 'red', midi: 72, name: 'Rot' }, { key: 'orange', midi: 74, name: 'Orange' }, { key: 'yellow', midi: 76, name: 'Gelb' },
  { key: 'green', midi: 77, name: 'Grün' }, { key: 'blue', midi: 79, name: 'Blau' }, { key: 'purple', midi: 81, name: 'Lila' },
];
function FF_marimba(midi, vol = 1) {
  if (!Sound.ok) return;
  const f = NOTE(midi);
  Sound.tone({ f, dur: 0.8, vol: 0.3 * vol, a: 0.003 });
  Sound.tone({ f: f * 4, dur: 0.08, vol: 0.06 * vol, a: 0.002 });
  Sound.tone({ f: f * 2, dur: 0.28, vol: 0.06 * vol, a: 0.003, type: 'triangle' });
  Sound.hiss({ f: 2600, dur: 0.02, vol: 0.05 * vol, filter: 'highpass' });
}
function FF_applause() {
  if (!Sound.ok || !Store.data.settings.sfx) return;
  for (let i = 0; i < 46; i++) Sound.hiss({ f: rand(1200, 3400), q: 1.3, dur: 0.025, vol: rand(0.05, 0.13), when: rand(0, 1.5) * rand(0.4, 1) });
  Sound.play('yay');
}
function FF_noteShape(c, x, y, s, col, rot = 0) {
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
  c.lineWidth = 4; c.strokeStyle = INK;
  c.beginPath(); c.moveTo(9, 4); c.lineTo(9, -36); c.quadraticCurveTo(22, -30, 24, -16); c.stroke();
  Draw.ellipse(c, 0, 4, 12, 9, -0.35); Draw.fs(c, col, 3.5);
  c.restore();
}
function FF_drawEar(c, x, y, s) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.beginPath(); c.moveTo(-6, 26); c.bezierCurveTo(-26, 26, -24, 0, -22, -10); c.bezierCurveTo(-18, -34, 18, -36, 20, -8); c.bezierCurveTo(22, 10, 2, 8, 4, 26); c.bezierCurveTo(6, 40, -10, 40, -6, 26); c.closePath();
  Draw.fs(c, '#ffd9b8', 4);
  c.lineWidth = 4; c.strokeStyle = INK; c.beginPath(); c.moveTo(-10, -2); c.bezierCurveTo(-10, -20, 10, -20, 8, -4); c.stroke();
  c.restore();
}

class FF_MusicGame extends MiniGame {

    if (this.phase === 'turn' || this.phase === 'wait' || this.phase === 'demo') return 'Hör gut zu und spiel nach!';
    return 'Helden-Musik! Tipp auf die bunten Tasten und mach Musik!';
  }

    this.bars = FF_XYL.map((b, i) => ({ ...b, i, x: x0 + i * (bw + gap), y: 630, w: bw, h: 224 - i * 11, lit: 0, press: 0 }));
    this.crowd = []; for (let i = 0; i < 9; i++) this.crowd.push({ x: 150 + i * 90, col: CONFETTI[i % 7], ear: i % 3 });
    this.fx = []; this.dance = 0; this.flash = 0; this.flashCol = '#ffffff'; this.jump = 0; this.mallet = null; this.cheer = 0; this.poseI = 0;

    }
    const sx = this.cx - cx, sy = this.cy - cy;
    if ((this.v > 820 || this.speedFx > 0) && Math.cos(this.ang) > 0.5) Draw.speedLines(c, sx - 70, sy - 30, 120, 4, '#fff', 0.75);
    const ch = this.choice || this.choices[0], on = this.phase === 'race' && (this.holding || this.helping());
    FC_drawCar(c, ch.kind, sx, sy, this.ang, FC_CAR_S, { color: ch.color, color2: ch.color2, hero: this.H, wheelRot: this.wheelRot, flame: on ? 1 : this.speedFx > 0 ? 0.7 : 0, bounce: this.bounce });
    if (this.helping()) { c.save(); c.globalAlpha = 0.35 + 0.2 * Math.sin(Game.time * 12); const cc = this.carCenter(); Draw.circle(c, cc.x - cx, cc.y - cy, 70); c.fillStyle = '#fff7a8'; c.fill(); c.restore(); }
    this.drawLights(c);
    this.drawCounter(c);

  }
  drawBg(c, cx, cy) {
    const w = this.W, gy = FC_GROUND - cy;
    Draw.sky(c, w.skyTop, w.skyBottom);
    if (w.id === 'girls') Draw.rainbow(c, 760, gy - 30, 300, 18, 0.5); else Draw.sun(c, 860, 120, 44);
    for (let i = 0; i < 5; i++) { const span = View.vw + 400, xx = ((((i * 330 - cx * 0.12) % span) + span) % span) + View.L - 200; Draw.cloud(c, xx, 90 + (i % 2) * 70 - cy * 0.2, 30 + (i % 3) * 8, '#fff', 0); }
    // ferne Skyline
    c.save(); c.globalAlpha = 0.45; c.fillStyle = w.cityFar;
    const o1 = cx * 0.25;
    for (let xx = Math.floor((View.L + o1 - 80) / 70) * 70; xx < View.R + o1 + 70; xx += 70) { const k = Math.abs(Math.round(xx / 70)), h = 120 + ((k * 53) % 7) * 22; Draw.rrPath(c, xx - o1, gy - h - 40 + cy * 0.6, 64, h + 80, 6); c.fill(); }
    c.restore();
    // Häuser
    const o2 = cx * 0.5, cols = w.cityColors;
    for (let xx = Math.floor((View.L + o2 - 140) / 150) * 150; xx < View.R + o2 + 150; xx += 150) {
      const k = Math.abs(Math.round(xx / 150)), h = 100 + (k * 47 % 5) * 24;
      Draw.building(c, xx - o2 + 70, gy - 6 + cy * 0.3, 96, h, cols[k % cols.length], { roof: ['flat', 'antenna', 'dome', 'flat', 'spike'][k % 5], heart: w.id === 'girls' });
    }
    // Wiese
    c.fillStyle = w.grass; c.fillRect(View.L - 5, gy, View.vw + 10, View.B - gy + 10);
    c.lineWidth = 5; c.strokeStyle = INK; c.beginPath(); c.moveTo(View.L - 5, gy); c.lineTo(View.R + 5, gy); c.stroke();
    c.fillStyle = shade(w.grass, -0.12);
    for (let xx = Math.floor((View.L + cx) / 60) * 60; xx < View.R + cx + 60; xx += 60) { const x = xx - cx; c.beginPath(); c.moveTo(x, gy + 28); c.lineTo(x + 8, gy + 8); c.lineTo(x + 16, gy + 28); c.closePath(); c.fill(); }
  }
  drawTrack(c, cx, cy) {
    const tr = this.track, P = tr.pts, w = this.W, L = View.L - 300 + cx, R = View.R + 300 + cx, gy = FC_GROUND - cy;
    const pc = shade(w.ui, -0.3);
    for (const pl of tr.pillars) {
      if (pl.x < L || pl.x > R) continue;
      const x = pl.x - cx, top = pl.y - cy + 12;
      if (pl.loop) { c.beginPath(); c.moveTo(x - 50, gy); c.lineTo(x - 12, top); c.lineTo(x + 12, top); c.lineTo(x + 50, gy); c.closePath(); Draw.fs(c, pc, 4); continue; }
      if (gy - top < 6) continue;
      Draw.rrPath(c, x - 9, top, 18, gy - top + 4, 4); Draw.fs(c, pc, 3.5);
      Draw.rrPath(c, x - 18, gy - 8, 36, 12, 4); Draw.fs(c, pc, 3);
    }
    // Bahn: Kontur, Band, weiße Schienen
    const passes = [[40, INK, 0], [30, w.ui, 0], [6, shade(w.ui, 0.35), -2], [4, '#ffffff', -11], [4, '#ffffff', 11]];
    for (const [lw, col, off] of passes) {
      c.lineWidth = lw; c.strokeStyle = col; c.beginPath(); let pen = false;
      for (let i = 0; i < P.length; i++) {
        const q = P[i];
        if (q.air || q.x < L || q.x > R) { pen = false; continue; }
        const px = q.x + q.nx * off - cx, py = q.y + q.ny * off - cy;
        if (!pen) { c.moveTo(px, py); pen = true; } else c.lineTo(px, py);
      }
      c.stroke();
    }
    // Turbo-Felder
    for (const b of tr.boosts) {
      if (b.x1 < L || b.x0 > R) continue;
      const glow = Game.time - b.last < 0.6 ? 1 : 0.5 + 0.5 * Math.sin(Game.time * 8);
      for (let k = 0; k < 4; k++) {
        const x = b.x0 + 26 + k * 36 + ((Game.time * 70) % 36) - cx, y = b.y - cy - 1;
        c.save(); c.globalAlpha = 0.6 + 0.4 * glow; c.beginPath(); c.moveTo(x - 9, y - 10); c.lineTo(x + 5, y); c.lineTo(x - 9, y + 10); c.lineTo(x - 2, y); c.closePath(); Draw.fs(c, PAL.yellow, 2.5); c.restore();
      }
    }
    // Start-Tor & Ziel-Bogen
    this.drawGate(c, 110 - cx, 470 - cy, false);
    this.drawGate(c, tr.finishX - cx, tr.finishY - cy, true);
  }
  drawGate(c, x, y, finish) {
    if (x < View.L - 200 || x > View.R + 200) return;
    const w = this.W, top = y - 150;
    for (const dx of [-62, 62]) { Draw.rrPath(c, x + dx - 9, top, 18, 160, 6); Draw.fs(c, finish ? '#ffffff' : w.accent, 4); }
    Draw.rrPath(c, x - 92, top - 18, 184, 48, 14); Draw.fs(c, finish ? '#fff' : w.ui, 4);
    if (finish) {
      c.save(); Draw.rrPath(c, x - 88, top - 14, 176, 40, 12); c.clip();
      for (let i = 0; i < 22; i++) for (let j = 0; j < 4; j++) if ((i + j) % 2 === 0) { c.fillStyle = INK; c.fillRect(x - 88 + i * 10, top - 14 + j * 10, 10, 10); }
      c.restore();
      // Flagge
      const wv = Math.sin(Game.time * (6 + this.flagWave * 6));
      c.lineWidth = 5; c.strokeStyle = INK; c.beginPath(); c.moveTo(x + 62, top - 18); c.lineTo(x + 62, top - 90); c.stroke();
      c.save(); c.beginPath(); c.moveTo(x + 62, top - 90); c.quadraticCurveTo(x + 92, top - 98 + wv * 6, x + 124, top - 88); c.lineTo(x + 124, top - 52 + wv * 4); c.quadraticCurveTo(x + 92, top - 62 - wv * 6, x + 62, top - 54); c.closePath();
      c.fillStyle = '#fff'; c.fill(); c.clip();
      for (let i = 0; i < 7; i++) for (let j = 0; j < 5; j++) if ((i + j) % 2 === 0) { c.fillStyle = INK; c.fillRect(x + 62 + i * 9, top - 100 + j * 9 + wv * 2, 9, 9); }
      c.restore();
      c.beginPath(); c.moveTo(x + 62, top - 90); c.quadraticCurveTo(x + 92, top - 98 + wv * 6, x + 124, top - 88); c.lineTo(x + 124, top - 52 + wv * 4); c.quadraticCurveTo(x + 92, top - 62 - wv * 6, x + 62, top - 54); c.closePath(); c.lineWidth = 3.5; c.strokeStyle = INK; c.stroke();
    } else {
      Draw.circle(c, x, top + 6, 28); Draw.fs(c, '#fff', 4); Draw.symbol(c, w.emblem, x, top + 6, 17, w.accent, 3);
    }
  }
  drawLights(c) {
    if (this.lightA <= 0.01) return;
    const x = DW / 2, y = View.T + 214;
    c.save(); c.globalAlpha = this.lightA;
    Draw.rrPath(c, x - 150, y - 56, 300, 112, 30); Draw.fs(c, '#2c2a45', 5);
    const cols = [PAL.red, PAL.yellow, PAL.green];
    for (let i = 0; i < 3; i++) {
      const lx = x - 90 + i * 90, on = this.lights >= 4 ? i === 2 : this.lights > i;
      const col = this.lights >= 4 ? PAL.green : cols[Math.min(i, 1)];

      Draw.circle(c, lx, y, 34); Draw.fs(c, on ? col : '#4a4766', 4);

  drawCounter(c) {
    const n = this.track.stars.length; if (!n) return;

  drawTurbo(c) {

    const pulse = on || rev ? 1 + Math.sin(Game.time * 22) * 0.04 : 1 + Math.sin(Game.time * 4) * 0.06;

    Draw.shine(c, -b.r * 0.35, -b.r * 0.48, b.r * 0.3, b.r * 0.15, 0.5);
    c.restore();
  }
  drawChoose(c) {
    Draw.city(c, this.W, { groundY: 470, ground: 'street' });
    c.save(); c.globalAlpha = 0.25; c.fillStyle = '#fff'; c.fillRect(View.L - 5, View.T - 5, View.vw + 10, View.vh + 10); c.restore();

      FC_drawCar(c, ch.kind, 0, jump + 2, sel ? Math.sin(Game.time * 7) * 0.05 : 0, 1.12 * (1 + ch.pop * 0.12), { color: ch.color, color2: ch.color2, hero: this.H, wheelRot: sel ? Game.time * 8 : 0, flame: sel ? 0.8 : 0 });
      c.restore();
    }
  }
}
