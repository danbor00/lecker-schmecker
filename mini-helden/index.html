<!doctype html>
<html lang="de">

  body { height: 100%; margin: 0; overflow: hidden; background: #3a2a9a; overscroll-behavior: none; touch-action: none;

<body>
<canvas id="game" role="img" aria-label="Mini-Helden – Superhelden-Lernspiele für Kinder von 2 bis 4"></canvas>
<script>
/* ===== src/core.js ===== */
'use strict';
/* =====================================================================
   Mini-Helden – Superhelden-Lernspiele für Kinder von 2 bis 4
   Kern: Canvas, Skalierung, Spielschleife, Eingabe (ein Finger), Tweens,
   Partikel, Ton (WebAudio, live erzeugt), Musik, Sprache (iPad-Stimme),
   Zeigehand-Hilfe, Szenenwechsel.
   Logisches Koordinatensystem: sicherer Bereich 1024×768 (iPad 4:3);
   Hintergründe werden bis zu den echten Bildschirmrändern verlängert
   (View.L/T/R/B), damit hoch und quer alles passt.
   ===================================================================== */
const TAU = Math.PI * 2;
const DW = 1024, DH = 768;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function sample(arr, n) { return shuffle(arr.slice()).slice(0, n); }
window.__errors = [];
window.addEventListener('error', (e) => { window.__errors.push(String(e.message || e)); });

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const View = {
  cw: 0, ch: 0, dpr: 1, sc: 1, vw: DW, vh: DH, ox: 0, oy: 0,
  get L() { return -this.ox; }, get T() { return -this.oy; },
  get R() { return DW + this.ox; }, get B() { return DH + this.oy; },
  get portrait() { return this.ch > this.cw * 1.05; },
};
function resize() {
  const w = Math.max(1, canvas.clientWidth || window.innerWidth), h = Math.max(1, canvas.clientHeight || window.innerHeight);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  View.cw = w; View.ch = h; View.dpr = dpr;
  View.sc = Math.min(w / DW, h / DH);
  View.vw = w / View.sc; View.vh = h / View.sc;
  View.ox = (View.vw - DW) / 2; View.oy = (View.vh - DH) / 2;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 80));
resize();

/* ---------- Speicher: Einstellungen und Fortschritt (je Welt) ---------- */
const Store = {
  key: 'mini-helden-v1', data: null,
  fresh() { return { settings: { music: true, sfx: true, voice: true }, level: 'small', world: null, hero: { boys: 'blitz', girls: 'stella' }, done: { boys: {}, girls: {} }, party: { boys: false, girls: false }, plays: 0 }; },
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(this.key) || 'null'); } catch (e) { d = null; }
    const f = this.fresh();
    if (!d || typeof d !== 'object') d = f;
    d.settings = Object.assign(f.settings, d.settings || {});
    if (d.level !== 'small' && d.level !== 'big') d.level = 'small';
    if (d.world !== 'boys' && d.world !== 'girls') d.world = null;
    d.hero = Object.assign(f.hero, d.hero || {});
    d.done = d.done || f.done; d.done.boys = d.done.boys || {}; d.done.girls = d.done.girls || {};
    d.party = Object.assign(f.party, d.party || {}); d.plays = d.plays || 0;
    this.data = d;
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* privat/gesperrt: egal */ } },
};
Store.load();

/* ---------- Easing / Tweens / Timer ---------- */
const Ease = {
  linear: (t) => t,
  inQuad: (t) => t * t,
  outQuad: (t) => t * (2 - t),
  inOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),
  outCubic: (t) => 1 - Math.pow(1 - t, 3),
  inCubic: (t) => t * t * t,
  inOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  outBack: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  inBack: (t) => { const c1 = 1.70158, c3 = c1 + 1; return c3 * t * t * t - c1 * t * t; },
  outElastic: (t) => (t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1),
  outBounce: (t) => {
    const n1 = 7.5625, d1 = 2.75;
    if (t < 1 / d1) return n1 * t * t;
    if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
    if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
    return n1 * (t -= 2.625 / d1) * t + 0.984375;
  },
};
const Tweens = {
  list: [],
  add(obj, props, dur, opts = {}) {
    const tw = { obj, props, dur: Math.max(0.0001, dur), t: -(opts.delay || 0), ease: Ease[opts.ease || 'outCubic'] || Ease.outCubic, from: null, done: opts.done, update: opts.update, owner: opts.owner !== undefined ? opts.owner : Game.scene };
    this.list.push(tw);
    return tw;
  },
  kill(obj) { for (const t of this.list) if (t.obj === obj) t.dead = true; },
  killOwner(o) { for (const t of this.list) if (t.owner === o) t.dead = true; },
  update(dt) {
    for (let i = 0; i < this.list.length; i++) {
      const tw = this.list[i];
      if (tw.dead) continue;
      tw.t += dt;
      if (tw.t < 0) continue;
      if (!tw.from) { tw.from = {}; for (const k in tw.props) tw.from[k] = tw.obj[k]; }
      const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p);
      for (const k in tw.props) tw.obj[k] = tw.from[k] + (tw.props[k] - tw.from[k]) * e;
      if (tw.update) { try { tw.update(p); } catch (err) { console.error(err); } }
      if (p >= 1) { tw.dead = true; if (tw.done) { try { tw.done(); } catch (err) { console.error(err); } } }
    }
    if (this.list.some((t) => t.dead)) this.list = this.list.filter((t) => !t.dead);
  },
};
const tween = (o, p, d, opts) => Tweens.add(o, p, d, opts);
const Timers = {
  list: [],
  after(sec, fn, owner) { const t = { at: Game.time + sec, fn, owner: owner !== undefined ? owner : Game.scene }; this.list.push(t); return t; },
  cancel(t) { if (t) t.dead = true; },
  clearOwner(o) { for (const t of this.list) if (t.owner === o) t.dead = true; },
  update() {
    const now = Game.time, due = [];
    for (const t of this.list) if (!t.dead && t.at <= now) { due.push(t); t.dead = true; }
    if (due.length || this.list.some((t) => t.dead)) this.list = this.list.filter((t) => !t.dead);
    for (const t of due) if (t.owner === 'global' || t.owner === Game.scene || (t.owner && t.owner.alive)) { try { t.fn(); } catch (e) { console.error(e); window.__errors.push(String(e && e.stack || e)); } }
  },
};
const after = (s, fn, owner) => Timers.after(s, fn, owner);

/* ---------- Partikel: Konfetti, Funken, Sterne, Wölkchen, Ringe, Herzen, Comic-Blitze ---------- */
const Particles = {
  list: [],
  add(p) {
    p.age = 0; p.life = p.life || 1; p.vx = p.vx || 0; p.vy = p.vy || 0; p.g = p.g || 0; p.drag = p.drag || 0;
    p.rot = p.rot || 0; p.vr = p.vr || 0; p.size = p.size || 8; p.alpha = p.alpha === undefined ? 1 : p.alpha; p.layer = p.layer || 0;
    this.list.push(p);
    if (this.list.length > 700) this.list.splice(0, this.list.length - 700);
    return p;
  },
  burst(type, x, y, n, o = {}) {
    for (let i = 0; i < n; i++) {
      const a = o.angle !== undefined ? o.angle + rand(-(o.spread || Math.PI), o.spread || Math.PI) : rand(0, TAU);
      const sp = rand((o.speed || 200) * 0.4, o.speed || 200);
      const col = Array.isArray(o.colors) ? pick(o.colors) : (o.color || '#fff');
      this.add({ type, x: x + rand(-(o.jitter || 0), o.jitter || 0), y: y + rand(-(o.jitter || 0), o.jitter || 0), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: o.g || 0, drag: o.drag || 0, life: rand((o.life || 1) * 0.7, o.life || 1), size: rand((o.size || 10) * 0.6, o.size || 10), color: col, rot: rand(0, TAU), vr: rand(-6, 6), layer: o.layer || 0, floor: o.floor });
    }
  },
  confettiRain(n, o = {}) {
    for (let i = 0; i < n; i++) this.add({ type: 'confetti', x: rand(View.L, View.R), y: rand(View.T - 300, View.T - 10), vx: rand(-30, 30), vy: rand(60, 160), g: 40, drag: 0.4, life: rand(4, 7), size: rand(8, 16), color: pick(CONFETTI), rot: rand(0, TAU), vr: rand(-5, 5), layer: o.layer === undefined ? 1 : o.layer, sway: rand(1, 3) });
  },
  pow(x, y, size = 70, color = '#ffd21f', layer = 0) { this.add({ type: 'pow', x, y, size, color, life: 0.45, layer, rot: rand(-0.3, 0.3) }); },
  update(dt) {
    for (const p of this.list) {
      p.age += dt; p.vy += p.g * dt;
      if (p.drag) { const f = Math.max(0, 1 - p.drag * dt); p.vx *= f; p.vy *= f; }
      p.x += p.vx * dt + (p.sway ? Math.sin(p.age * p.sway + p.rot) * 40 * dt : 0); p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.floor !== undefined && p.y > p.floor) { p.y = p.floor; p.vy *= -0.3; p.vx *= 0.6; }
    }
    if (this.list.some((p) => p.age >= p.life)) this.list = this.list.filter((p) => p.age < p.life);
  },
  draw(c, layer = 0) {
    for (const p of this.list) {
      if (p.layer !== layer) continue;
      const k = p.age / p.life;
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
      switch (p.type) {
        case 'confetti':
          c.globalAlpha = p.alpha * (k > 0.8 ? (1 - k) / 0.2 : 1);
          c.scale(1, Math.abs(Math.sin(p.age * 9 + p.rot)) * 0.9 + 0.1);
          c.fillStyle = p.color; c.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
          break;
        case 'spark': {
          c.globalAlpha = p.alpha * (1 - k); const s = p.size * (1 - k * 0.5);
          c.fillStyle = p.color; c.beginPath();
          for (let i = 0; i < 8; i++) { const r = i % 2 ? s * 0.32 : s, an = (i / 8) * TAU; c.lineTo(Math.cos(an) * r, Math.sin(an) * r); }
          c.closePath(); c.fill(); break;
        }
        case 'star':
          c.globalAlpha = p.alpha * (k > 0.7 ? (1 - k) / 0.3 : 1);
          Draw.starPath(c, 0, 0, p.size, p.size * 0.48, 5); c.fillStyle = p.color; c.fill(); c.lineWidth = 2; c.strokeStyle = shade(p.color, -0.35); c.stroke();
          break;
        case 'puff':
          c.globalAlpha = p.alpha * (1 - k) * 0.85; c.fillStyle = p.color; c.beginPath(); c.arc(0, 0, p.size * (0.6 + k * 0.8), 0, TAU); c.fill(); break;
        case 'ring':
          c.globalAlpha = p.alpha * (1 - k); c.lineWidth = 5 * (1 - k) + 1; c.strokeStyle = p.color; c.beginPath(); c.arc(0, 0, p.size * (0.3 + k * 1.2), 0, TAU); c.stroke(); break;
        case 'heart':
          c.globalAlpha = p.alpha * (k > 0.6 ? (1 - k) / 0.4 : Math.min(1, k * 6)); c.rotate(-p.rot + Math.sin(p.age * 4) * 0.25);
          Draw.heartPath(c, 0, 0, p.size); c.fillStyle = p.color; c.fill(); break;
        case 'bubble':
          c.globalAlpha = p.alpha * (k > 0.8 ? (1 - k) / 0.2 : 0.9); c.beginPath(); c.arc(0, 0, p.size, 0, TAU);
          c.fillStyle = 'rgba(255,255,255,0.35)'; c.fill(); c.lineWidth = 2; c.strokeStyle = 'rgba(255,255,255,0.9)'; c.stroke(); break;
        case 'pow': {
          const s = p.size * (0.4 + Ease.outBack(Math.min(1, k * 2.2)) * 0.8);
          c.globalAlpha = p.alpha * (k > 0.6 ? (1 - k) / 0.4 : 1);
          Draw.burst(c, 0, 0, s, p.color); break;
        }
        default: break;
      }
      c.restore();
    }
  },
  clear() { this.list.length = 0; },
};
const CONFETTI = ['#f0433a', '#ffd21f', '#4cc63a', '#1f7ef0', '#ff6fc8', '#9157e6', '#ff9124', '#ffffff'];

/* ---------- Spielzustand & Szenenwechsel ---------- */
const Game = {
  scene: null, overlay: null, time: 0, lastInput: 0, trans: null,
  get small() { return Store.data.level === 'small'; },
  get world() { return WORLDS[Store.data.world || 'boys']; },
  get hero() { const w = Store.data.world || 'boys'; return HEROES[Store.data.hero[w]] || HEROES[WORLDS[w].heroes[0]]; },
};
function swapScene(sc) {
  const old = Game.scene;
  if (old) { old.alive = false; if (old.exit) { try { old.exit(); } catch (e) { console.error(e); } } Timers.clearOwner(old); Tweens.killOwner(old); }
  Particles.clear(); Hand.stop(); Hand.wait = 0; Game.overlay = null; Voice.stop();
  Game.scene = sc; sc.alive = true; Game.lastInput = Game.time;
  if (sc.enter) { try { sc.enter(); } catch (e) { console.error(e); window.__errors.push(String(e && e.stack || e)); } }
}
function setScene(sc, opts = {}) {
  if (!Game.scene || opts.instant) { swapScene(sc); return; }
  if (Game.trans) return;
  Game.trans = { t: 0, dur: opts.dur || 0.7, next: sc, swapped: false, color: opts.color || (Game.world ? Game.world.ui : '#1f7ef0') };
  Sound.play('whoosh');
}

/* ---------- Eingabe: nur ein Finger zählt (Kleinkind-Handballen werden ignoriert) ---------- */
const Input = { active: null, x: 0, y: 0, down: false };
function toGame(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / View.sc - View.ox, y: (e.clientY - r.top) / View.sc - View.oy, id: e.pointerId }; }
function inputTarget() { return Game.overlay || Game.scene; }
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (Input.active !== null) return;
  Input.active = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* synthetische Events */ }
  const p = toGame(e);
  Input.x = p.x; Input.y = p.y; Input.down = true; Game.lastInput = Game.time;
  Sound.unlock(); Voice.unlock(); Hand.userTouched();
  if (Game.trans) return;
  const t = inputTarget(); if (t && t.down) { try { t.down(p); } catch (err) { console.error(err); window.__errors.push(String(err && err.stack || err)); } }
});
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== Input.active) return;
  const p = toGame(e); Input.x = p.x; Input.y = p.y; Game.lastInput = Game.time;
  if (Game.trans) return;
  const t = inputTarget(); if (t && t.move) { try { t.move(p); } catch (err) { console.error(err); } }
});
function endPointer(e) {
  if (e.pointerId !== Input.active) return;
  const p = toGame(e); Input.active = null; Input.down = false; Game.lastInput = Game.time;
  if (Game.trans) return;
  const t = inputTarget(); if (t && t.up) { try { t.up(p); } catch (err) { console.error(err); window.__errors.push(String(err && err.stack || err)); } }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
for (const ev of ['touchstart', 'touchmove', 'touchend']) document.addEventListener(ev, (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());
const inCircle = (p, x, y, r) => (p.x - x) ** 2 + (p.y - y) ** 2 <= r * r;
const inRect = (p, x, y, w, h) => p.x >= x - w / 2 && p.x <= x + w / 2 && p.y >= y - h / 2 && p.y <= y + h / 2;

/* =====================================================================
   Ton: alle Geräusche werden live mit WebAudio erzeugt (keine Dateien).
   ===================================================================== */
const Sound = {
  ctx: null, out: null, sfx: null, music: null, noise: null, unlocked: false,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
    const c = this.ctx;
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    this.out = c.createGain(); this.out.gain.value = 0.9; comp.connect(this.out); this.out.connect(c.destination);
    this.sfx = c.createGain(); this.sfx.gain.value = Store.data.settings.sfx ? 1 : 0; this.sfx.connect(comp);
    this.music = c.createGain(); this.music.gain.value = 0; this.music.connect(comp);
    const len = Math.floor(c.sampleRate * 2), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
  },
  unlock() {
    this.init(); if (!this.ctx) return;
    if (this.ctx.state !== 'running') { try { this.ctx.resume(); } catch (e) { /* */ } }
    if (!this.unlocked) {
      try { const b = this.ctx.createBuffer(1, 1, 22050), s = this.ctx.createBufferSource(); s.buffer = b; s.connect(this.ctx.destination); s.start(0); } catch (e) { /* */ }
      this.unlocked = true; setTimeout(() => Music.maybeStart(), 300);
    }
  },
  get ok() { return !!(this.ctx && this.ctx.state === 'running'); },
  applySettings() { if (!this.ctx) return; this.sfx.gain.setTargetAtTime(Store.data.settings.sfx ? 1 : 0, this.ctx.currentTime, 0.05); Music.applyLevel(); },
  tone(o) {
    if (!this.ok) return;
    const c = this.ctx, t = c.currentTime + (o.when || 0), osc = c.createOscillator();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(o.f, t);
    const a = o.a || 0.006, d = o.dur || 0.2, v = o.vol || 0.25;
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + (o.slide || a + d));
    const gn = c.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(v, t + a); gn.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    let node = osc;
    if (o.filter) { const f = c.createBiquadFilter(); f.type = o.filter; f.frequency.value = o.ff || 1200; f.Q.value = o.q || 1; osc.connect(f); node = f; }
    node.connect(gn); gn.connect(o.dest || this.sfx);
    if (o.vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib; lg.gain.value = o.vibAmt || 12; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + a + d + 0.05); }
    osc.start(t); osc.stop(t + a + d + 0.05);
  },
  hiss(o) {
    if (!this.ok) return;
    const c = this.ctx, t = c.currentTime + (o.when || 0), src = c.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const f = c.createBiquadFilter(); f.type = o.filter || 'bandpass'; f.frequency.setValueAtTime(o.f || 1000, t);
    const a = o.a || 0.004, d = o.dur || 0.2;
    if (o.f2) f.frequency.exponentialRampToValueAtTime(Math.max(30, o.f2), t + a + d);
    f.Q.value = o.q || 1;
    const gn = c.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(o.vol || 0.25, t + a); gn.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    src.connect(f); f.connect(gn); gn.connect(o.dest || this.sfx);
    src.start(t, Math.random() * 1.5); src.stop(t + a + d + 0.05);
  },
  play(name, opt = {}) { if (!this.ok || !Store.data.settings.sfx) return; const fn = SFX[name]; if (fn) { try { fn(opt); } catch (e) { /* */ } } },
};

/* ---------- Musik: eigenes Helden-Thema (Marsch-Schleife, live erzeugt) ---------- */
const Music = {
  on: false, timer: null, next: 0, step: 0, spec: null, level: 0.3, muted: false,
  sd: 0.2, // Schrittlänge in Sekunden (Achtel bei 150 bpm)
  melody: ['C5:2 C5 G4 C5:2 E5:2', 'G5:4 E5:2 C5:2', 'D5:2 D5 B4 D5:2 F5:2', 'A5:4 G5:4', 'E5:2 G5 E5 C5:2 E5:2', 'F5:2 A5 F5 D5:2 F5:2', 'G5 F5 E5 D5 C5:2 B4:2', 'C5:6 -:2'],
  bass: ['C3:2 C3:2 G3:2 C3:2', 'C3:2 E3:2 G3:2 E3:2', 'G2:2 G2:2 D3:2 G2:2', 'F3:2 F3:2 G3:2 G3:2', 'C3:2 C3:2 E3:2 C3:2', 'D3:2 D3:2 F3:2 D3:2', 'G2:2 G2:2 G3:2 G2:2', 'C3:2 G2:2 C3:4'],
  perc: 'k . h . s . h h',
  parse(bars) {
    const NN = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }, ev = [];
    let s = 0;
    for (const tok of bars.join(' ').trim().split(/\s+/)) {
      const m = /^(-|[A-G][#b]?\d)(?::(\d+))?$/.exec(tok); if (!m) continue;
      const n = m[2] ? +m[2] : 1;
      if (m[1] !== '-') { const mm = /^([A-G])([#b]?)(\d)$/.exec(m[1]); ev.push({ s, n, midi: 12 * (+mm[3] + 1) + NN[mm[1]] + (mm[2] === '#' ? 1 : mm[2] === 'b' ? -1 : 0) }); }
      s += n;
    }
    const at = new Array(s); for (const e of ev) (at[e.s] = at[e.s] || []).push(e);
    return { at, len: s };
  },
  build() { if (!this.spec) this.spec = { mel: this.parse(this.melody), bass: this.parse(this.bass), perc: this.perc.replace(/\s+/g, '').split('') }; },
  inst(f, t, dur, vol) {
    const c = Sound.ctx, d = Sound.music;
    const o1 = c.createOscillator(), g1 = c.createGain(); o1.type = 'triangle'; o1.frequency.value = f;
    g1.gain.setValueAtTime(0.0001, t); g1.gain.exponentialRampToValueAtTime(vol, t + 0.01); g1.gain.exponentialRampToValueAtTime(0.0001, t + Math.min(1.0, dur * 1.3)); o1.connect(g1); g1.connect(d); o1.start(t); o1.stop(t + 1.1);
    const o2 = c.createOscillator(), g2 = c.createGain(), fl = c.createBiquadFilter(); o2.type = 'square'; o2.frequency.value = f; fl.type = 'lowpass'; fl.frequency.value = 1800;
    g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(vol * 0.18, t + 0.01); g2.gain.exponentialRampToValueAtTime(0.0001, t + Math.min(0.5, dur)); o2.connect(fl); fl.connect(g2); g2.connect(d); o2.start(t); o2.stop(t + 0.6);

  bassInst(f, t, dur, vol) {

    o.type = 'triangle'; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.value = 700;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.2, dur * 0.9));

  },
  percInst(ch, t) {
    const c = Sound.ctx, d = Sound.music;
    if (ch === 'k') { const o = c.createOscillator(), g = c.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.1); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2); o.connect(g); g.connect(d); o.start(t); o.stop(t + 0.25); }
    if (ch === 'h') { const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = Sound.noise; f.type = 'highpass'; f.frequency.value = 7000; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.08, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04); s.connect(f); f.connect(g); g.connect(d); s.start(t, Math.random()); s.stop(t + 0.06); }
    if (ch === 's') { const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = Sound.noise; f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 0.7; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12); s.connect(f); f.connect(g); g.connect(d); s.start(t, Math.random()); s.stop(t + 0.14); }
  },
  tick() {
    if (!this.on || !Sound.ok) return;

  start() {

/* ---------- Sprache: deutsche Sprachausgabe des iPads (Web Speech API) ---------- */
const Voice = {
  voice: null, ready: false, busy: false, lastText: '', lastAt: -9, unlocked: false, freeTimer: null,
  init() {
    if (!('speechSynthesis' in window)) return;
    const pickVoice = () => {
      let vs = []; try { vs = speechSynthesis.getVoices() || []; } catch (e) { vs = []; }
      const de = vs.filter((v) => /^de/i.test(v.lang));
      const pref = de.find((v) => /Anna|Helena|Petra|Katja|Google Deutsch|Marlene|Vicki/i.test(v.name)) || de.find((v) => v.localService) || de[0] || null;
      this.voice = pref; this.ready = true;
    };
    pickVoice();
    try { speechSynthesis.onvoiceschanged = pickVoice; } catch (e) { /* */ }
  },
  unlock() {
    if (!this.ready) this.init();
    if (this.unlocked || !('speechSynthesis' in window)) return;
    this.unlocked = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; u.lang = 'de-DE'; speechSynthesis.speak(u); } catch (e) { /* */ }
  },
  say(text, o = {}) {
    if (!text || !Store.data.settings.voice || !('speechSynthesis' in window)) return;
    if (o.ifIdle && this.busy) return;
    if (text === this.lastText && Game.time - this.lastAt < 1.2 && !o.force) return;
    try {
      if (!this.ready) this.init();
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'de-DE'; if (this.voice) u.voice = this.voice;
      u.rate = o.rate || 0.95; u.pitch = o.pitch || 1.12; u.volume = 1;
      this.busy = true; this.lastText = text; this.lastAt = Game.time; Music.duck(true);
      const free = () => { if (u !== this.cur) return; this.busy = false; Music.duck(false); };
      this.cur = u; u.onend = free; u.onerror = free;
      clearTimeout(this.freeTimer); this.freeTimer = setTimeout(free, Math.min(9000, 1400 + text.length * 85));
      try { speechSynthesis.resume(); } catch (e) { /* */ }
      speechSynthesis.speak(u);
    } catch (e) { this.busy = false; }
  },
  stop() { try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) { /* */ } this.busy = false; this.cur = null; Music.duck(false); },
  praise() { this.say(pick(['Super!', 'Toll gemacht!', 'Prima!', 'Genau richtig!', 'Klasse!', 'Juhu!', 'Wow, super!', 'Heldenhaft!'])); },
};

/* ---------- Zeigehand: zeigt nach einer Pause die Geste vor (Tippen oder Ziehen) ---------- */
const Hand = {
  active: false, x: 0, y: 0, press: 0, t: 0, from: null, to: null, alpha: 0, wait: 0, tap: false,
  start(from, to) { this.from = from; this.to = to; this.t = 0; this.active = true; this.alpha = 0; this.tap = dist(from.x, from.y, to.x, to.y) < 8; },
  stop() { this.active = false; this.alpha = 0; },
  userTouched() { this.stop(); },
  delay() { return Game.small ? 3 : 5; },
  update(dt) {
    const sc = Game.scene;
    if (!this.active) {
      if (sc && sc.hint && !Game.overlay && !Game.trans && !Input.down && Game.time - Game.lastInput > this.delay() + this.wait) {
        let h = null; try { h = sc.hint(); } catch (e) { h = null; }
        if (h) this.start({ x: h.x1, y: h.y1 }, { x: h.x2 === undefined ? h.x1 : h.x2, y: h.y2 === undefined ? h.y1 : h.y2 }); else Game.lastInput = Game.time;
      }
      return;
    }
    this.t += dt;
    this.alpha = Math.min(1, this.t * 3);
    if (this.tap) {
      const cycle = 1.1, k = (this.t % cycle) / cycle;
      this.x = this.from.x; this.y = this.from.y + (k < 0.3 ? 34 * (1 - k / 0.3) : k < 0.55 ? 0 : 34 * ((k - 0.55) / 0.45));
      this.press = k < 0.3 ? k / 0.3 : k < 0.55 ? 1 : 0;
      if (this.t > cycle * 3) { this.stop(); this.wait = 3; Game.lastInput = Game.time; }
      return;
    }
    const cycle = 2.3, k = (this.t % cycle) / cycle;
    if (k < 0.18) { this.x = this.from.x; this.y = this.from.y + 30 * (1 - k / 0.18); this.press = k / 0.18; }
    else if (k < 0.7) { const u = Ease.inOutQuad((k - 0.18) / 0.52); this.x = lerp(this.from.x, this.to.x, u); this.y = lerp(this.from.y, this.to.y, u); this.press = 1; }
    else if (k < 0.85) { this.x = this.to.x; this.y = this.to.y; this.press = 1 - (k - 0.7) / 0.15; }
    else { this.x = this.to.x; this.y = this.to.y + 30 * ((k - 0.85) / 0.15); this.press = 0; this.alpha = 1 - (k - 0.85) / 0.15; }
    if (Math.floor(this.t / cycle) >= 2) { this.stop(); this.wait = 3; Game.lastInput = Game.time; }
  },
  draw(c) {
    if (!this.active) return;
    c.save(); c.globalAlpha = this.alpha;
    if (!this.tap && this.t % 2.3 > 0.4 && this.t % 2.3 < 1.6) { // gestrichelte Spur zeigt den Weg
      c.save(); c.globalAlpha *= 0.55; c.setLineDash([4, 16]); c.lineWidth = 9; c.strokeStyle = '#fff';
      c.beginPath(); c.moveTo(this.from.x, this.from.y); c.lineTo(this.x, this.y); c.stroke(); c.restore();
    }
    if (this.press > 0.6) { c.save(); c.globalAlpha *= 0.5; c.beginPath(); c.arc(this.x, this.y, 30 + Math.sin(this.t * 10) * 4, 0, TAU); c.lineWidth = 5; c.strokeStyle = '#fff'; c.stroke(); c.restore(); }
    Draw.hand(c, this.x + 14, this.y + 18, this.press);
    c.restore();
  },
};

/* ---------- Farben & Hilfen ---------- */
const INK = '#26213a';
const PAL = { red: '#f0433a', orange: '#ff9124', yellow: '#ffd21f', green: '#4cc63a', blue: '#1f7ef0', purple: '#9157e6', pink: '#ff6fc8', white: '#ffffff', gold: '#ffc61a', silver: '#c3cedb', cream: '#fff6dc', mint: '#5fe0c8' };
const COLOR_KEYS = ['red', 'blue', 'yellow', 'green', 'orange', 'purple', 'pink'];
const COLOR_DE = { red: ['rot', 'rote', 'roten'], blue: ['blau', 'blaue', 'blauen'], yellow: ['gelb', 'gelbe', 'gelben'], green: ['grün', 'grüne', 'grünen'], orange: ['orange', 'orange', 'orangen'], purple: ['lila', 'lila', 'lila'], pink: ['rosa', 'rosa', 'rosa'] };
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
function hexToRgb(h) { let x = h.slice(1); if (x.length === 3) x = x[0] + x[0] + x[1] + x[1] + x[2] + x[2]; const n = parseInt(x, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function shade(hex, amt) { const [r, g, b] = hexToRgb(hex); const f = (v) => clamp(Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt), 0, 255); return '#' + [f(r), f(g), f(b)].map((v) => v.toString(16).padStart(2, '0')).join(''); }
function rgba(hex, a) { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }

/* ---------- Hauptschleife ---------- */
let lastFrame = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastFrame) / 1000 || 0.016); lastFrame = now;
  Game.time += dt;
  if (Game.trans) {
    const tr = Game.trans; tr.t += dt;
    if (!tr.swapped && tr.t >= tr.dur * 0.5) { tr.swapped = true; swapScene(tr.next); }
    if (tr.t >= tr.dur) Game.trans = null;
  }
  Tweens.update(dt); Timers.update();
  const sc = Game.scene;
  try {
    if (sc && sc.update) sc.update(dt);
    if (Game.overlay && Game.overlay.update) Game.overlay.update(dt);
  } catch (e) { console.error(e); if (window.__errors.length < 20) window.__errors.push(String(e && e.stack || e)); }
  Particles.update(dt); Hand.update(dt);
  const c = ctx, k = View.sc * View.dpr;
  c.setTransform(k, 0, 0, k, View.ox * k, View.oy * k);
  c.lineJoin = 'round'; c.lineCap = 'round';
  try {
    if (sc && sc.draw) sc.draw(c);
    Particles.draw(c, 0);
    if (Game.overlay && Game.overlay.draw) Game.overlay.draw(c);
    Particles.draw(c, 1);
    Hand.draw(c);
  } catch (e) { console.error(e); if (window.__errors.length < 20) window.__errors.push(String(e && e.stack || e)); c.restore && c.setTransform(k, 0, 0, k, View.ox * k, View.oy * k); }
  if (Game.trans) {
    const tr = Game.trans, p = tr.t / tr.dur, a = p < 0.5 ? Ease.inQuad(p * 2) : 1 - Ease.outQuad((p - 0.5) * 2);
    c.save(); c.globalAlpha = clamp(a, 0, 1); c.fillStyle = tr.color; c.fillRect(View.L - 5, View.T - 5, View.vw + 10, View.vh + 10);
    c.globalAlpha = clamp(a, 0, 1) * 0.5; c.fillStyle = '#fff';
    Draw.starPath(c, DW / 2, DH / 2, 60 + a * 160, 28 + a * 70, 5); c.fill(); c.restore();
  }
}

/* =====================================================================
   Zeichenbibliothek: alles live als Vektorgrafik. Comic-Helden-Stil:
   dicke dunkle Kontur, satte Farben, Glanzpunkt, weicher Schatten.
   Alle Funktionen zeichnen um den Punkt (x, y) herum.
   ===================================================================== */
const Draw = {
  LW: 4,
  rrPath(c, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
  },
  starPath(c, x, y, R, r, n = 5, rot = -Math.PI / 2) {
    c.beginPath();
    for (let i = 0; i < n * 2; i++) { const rad = i % 2 ? r : R, a = rot + (i / (n * 2)) * TAU; c.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
    c.closePath();
  },
  heartPath(c, x, y, s) {
    c.beginPath(); c.moveTo(x, y + s * 0.95);
    c.bezierCurveTo(x - s * 1.1, y + s * 0.2, x - s * 0.9, y - s * 0.9, x, y - s * 0.35);
    c.bezierCurveTo(x + s * 0.9, y - s * 0.9, x + s * 1.1, y + s * 0.2, x, y + s * 0.95); c.closePath();
  },
  polyPath(c, x, y, r, n, rot = -Math.PI / 2) { c.beginPath(); for (let i = 0; i < n; i++) { const a = rot + (i / n) * TAU; c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } c.closePath(); },
  ellipse(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); },
  circle(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0.1, r), 0, TAU); },
  fs(c, color, lw = Draw.LW, stroke = INK) { c.fillStyle = color; c.fill(); if (lw > 0) { c.lineWidth = lw; c.strokeStyle = stroke; c.stroke(); } },
  shine(c, x, y, rx, ry, a = 0.55) { c.save(); c.globalAlpha *= a; Draw.ellipse(c, x, y, rx, ry); c.fillStyle = '#fff'; c.fill(); c.restore(); },
  shadow(c, x, y, rx, ry, a = 0.18) { c.save(); c.globalAlpha *= a; Draw.ellipse(c, x, y, rx, ry); c.fillStyle = INK; c.fill(); c.restore(); },
  boltPath(c, x, y, s) {
    c.beginPath(); c.moveTo(x + 0.25 * s, y - 1 * s); c.lineTo(x - 0.45 * s, y + 0.12 * s); c.lineTo(x - 0.02 * s, y + 0.12 * s);
    c.lineTo(x - 0.25 * s, y + 1 * s); c.lineTo(x + 0.48 * s, y - 0.18 * s); c.lineTo(x + 0.04 * s, y - 0.18 * s); c.closePath();
  },
  flamePath(c, x, y, s) {
    c.beginPath(); c.moveTo(x, y + s);
    c.bezierCurveTo(x - s * 0.85, y + s * 0.9, x - s * 0.8, y - s * 0.1, x - s * 0.25, y - s * 0.55);
    c.quadraticCurveTo(x - s * 0.2, y - s * 0.1, x, y - s * 0.05);
    c.quadraticCurveTo(x - s * 0.05, y - s * 0.6, x + s * 0.2, y - s * 1.0);
    c.bezierCurveTo(x + s * 0.4, y - s * 0.5, x + s * 0.9, y - s * 0.1, x + s * 0.7, y + s * 0.5);
    c.quadraticCurveTo(x + s * 0.5, y + s * 0.95, x, y + s); c.closePath();
  },
  moonPath(c, x, y, s) { c.beginPath(); c.arc(x, y, s, Math.PI * 0.3, Math.PI * 1.7); c.arc(x + s * 0.42, y - s * 0.05, s * 0.78, Math.PI * 1.62, Math.PI * 0.38, true); c.closePath(); },
  rocketPath(c, x, y, s) {
    c.beginPath(); c.moveTo(x, y - s); c.quadraticCurveTo(x + s * 0.55, y - s * 0.4, x + s * 0.38, y + s * 0.45);
    c.lineTo(x + s * 0.7, y + s * 0.9); c.lineTo(x + s * 0.2, y + s * 0.7); c.lineTo(x - s * 0.2, y + s * 0.7); c.lineTo(x - s * 0.7, y + s * 0.9);
    c.lineTo(x - s * 0.38, y + s * 0.45); c.quadraticCurveTo(x - s * 0.55, y - s * 0.4, x, y - s); c.closePath();
  },
  /* Emblem-Symbol (für Helden, Karten, Abzeichen) */
  symbol(c, kind, x, y, s, color, lw = 3) {
    switch (kind) {
      case 'bolt': Draw.boltPath(c, x, y, s); break;
      case 'flame': Draw.flamePath(c, x, y, s); break;
      case 'rocket': Draw.rocketPath(c, x, y, s); break;
      case 'star': Draw.starPath(c, x, y, s * 1.05, s * 0.48, 5); break;
      case 'heart': Draw.heartPath(c, x, y - s * 0.05, s * 0.95); break;
      case 'moon': Draw.moonPath(c, x - s * 0.1, y, s * 0.9); break;
      default: Draw.circle(c, x, y, s);
    }
    Draw.fs(c, color, lw);
  },

  /* ---------- Text (nur Titel – die Kinder lesen nicht) ---------- */
  label(c, text, x, y, size, fill = '#fff', stroke = INK, weight = 700, align = 'center') {
    c.save(); c.font = `${weight} ${size}px Fredoka, "Arial Rounded MT Bold", ui-rounded, sans-serif`; c.textAlign = align; c.textBaseline = 'middle';
    if (stroke) { c.lineWidth = Math.max(3, size * 0.18); c.strokeStyle = stroke; c.lineJoin = 'round'; c.strokeText(text, x, y); }
    c.fillStyle = fill; c.fillText(text, x, y); c.restore();
  },

  /* ---------- Comic-Explosion ---------- */
  burst(c, x, y, r, color = '#ffd21f', n = 12, lw = 4) {
    c.beginPath();
    for (let i = 0; i < n * 2; i++) { const a = (i / (n * 2)) * TAU, rr = i % 2 ? r * 0.62 : r * (i % 4 === 0 ? 1 : 0.86); c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    c.closePath(); Draw.fs(c, color, lw);
    c.beginPath();
    for (let i = 0; i < n * 2; i++) { const a = (i / (n * 2)) * TAU + 0.12, rr = i % 2 ? r * 0.36 : r * 0.55; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    c.closePath(); c.fillStyle = shade(color, 0.55); c.fill();
  },
  speedLines(c, x, y, len, n, color = '#fff', a = 0.7) {
    c.save(); c.globalAlpha *= a; c.strokeStyle = color; c.lineWidth = 5;
    for (let i = 0; i < n; i++) { const yy = y + (i - (n - 1) / 2) * 16, l = len * (0.6 + ((i * 37) % 10) / 25); c.beginPath(); c.moveTo(x, yy); c.lineTo(x - l, yy); c.stroke(); }
    c.restore();
  },

  /* ---------- Lern-Formen ---------- */
  shapePath(c, kind, x, y, s) {
    switch (kind) {
      case 'circle': c.beginPath(); c.arc(x, y, s, 0, TAU); break;
      case 'square': Draw.rrPath(c, x - s * 0.88, y - s * 0.88, s * 1.76, s * 1.76, s * 0.18); break;
      case 'triangle': { c.beginPath(); const h = s * 1.1; c.moveTo(x, y - h); c.lineTo(x + h * 1.05, y + h * 0.78); c.lineTo(x - h * 1.05, y + h * 0.78); c.closePath(); break; }
      case 'star': Draw.starPath(c, x, y + s * 0.08, s * 1.18, s * 0.55, 5); break;
      case 'heart': Draw.heartPath(c, x, y - s * 0.02, s * 1.02); break;
      case 'rect': Draw.rrPath(c, x - s * 1.2, y - s * 0.65, s * 2.4, s * 1.3, s * 0.15); break;
      case 'diamond': Draw.polyPath(c, x, y, s * 1.15, 4); break;
      case 'hexagon': Draw.polyPath(c, x, y, s * 1.05, 6, 0); break;
      default: c.beginPath(); c.arc(x, y, s, 0, TAU);
    }
  },
  shape(c, kind, x, y, s, color, o = {}) {
    Draw.shapePath(c, kind, x, y, s);
    if (o.silhouette) { c.fillStyle = o.silhouette; c.fill(); return; }
    Draw.fs(c, color, o.lw === undefined ? Draw.LW + 1 : o.lw);
    if (!o.noShine) Draw.shine(c, x - s * 0.35, y - s * 0.4, s * 0.22, s * 0.14);
  },

  /* ---------- Oberfläche ---------- */
  roundButton(c, x, y, r, color, icon, o = {}) {
    const pr = o.pressed ? 3 : 0;
    Draw.shadow(c, x, y + r + 4, r * 0.9, 7, 0.18);
    Draw.circle(c, x, y + pr, r); Draw.fs(c, color, 4);
    Draw.shine(c, x - r * 0.3, y - r * 0.45 + pr, r * 0.32, r * 0.18, 0.45);
    if (icon) icon(c, x, y + pr, r);
  },
  iconHome(c, x, y, r = 30) {
    const s = r * 0.62;
    c.save(); c.translate(x, y + s * 0.08); c.lineWidth = 3.5; c.strokeStyle = INK; c.lineJoin = 'round';
    Draw.rrPath(c, -s * 0.62, -s * 0.12, s * 1.24, s * 0.82, 4); c.fillStyle = '#fff'; c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-s * 0.95, 0); c.lineTo(0, -s * 0.85); c.lineTo(s * 0.95, 0); c.closePath(); c.fillStyle = PAL.red; c.fill(); c.stroke();
    Draw.rrPath(c, -s * 0.18, s * 0.22, s * 0.36, s * 0.48, 3); c.fillStyle = PAL.blue; c.fill(); c.stroke();
    c.restore();
  },
  iconSpeaker(c, x, y, r = 30) {
    const s = r * 0.55;
    c.save(); c.translate(x - s * 0.15, y);
    c.beginPath(); c.moveTo(-s * 0.8, -s * 0.35); c.lineTo(-s * 0.3, -s * 0.35); c.lineTo(s * 0.2, -s * 0.85); c.lineTo(s * 0.2, s * 0.85); c.lineTo(-s * 0.3, s * 0.35); c.lineTo(-s * 0.8, s * 0.35); c.closePath();
    Draw.fs(c, '#fff', 3.5);
    c.lineWidth = 4; c.strokeStyle = '#fff';
    const k = (Game.time * 2) % 1;
    for (let i = 0; i < 2; i++) { c.save(); c.globalAlpha *= i === 0 ? 1 : 0.4 + 0.6 * k; c.beginPath(); c.arc(s * 0.35, 0, s * (0.5 + i * 0.42), -0.85, 0.85); c.stroke(); c.restore(); }
    c.restore();
  },
  iconReplay(c, x, y, r = 30) {
    const s = r * 0.5;
    c.save(); c.translate(x, y); c.lineWidth = 7; c.strokeStyle = INK; c.beginPath(); c.arc(0, 0, s, 0.5, TAU - 0.3); c.stroke();
    c.lineWidth = 4.5; c.strokeStyle = '#fff'; c.beginPath(); c.arc(0, 0, s, 0.5, TAU - 0.3); c.stroke();
    const a = TAU - 0.3, ex = Math.cos(a) * s, ey = Math.sin(a) * s;
    c.beginPath(); c.moveTo(ex + 10, ey - 2); c.lineTo(ex - 6, ey - 12); c.lineTo(ex - 4, ey + 9); c.closePath(); Draw.fs(c, '#fff', 3);
    c.restore();
  },
  iconPlay(c, x, y, r = 30) { const s = r * 0.5; c.beginPath(); c.moveTo(x - s * 0.6, y - s * 0.85); c.lineTo(x + s * 0.9, y); c.lineTo(x - s * 0.6, y + s * 0.85); c.closePath(); Draw.fs(c, '#fff', 4); },
  iconBack(c, x, y, r = 30) {
    const s = r * 0.5;
    c.save(); c.translate(x, y);
    c.beginPath(); c.moveTo(-s, 0); c.lineTo(-s * 0.05, -s * 0.85); c.lineTo(-s * 0.05, -s * 0.35); c.lineTo(s * 0.9, -s * 0.35); c.lineTo(s * 0.9, s * 0.35); c.lineTo(-s * 0.05, s * 0.35); c.lineTo(-s * 0.05, s * 0.85); c.closePath();
    Draw.fs(c, '#fff', 3.5); c.restore();
  },
  iconGear(c, x, y, r = 20) {
    const s = r * 0.55;
    c.save(); c.translate(x, y);
    c.beginPath(); for (let i = 0; i < 16; i++) { const a = (i / 16) * TAU, rr = i % 2 ? s : s * 0.74; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } c.closePath();
    Draw.fs(c, '#fff', 3); Draw.circle(c, 0, 0, s * 0.3); Draw.fs(c, '#9aa7b8', 3); c.restore();
  },
  hand(c, x, y, press = 0) {
    c.save(); c.translate(x, y); c.rotate(-0.35); c.scale(1.15 - press * 0.08, 1.15 - press * 0.08);
    c.lineWidth = 4; c.strokeStyle = INK; c.lineJoin = 'round';
    Draw.rrPath(c, -22, 2, 44, 40, 16); c.fillStyle = '#fff'; c.fill(); c.stroke();
    Draw.rrPath(c, -8, -46 + press * 10, 18, 56, 9); c.fillStyle = '#fff'; c.fill(); c.stroke();
    Draw.rrPath(c, -22, 4, 44, 14, 7); c.fillStyle = '#fff'; c.fill();
    c.beginPath(); c.moveTo(-14, 20); c.lineTo(-14, 30); c.moveTo(-2, 22); c.lineTo(-2, 32); c.moveTo(10, 20); c.lineTo(10, 30); c.stroke();
    Draw.rrPath(c, -26, 30, 52, 30, 12); c.fillStyle = PAL.red; c.fill(); c.stroke();
    Draw.starPath(c, 0, 45, 9, 4, 5); c.fillStyle = PAL.yellow; c.fill();
    c.restore();
  },
  medal(c, x, y, r, color = PAL.gold, sym = 'star', on = true) {
    c.save();
    if (!on) { c.globalAlpha *= 0.35; }
    c.beginPath(); c.moveTo(x - r * 0.55, y - r * 0.4); c.lineTo(x - r * 0.85, y + r * 1.25); c.lineTo(x - r * 0.4, y + r * 1.0); c.lineTo(x - r * 0.15, y + r * 1.35); c.lineTo(x + 0.05 * r, y + r * 0.2); c.closePath(); Draw.fs(c, PAL.red, 3);
    c.beginPath(); c.moveTo(x + r * 0.55, y - r * 0.4); c.lineTo(x + r * 0.85, y + r * 1.25); c.lineTo(x + r * 0.4, y + r * 1.0); c.lineTo(x + r * 0.15, y + r * 1.35); c.lineTo(x - 0.05 * r, y + r * 0.2); c.closePath(); Draw.fs(c, PAL.blue, 3);
    Draw.circle(c, x, y, r); Draw.fs(c, color, 4);
    Draw.circle(c, x, y, r * 0.74); c.fillStyle = shade(color, -0.12); c.fill();
    Draw.symbol(c, sym, x, y, r * 0.5, '#fff', 3);
    Draw.shine(c, x - r * 0.35, y - r * 0.45, r * 0.25, r * 0.14, 0.6);
    c.restore();
  },
  starSlot(c, x, y, r, filled, color = PAL.yellow) {
    Draw.starPath(c, x, y, r, r * 0.48, 5);
    if (filled) { Draw.fs(c, color, 4); Draw.shine(c, x - r * 0.25, y - r * 0.25, r * 0.18, r * 0.1, 0.6); }
    else { c.fillStyle = 'rgba(255,255,255,0.45)'; c.fill(); c.lineWidth = 4; c.strokeStyle = rgba(INK, 0.5); c.stroke(); }
  },

  /* ---------- Himmel & Stadt ---------- */
  sky(c, top, bottom) {
    const g = c.createLinearGradient(0, View.T, 0, DH); g.addColorStop(0, top); g.addColorStop(1, bottom);
    c.fillStyle = g; c.fillRect(View.L - 5, View.T - 5, View.vw + 10, View.vh + 10);
  },
  cloud(c, x, y, s, color = '#fff', lw = 4) {
    const parts = [[-0.9, 0, 0.6], [-0.2, -0.45, 0.75], [0.6, -0.1, 0.65], [0.1, 0.25, 0.6]];
    c.lineWidth = lw; c.strokeStyle = INK; c.fillStyle = color;
    if (lw > 0) for (const [dx, dy, r] of parts) { c.beginPath(); c.arc(x + dx * s, y + dy * s, r * s, 0, TAU); c.stroke(); }
    for (const [dx, dy, r] of parts) { c.beginPath(); c.arc(x + dx * s, y + dy * s, r * s, 0, TAU); c.fill(); }
  },
  sun(c, x, y, r, color = PAL.yellow) {
    c.save(); c.translate(x, y); c.rotate(Game.time * 0.2); c.lineWidth = 5; c.strokeStyle = shade(color, -0.1);
    for (let i = 0; i < 12; i++) { const a = (i / 12) * TAU; c.beginPath(); c.moveTo(Math.cos(a) * r * 1.25, Math.sin(a) * r * 1.25); c.lineTo(Math.cos(a) * r * 1.6, Math.sin(a) * r * 1.6); c.stroke(); }
    c.beginPath(); c.arc(0, 0, r, 0, TAU); Draw.fs(c, color, 4); c.restore();
  },
  rainbow(c, x, y, r, w = 16, a = 0.85) {
    c.save(); c.globalAlpha *= a;
    const cols = ['#ff5a5f', '#ff9f43', '#ffd21f', '#5fd068', '#45aaf2', '#a55eea'];
    cols.forEach((col, i) => { c.beginPath(); c.arc(x, y, r - i * w, Math.PI, TAU); c.lineWidth = w + 1; c.strokeStyle = col; c.stroke(); });
    c.restore();
  },
  building(c, x, base, w, h, color, o = {}) {
    const top = base - h;
    Draw.rrPath(c, x - w / 2, top, w, h + 20, 8); Draw.fs(c, color, o.lw === undefined ? 4 : o.lw);
    if (o.roof === 'dome') { c.beginPath(); c.arc(x, top + 2, w * 0.32, Math.PI, TAU); Draw.fs(c, shade(color, -0.15), o.lw === undefined ? 4 : o.lw); }
    if (o.roof === 'spike') { c.beginPath(); c.moveTo(x - w * 0.3, top + 2); c.lineTo(x, top - w * 0.5); c.lineTo(x + w * 0.3, top + 2); c.closePath(); Draw.fs(c, shade(color, -0.15), o.lw === undefined ? 4 : o.lw); }
    if (o.roof === 'antenna') { c.lineWidth = 4; c.strokeStyle = INK; c.beginPath(); c.moveTo(x, top); c.lineTo(x, top - 34); c.stroke(); Draw.circle(c, x, top - 38, 6); Draw.fs(c, Math.sin(Game.time * 4 + x) > 0 ? PAL.red : '#ffb3b3', 3); }
    if (o.windows !== false) {
      const cols = Math.max(1, Math.floor((w - 16) / 26)), rows = Math.max(1, Math.floor((h - 20) / 34));
      const ww = 14, wh = 18, gx = (w - cols * ww) / (cols + 1);
      for (let r = 0; r < rows; r++) for (let i = 0; i < cols; i++) {
        const wx = x - w / 2 + gx + i * (ww + gx), wy = top + 14 + r * 34;
        if (o.heart) { Draw.heartPath(c, wx + ww / 2, wy + wh / 2, 8); c.fillStyle = ((r * 7 + i * 3 + Math.floor(x)) % 5 === 0) ? '#fff6a8' : 'rgba(255,255,255,0.75)'; c.fill(); }
        else { Draw.rrPath(c, wx, wy, ww, wh, 3); c.fillStyle = ((r * 7 + i * 3 + Math.floor(x)) % 5 === 0) ? '#fff6a8' : 'rgba(255,255,255,0.7)'; c.fill(); }
      }
    }
  },
  /* Ganze Stadtkulisse in den Farben der gewählten Welt */
  city(c, w, o = {}) {
    const gy = o.groundY || 640;
    Draw.sky(c, w.skyTop, w.skyBottom);
    if (w.id === 'girls') { Draw.rainbow(c, 760, gy - 40, 300, 18, 0.55); }
    else { Draw.sun(c, 880, 110, 46); }
    const t = Game.time;
    for (let i = 0; i < 4; i++) { const cx = ((i * 330 + t * (14 + i * 4)) % (View.vw + 400)) + View.L - 200; Draw.cloud(c, cx, 90 + (i % 2) * 70, 34 + (i % 3) * 8, '#fff', 0); }
    if (o.deco !== false) {
      if (w.id === 'boys') { const bx = ((t * 40) % (View.vw + 300)) + View.L - 150; Draw.blimp(c, bx, 175, 0.6, w); }
      else { for (let i = 0; i < 6; i++) { const hx = (i * 190 + 60) % 1100 - 40, hy = 200 + Math.sin(t * 1.2 + i) * 12 + (i % 2) * 40; c.save(); c.globalAlpha = 0.5; Draw.heartPath(c, hx, hy, 12 + (i % 3) * 4); c.fillStyle = '#fff'; c.fill(); c.restore(); } }
    }
    // ferne Skyline (ohne Kontur)
    c.save(); c.globalAlpha = 0.45;
    const far = w.cityFar;
    for (let xx = Math.floor((View.L - 60) / 70) * 70, i = 0; xx < View.R + 70; xx += 70, i++) {
      const h = 120 + ((i * 53) % 7) * 22; c.fillStyle = far; Draw.rrPath(c, xx, gy - h - 40, 64, h + 60, 6); c.fill();
    }
    c.restore();
    // nahe Häuser
    const cols = w.cityColors;
    for (let xx = Math.floor((View.L - 40) / 120) * 120, i = 0; xx < View.R + 120; xx += 120, i++) {
      const k = ((Math.round(xx / 120) % cols.length) + cols.length) % cols.length;
      const h = 110 + ((Math.abs(Math.round(xx / 120)) * 47) % 5) * 26;
      if (o.skipCenter && xx > 300 && xx < 700) continue;
      Draw.building(c, xx + 60, gy, 100, h, cols[k], { roof: ['flat', 'antenna', 'dome', 'flat', 'spike'][Math.abs(Math.round(xx / 120)) % 5], heart: w.id === 'girls' });
    }
    if (o.ground !== 'none') Draw.ground(c, gy, w, o.ground || 'street');
  },
  ground(c, gy, w, kind = 'street') {
    if (kind === 'grass') {
      c.fillStyle = w.grass; c.fillRect(View.L - 5, gy, View.vw + 10, View.B - gy + 10);
      c.lineWidth = 5; c.strokeStyle = INK; c.beginPath(); c.moveTo(View.L - 5, gy); c.lineTo(View.R + 5, gy); c.stroke();
      c.fillStyle = shade(w.grass, -0.12);
      for (let xx = Math.floor(View.L / 60) * 60; xx < View.R + 60; xx += 60) { c.beginPath(); c.moveTo(xx, gy + 28); c.lineTo(xx + 8, gy + 8); c.lineTo(xx + 16, gy + 28); c.closePath(); c.fill(); }
      return;
    }
    c.fillStyle = w.sidewalk; c.fillRect(View.L - 5, gy, View.vw + 10, 26);
    c.fillStyle = w.road; c.fillRect(View.L - 5, gy + 26, View.vw + 10, View.B - gy);
    c.lineWidth = 5; c.strokeStyle = INK; c.beginPath(); c.moveTo(View.L - 5, gy); c.lineTo(View.R + 5, gy); c.moveTo(View.L - 5, gy + 26); c.lineTo(View.R + 5, gy + 26); c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.85)';

  },
  /* Helden-Auto (für Farben-Garage, Puzzle usw.) */
  car(c, x, y, s, color, o = {}) {
    const bob = o.bob === undefined ? Math.sin(Game.time * 8 + x * 0.05) * 1.5 : o.bob;
    c.save(); c.translate(x, y + bob); c.scale(s * (o.flip ? -1 : 1), s);
    Draw.shadow(c, 0, 56, 92, 12, 0.2);
    // Spoiler

    // Kabine
    c.beginPath(); c.moveTo(-50, -14); c.quadraticCurveTo(-36, -66, 12, -64); c.quadraticCurveTo(46, -62, 58, -14); c.closePath(); Draw.fs(c, shade(color, 0.12), 4);
    c.beginPath(); c.moveTo(-34, -18); c.quadraticCurveTo(-24, -54, 8, -54); c.quadraticCurveTo(34, -52, 44, -18); c.closePath(); Draw.fs(c, '#bfefff', 3);
    Draw.shine(c, -6, -42, 12, 6, 0.7);
    // Karosserie
    Draw.rrPath(c, -92, -22, 184, 56, 26); Draw.fs(c, color, 4);
    c.save(); Draw.rrPath(c, -92, -22, 184, 56, 26); c.clip(); c.fillStyle = 'rgba(255,255,255,0.28)'; c.fillRect(-92, -16, 184, 10); c.restore();
    Draw.circle(c, 82, 0, 9); Draw.fs(c, '#fff6a8', 3);
    Draw.circle(c, -10, 6, 16); Draw.fs(c, '#fff', 3); Draw.symbol(c, o.sym || 'star', -10, 6, 10, o.symColor || PAL.yellow, 2.5);
    // Räder

  /* Garage mit farbigem Rolltor; open: 0 (zu) … 1 (offen) */
  garage(c, x, base, color, open = 0, o = {}) {

    c.save(); c.translate(x, base);
    Draw.rrPath(c, -w / 2, -h, w, h, 14); Draw.fs(c, o.wall || '#f4efe6', 5);
    // Dach in Torfarbe – die Farbe ist auch bei offenem Tor sichtbar
    Draw.rrPath(c, -w / 2 - 12, -h - 30, w + 24, 44, 14); Draw.fs(c, color, 5);
    Draw.circle(c, 0, -h - 8, 22); Draw.fs(c, '#fff', 4); Draw.symbol(c, o.sym || 'star', 0, -h - 8, 13, color, 3);

    const dw = 150, dh = 118;
    Draw.rrPath(c, -dw / 2, -dh - 4, dw, dh + 4, 8); Draw.fs(c, '#3a3550', 4);
    const visible = dh * (1 - open);
    if (visible > 1) {
      c.save(); c.beginPath(); c.rect(-dw / 2, -dh - 4, dw, visible + 2); c.clip();
      Draw.rrPath(c, -dw / 2, -dh - 4, dw, visible + 4, 6); Draw.fs(c, color, 4);

      c.restore();
    }
    if (o.glow) { c.save(); c.globalAlpha = o.glow; c.lineWidth = 10; c.strokeStyle = '#fff'; Draw.rrPath(c, -w / 2 - 6, -h - 36, w + 12, h + 42, 18); c.stroke(); c.restore(); }
    c.restore();
  },
};

/* Held zeichnen. (x, y) = Hüfte; s = Größe (1 ≈ 220 px hoch).
   o.pose: 'stand' | 'wave' | 'cheer' | 'fly' | 'point'
   o.face: 'smile' | 'happy' | 'wow'   o.flip: spiegeln   o.look: Blickrichtung -1…1 */
Draw.hero = function (c, h, x, y, s, o = {}) {
  const t = (o.t !== undefined ? o.t : Game.time) + h.phase;
  const pose = o.pose || 'stand';
  const fly = pose === 'fly';
  c.save(); c.translate(x, y);
  if (!fly && !o.noShadow) Draw.shadow(c, 0, 50 * s, 46 * s, 10 * s, 0.2);
  c.scale(s * (o.flip ? -1 : 1), s);
  if (fly) c.rotate(o.rot !== undefined ? o.rot : 1.25 + Math.sin(t * 2.5) * 0.05);
  else if (o.rot) c.rotate(o.rot);
  if (pose === 'cheer') c.translate(0, -Math.abs(Math.sin(t * 5)) * 14);
  const br = 1 + Math.sin(t * 3) * 0.015;
  c.scale(1, br);

  // ---- Umhang ----
  const capeLen = fly ? 92 : 50, wav = fly ? 10 : 4, sp = fly ? 11 : 3;
  const w1 = Math.sin(t * sp) * wav, w2 = Math.sin(t * sp + 1.7) * wav, w3 = Math.sin(t * sp + 3.1) * wav;
  c.beginPath(); c.moveTo(-28, -68);
  c.quadraticCurveTo(-52, -20, -54 + w1, capeLen);
  c.quadraticCurveTo(-30, capeLen + 12 + w2, -18 + w2, capeLen + 2);
  c.quadraticCurveTo(0, capeLen + 14 + w3, 18 + w3, capeLen + 2);
  c.quadraticCurveTo(30, capeLen + 12 + w1, 54 + w2, capeLen);
  c.quadraticCurveTo(52, -20, 28, -68); c.closePath();
  Draw.fs(c, h.cape, 4);
  c.save(); c.globalAlpha = 0.25; c.beginPath(); c.moveTo(-8, -60); c.quadraticCurveTo(-14, 0, -18 + w2, capeLen); c.lineTo(18 + w3, capeLen); c.quadraticCurveTo(14, 0, 8, -60); c.closePath(); c.fillStyle = INK; c.fill(); c.restore();

  // ---- Beine & Stiefel ----
  const legK = pose === 'cheer' ? Math.sin(t * 10) * 3 : 0;
  for (const sx of [-1, 1]) {
    const lx = sx * 15;
    Draw.rrPath(c, lx - 11, -10, 22, 44 + (sx > 0 ? legK : -legK), 10); Draw.fs(c, h.suit, 4);
    Draw.rrPath(c, lx - 14 + (fly ? 0 : sx * 2), 22, 28, 24, 11); Draw.fs(c, h.boots, 4);
    c.fillStyle = 'rgba(255,255,255,0.35)'; c.fillRect(lx - 10, 26, 20, 4);
  }

  // ---- Körper ----
  Draw.rrPath(c, -34, -74, 68, 80, 26); Draw.fs(c, h.suit, 4);
  c.save(); Draw.rrPath(c, -34, -74, 68, 80, 26); c.clip();
  c.fillStyle = h.belt; c.fillRect(-36, -14, 72, 13); c.lineWidth = 3; c.strokeStyle = INK; c.strokeRect(-40, -14, 80, 13);
  c.fillStyle = 'rgba(255,255,255,0.18)'; c.fillRect(-30, -70, 16, 50);
  c.restore();
  Draw.rrPath(c, -9, -16, 18, 17, 4); Draw.fs(c, shade(h.belt, -0.15), 3);
  Draw.circle(c, 0, -44, 18); Draw.fs(c, h.symBg, 4);
  Draw.symbol(c, h.sym, 0, -44, 11, h.symColor, 2.5);

  // ---- Arme ----
  let L, R;
  switch (pose) {
    case 'cheer': { const b = Math.sin(t * 5) * 6; L = [-54, -118 + b]; R = [54, -118 - b]; break; }
    case 'wave': { const a = Math.sin(t * 7) * 0.45; L = [-46, -16]; R = [40 + Math.cos(-1.2 + a) * 30 + 20, -96 + Math.sin(-1.2 + a) * 26]; break; }
    case 'fly': L = [-44, -14]; R = [24, -182]; break;
    case 'point': L = [-46, -16]; R = [74, -62]; break;
    default: { const a = Math.sin(t * 2) * 2; L = [-48, -18 + a]; R = [48, -18 - a]; }
  }
  for (const [sx, hp] of [[-1, L], [1, R]]) {
    const shx = sx * 28, shy = -60;
    c.lineCap = 'round'; c.lineWidth = 24; c.strokeStyle = INK; c.beginPath(); c.moveTo(shx, shy); c.lineTo(hp[0], hp[1]); c.stroke();
    c.lineWidth = 16; c.strokeStyle = h.suit; c.stroke();
    Draw.circle(c, hp[0], hp[1], 13); Draw.fs(c, h.gloves, 4);
  }

  // ---- Kopf ----
  Draw.heroHead(c, h, 0, -122, 1, { t, face: o.face, look: o.look, fly });
  c.restore();
};

/* Kopf allein (für Abzeichen, Karten, Menü). (x, y) = Kopfmitte, Radius ≈ 50·s */
Draw.heroHead = function (c, h, x, y, s, o = {}) {
  const t = o.t !== undefined ? o.t : Game.time + h.phase;
  c.save(); c.translate(x, y); c.scale(s, s);
  const sp = h.species;
  const earW = Math.sin(t * 2.2) * 0.06;
  // hinter dem Kopf
  if (sp === 'pup' && h.bow) { /* Schleife kommt später nach vorn */ }
  if (sp === 'dino') {
    for (let i = 0; i < 4; i++) { const a = -2.5 + i * 0.42, bx = Math.cos(a) * 46, by = Math.sin(a) * 46; c.beginPath(); c.moveTo(bx - 12, by + 6); c.lineTo(Math.cos(a) * 72, Math.sin(a) * 72); c.lineTo(bx + 12, by + 2); c.closePath(); Draw.fs(c, h.spikes, 4); }
  }
  if (sp === 'fox' || sp === 'cat') {
    for (const sx of [-1, 1]) {
      c.save(); c.scale(sx, 1); c.rotate(earW * sx);
      c.beginPath(); c.moveTo(-48, -14); c.lineTo(-40, sp === 'fox' ? -74 : -64); c.lineTo(-8, -44); c.closePath(); Draw.fs(c, h.fur, 4);
      c.beginPath(); c.moveTo(-41, -22); c.lineTo(-37, sp === 'fox' ? -60 : -52); c.lineTo(-18, -40); c.closePath(); c.fillStyle = sp === 'fox' ? '#fff4e6' : '#ffb3cf'; c.fill();
      if (sp === 'fox') { c.beginPath(); c.moveTo(-42.5, -60); c.lineTo(-40, -74); c.lineTo(-32, -64); c.closePath(); c.fillStyle = INK; c.fill(); }
      c.restore();
    }
  }
  if (sp === 'unicorn') {
    const mane = ['#ff6fc8', '#9157e6', '#45aaf2', '#5fd068', '#ffd21f'];
    [[-40, -34, 20], [-18, -50, 20], [8, -52, 18], [32, -40, 16], [-52, -8, 18], [-54, 18, 16], [-46, 40, 14]].forEach(([mx, my, mr], i) => { Draw.circle(c, mx, my, mr); Draw.fs(c, mane[i % mane.length], 4); });
    for (const sx of [-1, 1]) { c.beginPath(); c.moveTo(sx * 22, -40); c.lineTo(sx * 36, -64); c.lineTo(sx * 42, -34); c.closePath(); Draw.fs(c, h.fur, 4); }
  }
  // Kopfform
  if (sp === 'dino') { Draw.ellipse(c, 0, 0, 54, 48); Draw.fs(c, h.fur, 4); }
  else if (sp === 'unicorn') { Draw.ellipse(c, 0, 2, 46, 50); Draw.fs(c, h.fur, 4); }
  else { Draw.circle(c, 0, 0, 50); Draw.fs(c, h.fur, 4); }
  Draw.shine(c, -22, -26, 12, 7, 0.4);
  if (sp === 'cat') { c.strokeStyle = h.fur2; c.lineWidth = 5; for (const dx of [-12, 0, 12]) { c.beginPath(); c.moveTo(dx, -48); c.lineTo(dx * 0.8, -36); c.stroke(); } }
  // Schnauze
  if (sp === 'pup') { Draw.ellipse(c, 0, 20, 30, 22); Draw.fs(c, h.muzzle, 3); }
  if (sp === 'dino') { Draw.ellipse(c, 0, 20, 38, 22); Draw.fs(c, h.muzzle, 3); for (const sx of [-1, 1]) { Draw.circle(c, sx * 9, 10, 3.5); c.fillStyle = INK; c.fill(); } }
  if (sp === 'fox') { for (const sx of [-1, 1]) { Draw.ellipse(c, sx * 22, 20, 24, 17); c.fillStyle = h.muzzle; c.fill(); } Draw.ellipse(c, 0, 22, 20, 15); c.fillStyle = h.muzzle; c.fill(); }
  if (sp === 'cat') { Draw.ellipse(c, 0, 22, 24, 15); c.fillStyle = h.muzzle; c.fill(); }
  if (sp === 'unicorn') { Draw.ellipse(c, 0, 26, 32, 21); Draw.fs(c, h.muzzle, 3); for (const sx of [-1, 1]) { Draw.ellipse(c, sx * 10, 24, 3.5, 5); c.fillStyle = '#c96b9a'; c.fill(); } }
  // Nase & Mund
  const face = o.face || 'smile';
  if (sp === 'pup' || sp === 'fox') { Draw.ellipse(c, 0, sp === 'fox' ? 12 : 10, 11, 8); Draw.fs(c, INK, 0); Draw.shine(c, -3, 7, 4, 2, 0.7); }
  if (sp === 'cat') { c.beginPath(); c.moveTo(-7, 12); c.lineTo(7, 12); c.lineTo(0, 19); c.closePath(); Draw.fs(c, '#ff7fae', 2.5); }
  const my = sp === 'unicorn' ? 34 : sp === 'dino' ? 26 : 24;
  c.lineWidth = 4; c.strokeStyle = INK;
  if (face === 'wow') { Draw.ellipse(c, 0, my + 4, 8, 10); Draw.fs(c, '#7a1d3a', 3); }
  else if (face === 'happy' || sp === 'dino') {
    const mw = sp === 'dino' ? 26 : 14;
    c.beginPath(); c.moveTo(-mw, my - 2); c.quadraticCurveTo(0, my + (sp === 'dino' ? 22 : 20), mw, my - 2); c.closePath(); Draw.fs(c, '#7a1d3a', 3.5);
    if (sp === 'dino') { for (const sx of [-1, 1]) { c.beginPath(); c.moveTo(sx * 14, my - 1); c.lineTo(sx * 10, my + 7); c.lineTo(sx * 6, my - 1); c.closePath(); c.fillStyle = '#fff'; c.fill(); } }
    else { Draw.ellipse(c, 0, my + 8, 6, 4); c.fillStyle = '#ff7fae'; c.fill(); }
  } else if (sp === 'cat') {
    c.beginPath(); c.moveTo(-10, my - 2); c.quadraticCurveTo(-5, my + 5, 0, my - 2); c.quadraticCurveTo(5, my + 5, 10, my - 2); c.stroke();
  } else { c.beginPath(); c.moveTo(-12, my - 2); c.quadraticCurveTo(0, my + 9, 12, my - 2); c.stroke(); }
  if (sp === 'cat') { c.lineWidth = 2.5; for (const sx of [-1, 1]) for (const k of [-1, 0, 1]) { c.beginPath(); c.moveTo(sx * 24, 18 + k * 5); c.lineTo(sx * 52, 12 + k * 10); c.stroke(); } }
  // Bäckchen
  for (const sx of [-1, 1]) { c.save(); c.globalAlpha = 0.35; Draw.ellipse(c, sx * 32, 14, 9, 6); c.fillStyle = '#ff6f91'; c.fill(); c.restore(); }
  // Maske / Brille
  if (h.goggles) {
    c.fillStyle = '#3a3a4a'; c.fillRect(-50, -20, 100, 12);
    for (const sx of [-1, 1]) { Draw.circle(c, sx * 20, -14, 18); Draw.fs(c, '#5a6070', 4); Draw.circle(c, sx * 20, -14, 13); c.fillStyle = h.goggles; c.fill(); }
  } else if (h.mask) {
    c.beginPath(); c.moveTo(-50, -20);
    c.quadraticCurveTo(-30, -36, -6, -24); c.quadraticCurveTo(0, -21, 6, -24);
    c.quadraticCurveTo(30, -36, 50, -20); c.quadraticCurveTo(34, 8, 8, -2);
    c.quadraticCurveTo(0, -5, -8, -2); c.quadraticCurveTo(-34, 8, -50, -20); c.closePath();

  }
  // Augen
  const blink = (t % 4.3) < 0.13;
  const lk = (o.look || 0) * 3;
  for (const sx of [-1, 1]) {
    const ex = sx * 19, ey = -12;
    if (blink) { c.lineWidth = 4; c.strokeStyle = INK; c.beginPath(); c.moveTo(ex - 8, ey + 1); c.quadraticCurveTo(ex, ey + 6, ex + 8, ey + 1); c.stroke(); continue; }
    Draw.ellipse(c, ex, ey, 10, 12); Draw.fs(c, '#fff', 3);
    Draw.circle(c, ex + lk, ey + 1, 6.5); c.fillStyle = INK; c.fill();
    Draw.circle(c, ex + lk - 2, ey - 2, 2.4); c.fillStyle = '#fff'; c.fill();
    if (sp === 'unicorn' || h.bow || sp === 'cat') { c.lineWidth = 3; c.strokeStyle = INK; for (const k of [0, 1]) { c.beginPath(); c.moveTo(ex + sx * (6 + k * 3), ey - 10 + k * 3); c.lineTo(ex + sx * (12 + k * 3), ey - 15 + k * 3); c.stroke(); } }
  }
  // vorne: Ohren (Hund), Horn (Einhorn), Schleife
  if (sp === 'pup') {
    for (const sx of [-1, 1]) { c.save(); c.translate(sx * 46, -6); c.rotate(sx * (0.32 + earW)); Draw.ellipse(c, 0, 10, 15, 30); Draw.fs(c, h.fur2, 4); c.restore(); }
  }
  if (sp === 'unicorn') {
    c.beginPath(); c.moveTo(-11, -44); c.lineTo(0, -98); c.lineTo(11, -44); c.closePath(); Draw.fs(c, '#ffd21f', 4);

/* =====================================================================
   Spiel-Rahmen: Minispiel-Basis (Knöpfe, Runden-Sterne, Lob, Sieg),
   Sieger-Bildschirm und Ziehen-&-Ablegen-Basis.
   ===================================================================== */
const GAMES = [];
const GAME_ORDER = ['garage', 'shapes', 'kittens', 'flight', 'fog', 'memory', 'puzzle', 'size', 'animals', 'traffic', 'recycle', 'music', 'race', 'baby'];
function registerGame(def) { GAMES.push(def); const oi = (id) => { const i = GAME_ORDER.indexOf(id); return i < 0 ? 999 : i; }; GAMES.sort((a, b) => oi(a.id) - oi(b.id)); }
function gameDef(id) { return GAMES.find((g) => g.id === id); }

class MiniGame {
  constructor(id) {
    this.id = id; this.def = gameDef(id) || { id, name: id };
    this.round = 0; this.rounds = 3; this.locked = false;
    this.hudPress = { home: 0, voice: 0 }; this.starFx = [];
  }
  get W() { return Game.world; }
  get H() { return Game.hero; }
  get small() { return Game.small; }
  instruction() { return this.def.intro || ''; }
  get btnHome() { return { x: View.L + 64, y: View.T + 64, r: 44 }; }
  get btnVoice() { return { x: View.R - 64, y: View.T + 64, r: 44 }; }
  enter() { this.round = 0; this.start(); }
  start() { }
  sayIntro(delay = 0.45) { after(delay, () => Voice.say(this.instruction(), { force: true }), this); }
  down(p) {
    if (this.hudDown(p)) return;
    if (this.locked) return;
    if (this.onDown) this.onDown(p);
  }
  move(p) { if (!this.locked && this.onMove) this.onMove(p); }
  up(p) { if (this.onUp) this.onUp(p); }
  hudDown(p) {
    const h = this.btnHome, v = this.btnVoice;
    if (inCircle(p, h.x, h.y, h.r + 12)) { Sound.play('tap'); this.hudPress.home = 1; setScene(new HubScene()); return true; }
    if (inCircle(p, v.x, v.y, v.r + 12)) { Sound.play('tap'); this.hudPress.voice = 1; Voice.say(this.instruction(), { force: true }); return true; }
    return false;
  }
  drawHud(c) {
    const h = this.btnHome, v = this.btnVoice;
    this.hudPress.home = Math.max(0, this.hudPress.home - 0.1); this.hudPress.voice = Math.max(0, this.hudPress.voice - 0.1);
    Draw.roundButton(c, h.x, h.y, h.r, this.W.ui, Draw.iconHome, { pressed: this.hudPress.home > 0 });
    const vs = Voice.busy ? 1 + Math.sin(Game.time * 10) * 0.06 : 1;
    c.save(); c.translate(v.x, v.y); c.scale(vs, vs); Draw.roundButton(c, 0, 0, v.r, PAL.orange, Draw.iconSpeaker, { pressed: this.hudPress.voice > 0 }); c.restore();
    // Runden-Sterne
    const n = this.rounds; if (n > 1) {
      const y = (View.T + 50), gap = 64, x0 = DW / 2 - ((n - 1) * gap) / 2;
      Draw.rrPath(c, x0 - 46, y - 34, (n - 1) * gap + 92, 68, 34); c.fillStyle = 'rgba(255,255,255,0.55)'; c.fill();
      for (let i = 0; i < n; i++) {
        const fx = this.starFx[i] || 0, s = 1 + fx * 0.6;
        c.save(); c.translate(x0 + i * gap, y); c.scale(s, s); Draw.starSlot(c, 0, 0, 24, i < this.round); c.restore();
        if (fx > 0) this.starFx[i] = Math.max(0, fx - 0.03);
      }
    }
  }
  /* Runde geschafft: Stern füllen, dann nächste Runde oder Sieg */
  roundDone() {
    const i = this.round; this.round++; this.starFx[i] = 1;
    Sound.play('success');
    const gap = 64, x0 = DW / 2 - ((this.rounds - 1) * gap) / 2, y = (View.T + 50);
    Particles.burst('star', x0 + i * gap, y, 14, { speed: 260, size: 14, colors: [PAL.yellow, '#fff'], life: 0.9, layer: 1 });
    if (this.round >= this.rounds) { this.locked = true; after(1.1, () => this.win(), this); }
    else after(1.4, () => { this.locked = false; this.nextRound(this.round); }, this);
  }
  nextRound() { }
  win() {
    const w = Store.data.world || 'boys';
    Store.data.done[w][this.id] = true; Store.data.plays++; Store.save();
    Game.overlay = new WinOverlay(this);
  }
  /* Held fliegt einmal quer über den Bildschirm (Belohnung zwischendurch) */
  heroFlyBy(y = 260, dir = 1) {
    const f = { x: dir > 0 ? View.L - 160 : View.R + 160, y };
    this.flyers = this.flyers || []; this.flyers.push(f);
    Sound.play('rocket');
    tween(f, { x: dir > 0 ? View.R + 200 : View.L - 200 }, 1.6, { ease: 'inOutQuad', done: () => { this.flyers = this.flyers.filter((q) => q !== f); }, owner: this });
    f.dir = dir;
  }
  drawFlyers(c) {
    if (!this.flyers) return;
    for (const f of this.flyers) { Draw.speedLines(c, f.x - f.dir * 70, f.y + 10, 110, 4, '#fff', 0.8); Draw.hero(c, this.H, f.x, f.y, 0.7, { pose: 'fly', flip: f.dir < 0, face: 'happy' }); }
  }
}

/* ---------- Sieger-Bildschirm ---------- */
class WinOverlay {
  constructor(game) {
    this.game = game; this.t = 0; this.btnA = 0;
    Sound.play('fanfare'); Particles.confettiRain(140, { layer: 1 });
    const held = Game.world.id === 'girls' ? 'eine echte Heldin!' : 'ein echter Held!';
    after(0.3, () => Voice.say(pick(['Mission geschafft! Du bist ' + held, 'Super gemacht! Du bist ' + held, 'Hurra! Mission erfüllt!']), { force: true }), 'global');
    for (let i = 0; i < 3; i++) after(0.4 + i * 0.5, () => { Particles.pow(rand(250, 780), rand(200, 500), rand(60, 90), pick([PAL.yellow, PAL.pink, '#7fe3ff']), 1); Sound.play('pop', { pitch: rand(0.8, 1.3) }); }, 'global');
  }
  get bReplay() { return { x: DW / 2 - 120, y: Math.min(View.B - 90, 660), r: 64 }; }
  get bHome() { return { x: DW / 2 + 120, y: Math.min(View.B - 90, 660), r: 64 }; }
  update(dt) { this.t += dt; if (this.t > 1.3) this.btnA = Math.min(1, this.btnA + dt * 3); }
  down(p) {
    if (this.btnA < 0.9) return;

    if (inCircle(p, a.x, a.y, a.r + 14)) { Sound.play('select'); const def = this.game.def; setScene(def.make ? def.make() : new HubScene()); return; }
    if (inCircle(p, b.x, b.y, b.r + 14)) { Sound.play('select'); setScene(new HubScene()); }
  }
  draw(c) {
    const k = Math.min(1, this.t * 2.5), w = Game.world, h = Game.hero;
    c.save(); c.globalAlpha = 0.55 * k; c.fillStyle = w.ui2; c.fillRect(View.L - 5, View.T - 5, View.vw + 10, View.vh + 10); c.restore();
    c.save(); c.translate(DW / 2, 330); c.rotate(this.t * 0.4); c.scale(Ease.outBack(k), Ease.outBack(k));
    Draw.burst(c, 0, 0, 250, w.id === 'girls' ? '#ffd1ec' : '#fff3a8', 16, 5); c.restore();
    const hs = 1.35 * Ease.outBack(Math.min(1, this.t * 1.8));
    if (hs > 0.01) Draw.hero(c, h, DW / 2 - 40, 410, hs, { pose: 'cheer', face: 'happy' });
    const ms = Ease.outElastic(clamp((this.t - 0.6) * 1.2, 0, 1));
    if (ms > 0.01) { c.save(); c.translate(DW / 2 + 150, 300); c.rotate(Math.sin(this.t * 3) * 0.12); c.scale(ms, ms); Draw.medal(c, 0, 0, 58, PAL.gold, h.sym); c.restore(); }
    if (this.btnA > 0) {
      const a = this.bReplay, b = this.bHome, s = Ease.outBack(this.btnA), pulse = 1 + Math.sin(Game.time * 4) * 0.04;
      c.save(); c.translate(a.x, a.y); c.scale(s * pulse, s * pulse); Draw.roundButton(c, 0, 0, a.r, PAL.green, Draw.iconReplay); c.restore();
      c.save(); c.translate(b.x, b.y); c.scale(s, s); Draw.roundButton(c, 0, 0, b.r, w.ui, Draw.iconHome); c.restore();
    }
  }
}

/* =====================================================================
   Ziehen & Ablegen – Basis für Farben-Garage, Formen-Roboter, Größen …
   Unterklassen liefern: makeRound(r) → { items, targets }, drawScene(c),
   drawTarget(c, tg), drawItem(c, it), optional onPick/onCorrect/onWrong,
   accepts(tg, it), onAllPlaced() (→ Sekunden bis Rundenende).
   Item:   { x, y, key, r (Greifradius) … }   Target: { x, y, key, snapR, cap }
   ===================================================================== */
class DragMatch extends MiniGame {
  constructor(id) { super(id); this.items = []; this.targets = []; this.drag = null; }
  start() { this.setup(0); this.sayIntro(); }
  nextRound(r) { this.setup(r); }
  setup(r) {
    const { items, targets } = this.makeRound(r);
    this.items = items; this.targets = targets; this.drag = null;
    items.forEach((it, i) => {
      it.hx = it.x; it.hy = it.y; it.placed = false; it.sc = 0; it.lift = 0; it.r = it.r || 70; it.wig = 0;
      tween(it, { sc: 1 }, 0.5, { ease: 'outBack', delay: 0.1 + i * 0.08, owner: this });
    });
    targets.forEach((tg) => { tg.filled = 0; tg.shake = 0; tg.glow = 0; tg.snapR = tg.snapR || 130; tg.cap = tg.cap || 1; tg.pop = 0; });
    Game.lastInput = Game.time - (this.round === 0 ? 0 : 1);
  }
  accepts(tg, it) { return tg.key === it.key && tg.filled < tg.cap; }
  correctTarget(it) { return this.targets.find((tg) => this.accepts(tg, it)); }
  onDown(p) {
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];
      if (it.placed || it.sc < 0.5 || it.busy) continue;
      if (inCircle(p, it.x, it.y, it.r)) {
        this.drag = it; it.dx = it.x - p.x; it.dy = it.y - p.y;
        Tweens.kill(it); it.sc = 1; tween(it, { lift: 1 }, 0.15, { owner: this });
        this.items.splice(i, 1); this.items.push(it);
        Sound.play('pick'); if (this.onPick) this.onPick(it);
        return;
      }
    }
    if (this.onEmptyTap) this.onEmptyTap(p);
  }
  onMove(p) {
    const it = this.drag; if (!it) return;
    it.x = clamp(p.x + it.dx, View.L + 30, View.R - 30); it.y = clamp(p.y + it.dy, View.T + 30, View.B - 30);
    for (const tg of this.targets) tg.hover = dist(it.x, it.y, tg.x, tg.y) < tg.snapR;
  }
  onUp() {
    const it = this.drag; if (!it) return; this.drag = null;
    for (const tg of this.targets) tg.hover = false;
    tween(it, { lift: 0 }, 0.15, { owner: this });
    // nächstes Ziel suchen; das richtige Ziel bekommt großzügig Vorrang (Kleinkind-Finger)
    let best = null, bd = 1e9;
    for (const tg of this.targets) { const d = dist(it.x, it.y, tg.x, tg.y); if (d < tg.snapR && d < bd) { best = tg; bd = d; } }
    const good = this.correctTarget(it);
    if (good && dist(it.x, it.y, good.x, good.y) < good.snapR * (this.small ? 1.5 : 1.2) && (!best || best === good || dist(it.x, it.y, good.x, good.y) < bd + 40)) best = good;
    if (best && this.accepts(best, it)) this.place(it, best);
    else if (best) this.wrong(it, best);
    else this.back(it);
  }
  place(it, tg) {
    it.placed = true; it.target = tg; tg.filled++; tg.pop = 1;
    const pos = this.placePos ? this.placePos(it, tg) : { x: tg.x, y: tg.y, sc: tg.itemScale || 1 };
    it.busy = true;
    tween(it, { x: pos.x, y: pos.y, sc: pos.sc }, 0.3, { ease: 'outBack', owner: this, done: () => { it.busy = false; } });
    Sound.play('snap'); Particles.burst('star', pos.x, pos.y, 12, { speed: 240, size: 13, colors: [PAL.yellow, '#fff', this.W.ui], life: 0.8 });
    if (this.onCorrect) this.onCorrect(it, tg); else Voice.praise();
    if (this.items.every((q) => q.placed)) {
      this.locked = true;
      const extra = this.onAllPlaced ? this.onAllPlaced() : 0.6;
      after(0.5 + (extra || 0), () => this.roundDone(), this);
    }
  }
  wrong(it, tg) {
    tg.shake = 1; Sound.play('boop');
    if (this.onWrong) this.onWrong(it, tg);
    const good = this.correctTarget(it); if (good) { good.glow = 1; tween(good, { glow: 0 }, 1.6, { owner: this }); }
    this.back(it);
  }
  back(it) { it.busy = true; tween(it, { x: it.hx, y: it.hy }, 0.45, { ease: 'outBack', owner: this, done: () => { it.busy = false; } }); }
  hint() {
    const it = this.items.find((q) => !q.placed && !q.busy); if (!it) return null;
    const tg = this.correctTarget(it); if (!tg) return null;
    return { x1: it.x, y1: it.y, x2: tg.x, y2: tg.y };
  }
  update(dt) {
    for (const tg of this.targets) { tg.shake = Math.max(0, tg.shake - dt * 2.5); tg.pop = Math.max(0, tg.pop - dt * 3); }
    if (this.updateScene) this.updateScene(dt);
  }
  draw(c) {
    this.drawScene(c);
    for (const tg of this.targets) {
      c.save(); c.translate(Math.sin(tg.shake * 30) * 10 * tg.shake, 0);
      this.drawTarget(c, tg);
      c.restore();
    }
    for (const it of this.items) if (it.placed && !it.onTop) this.drawItemT(c, it);
    if (this.drawMid) this.drawMid(c);
    for (const it of this.items) if (!it.placed || it.onTop) this.drawItemT(c, it);
    this.drawFlyers(c);
    this.drawHud(c);
  }
  drawItemT(c, it) {
    if (it.sc <= 0.01 || it.hidden) return;
    c.save(); c.translate(it.x, it.y - it.lift * 10);
    if (it.lift > 0) Draw.shadow(c, 0, 50, 50 * it.sc, 10, 0.12 * it.lift);
    const s = it.sc * (1 + it.lift * 0.12); c.scale(s, s);
    this.drawItem(c, it);
    c.restore();
  }
}

function FE_eye(c, x, y, r, t) {
  if ((t % 3.7) < 0.12) { c.lineWidth = 3.5; c.strokeStyle = INK; c.beginPath(); c.moveTo(x - r, y); c.quadraticCurveTo(x, y + r * 0.6, x + r, y); c.stroke(); return; }
  Draw.ellipse(c, x, y, r, r * 1.15); Draw.fs(c, '#fff', 3);
  Draw.circle(c, x, y + 1, r * 0.62); c.fillStyle = INK; c.fill();
  Draw.circle(c, x - r * 0.25, y - r * 0.25, r * 0.24); c.fillStyle = '#fff'; c.fill();
}
function FE_cheeks(c, dx, y) { for (const sx of [-1, 1]) { c.save(); c.globalAlpha = 0.35; Draw.ellipse(c, sx * dx, y, 8, 5); c.fillStyle = '#ff6f91'; c.fill(); c.restore(); } }
function FE_legs(c, col, hoof, dx = 18) { for (const sx of [-1, 1]) { Draw.rrPath(c, sx * dx - 9, 50, 18, 24, 6); Draw.fs(c, col, 3.5); if (hoof) { Draw.rrPath(c, sx * dx - 9, 66, 18, 9, 4); Draw.fs(c, hoof, 3); } } }

/* Tier zeichnen: (x, y) = Mitte, Höhe ≈ 150·s (von −70 bis +76) */

      FE_legs(c, '#fff', '#5a4a40');
      for (const sx of [-1, 1]) {
        c.beginPath(); c.moveTo(sx * 18, -46); c.quadraticCurveTo(sx * 30, -68, sx * 42, -60); c.quadraticCurveTo(sx * 34, -50, sx * 28, -40); c.closePath(); Draw.fs(c, '#fff3c4', 3.5);
        c.save(); c.translate(sx * 44, -24); c.rotate(sx * 0.45); Draw.ellipse(c, 0, 0, 17, 9); Draw.fs(c, '#fff', 3.5); Draw.ellipse(c, sx * 3, 0, 9, 4.5); c.fillStyle = '#ffb3c6'; c.fill(); c.restore();
      }
      Draw.ellipse(c, 0, -16, 38, 36); Draw.fs(c, '#fff', 4);
      c.save(); Draw.ellipse(c, 0, -16, 38, 36); c.clip(); Draw.ellipse(c, -26, -40, 18, 16); c.fillStyle = INK; c.fill(); c.restore();
      Draw.ellipse(c, 0, -16, 38, 36); c.lineWidth = 4; c.strokeStyle = INK; c.stroke();
      Draw.ellipse(c, 0, 4, 30, 18); Draw.fs(c, '#ffb3c6', 3.5);

    }
    case 'pig': {

      c.lineWidth = 4; c.strokeStyle = INK; c.beginPath(); c.arc(46, 30, 8, Math.PI, Math.PI * 2.7); c.stroke();
      FE_legs(c, pk, '#c96b8a');
      for (const sx of [-1, 1]) { c.beginPath(); c.moveTo(sx * 14, -44); c.lineTo(sx * 44, -58); c.lineTo(sx * 36, -26); c.closePath(); Draw.fs(c, pk2, 3.5); }
      Draw.circle(c, 0, -14, 38); Draw.fs(c, pk, 4);
      Draw.ellipse(c, 0, 2, 19, 14); Draw.fs(c, pk2, 3.5);
      for (const sx of [-1, 1]) { Draw.ellipse(c, sx * 6, 2, 3.5, 5.5); c.fillStyle = '#a0405f'; c.fill(); }
      FE_eye(c, -15, -22, 8, t); FE_eye(c, 15, -22, 8, t);

    }
    case 'sheep': {
      const wool = '#fbfaf5', face = '#5a5560';
      for (const sx of [-1, 1]) { Draw.rrPath(c, sx * 18 - 8, 50, 16, 24, 6); Draw.fs(c, '#4a4550', 3.5); }
      const blobs = [[-34, 34, 20], [-12, 26, 22], [12, 26, 22], [34, 34, 20], [-22, 52, 20], [0, 54, 22], [22, 52, 20]];
      c.lineWidth = 7; c.strokeStyle = INK; for (const [bx, by, br] of blobs) { Draw.circle(c, bx, by, br); c.stroke(); }
      c.fillStyle = wool; for (const [bx, by, br] of blobs) { Draw.circle(c, bx, by, br); c.fill(); }
      for (const sx of [-1, 1]) { c.save(); c.translate(sx * 34, -12); c.rotate(sx * 0.4); Draw.ellipse(c, 0, 0, 16, 8); Draw.fs(c, face, 3.5); c.restore(); }
