function FF_drawBin(c, x, base, cat, o = {}) {
  const b = FF_BINS[cat], open = o.open || 0, chomp = o.chomp || 0, s = o.s || 1;
  c.save(); c.translate(x, base); c.scale(s, s * (1 - chomp * 0.06 * Math.abs(Math.sin(Game.time * 30))));
  Draw.shadow(c, 0, 8, 86, 12, 0.22);
  // Räder
  for (const sx of [-1, 1]) { Draw.circle(c, sx * 50, 2, 13); Draw.fs(c, '#2b2b38', 4); Draw.circle(c, sx * 50, 2, 5); c.fillStyle = '#9aa0ad'; c.fill(); }
  // Körper
  c.beginPath(); c.moveTo(-78, -190); c.lineTo(78, -190); c.lineTo(66, -6); c.quadraticCurveTo(64, 0, 58, 0); c.lineTo(-58, 0); c.quadraticCurveTo(-64, 0, -66, -6); c.closePath();
  Draw.fs(c, b.col, 5);
  c.save(); c.globalAlpha = 0.22; c.fillStyle = '#fff'; c.fillRect(-64, -184, 16, 170); c.restore();
  c.lineWidth = 3; c.strokeStyle = rgba(INK, 0.25); for (const xx of [-36, 36]) { c.beginPath(); c.moveTo(xx, -176); c.lineTo(xx * 0.9, -14); c.stroke(); }
  // Bild-Schild
  Draw.circle(c, 0, -102, 48); Draw.fs(c, '#fff', 4);
  c.save(); c.translate(0, -102); FF_drawTrash(c, b.icon, 0.62); c.restore();
  // Augen
  const happy = o.smile;
  for (const sx of [-1, 1]) {
    const ex = sx * 30, ey = -168;
    if (chomp > 0.2 || happy) { c.lineWidth = 4.5; c.strokeStyle = INK; c.beginPath(); c.moveTo(ex - 9, ey + 3); c.quadraticCurveTo(ex, ey - 7, ex + 9, ey + 3); c.stroke(); }
    else { Draw.ellipse(c, ex, ey, 9, 10); Draw.fs(c, '#fff', 3); Draw.circle(c, ex + 1, ey + 1, 5); c.fillStyle = INK; c.fill(); Draw.circle(c, ex - 1, ey - 2, 1.8); c.fillStyle = '#fff'; c.fill(); }
  }
  // Mund
  const my = -30;
  if (chomp > 0.05) { const oo = 6 + Math.abs(Math.sin(Game.time * 22)) * 12 * chomp; Draw.ellipse(c, 0, my, 18, oo); Draw.fs(c, '#5a2140', 3.5); }
  else if (happy) { c.beginPath(); c.moveTo(-22, my - 6); c.quadraticCurveTo(0, my + 22, 22, my - 6); c.closePath(); Draw.fs(c, '#5a2140', 3.5); Draw.ellipse(c, 0, my + 6, 7, 4); c.fillStyle = '#ff7fae'; c.fill();
    for (const sx of [-1, 1]) { c.save(); c.globalAlpha = 0.4; Draw.ellipse(c, sx * 44, my - 8, 9, 6); c.fillStyle = '#ff6f91'; c.fill(); c.restore(); } }
  else { c.lineWidth = 4; c.strokeStyle = INK; c.beginPath(); c.moveTo(-14, my - 2); c.quadraticCurveTo(0, my + 8, 14, my - 2); c.stroke(); }
  // Deckel (Scharnier links)
  c.save(); c.translate(-86, -194); c.rotate(-open * 1.25);
  Draw.rrPath(c, 0, -26, 172, 30, 10); Draw.fs(c, b.lid, 5);
  Draw.rrPath(c, 150, -14, 28, 12, 5); Draw.fs(c, shade(b.lid, -0.2), 3);
  c.save(); c.globalAlpha = 0.25; c.fillStyle = '#fff'; c.fillRect(12, -20, 130, 6); c.restore();
  c.restore();
  if (o.glow) { c.save(); c.globalAlpha = o.glow; c.lineWidth = 10; c.strokeStyle = '#fff'; c.beginPath(); c.moveTo(-90, -230); c.lineTo(90, -230); c.lineTo(76, 6); c.lineTo(-76, 6); c.closePath(); c.stroke(); c.restore(); }
  c.restore();
}
function FF_drawFlower(c, x, y, g, col, t) {
  if (g <= 0.01) return;
  c.save(); c.translate(x, y); c.scale(g, g); c.rotate(Math.sin(t * 1.8 + x) * 0.06);
  c.lineWidth = 5; c.strokeStyle = '#2e8f22'; c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(4, -18, 0, -34); c.stroke();

  for (let i = 0; i < 5; i++) { const a = (i / 5) * TAU + 0.3; Draw.circle(c, Math.cos(a) * 11, -40 + Math.sin(a) * 11, 9); Draw.fs(c, col, 3); }
  Draw.circle(c, 0, -40, 7); Draw.fs(c, '#ffd21f', 3);
  c.restore();
}

class FF_RecycleGame extends DragMatch {
  constructor() {
    super('recycle'); this.rounds = 3; this.GB = 548; this.cheer = 0;
    this.flowers = []; this.spots = FF_FLOWER_SPOTS.slice();
    this.nick = { x: 770, y: 150, s: 0.5, mood: 'grin', spin: 0 };
  }
  instruction() { return 'Müll-Helden! Hilf mir aufräumen! Jeder Müll kommt in die richtige Tonne!'; }
  makeRound(r) {
    const cats = this.small ? [['paper', 'bio'], ['pack', 'bio'], ['paper', 'pack']][r] : ['paper', 'pack', 'bio'];
    const n = this.small ? [2, 3, 3][r] : [4, 5, 6][r];
    const pool = {}; for (const ct of cats) pool[ct] = shuffle(Object.keys(FF_TRASH).filter((k) => FF_TRASH[k].cat === ct));
    const kinds = cats.map((ct) => pool[ct].pop());
    while (kinds.length < n && cats.some((ct) => pool[ct].length)) { const ct = pick(cats.filter((q) => pool[q].length)); kinds.push(pool[ct].pop()); }
    shuffle(kinds);
    const bx = cats.length === 2 ? [470, 770] : [380, 620, 860];
    const prev = this.targets || [];
    const targets = cats.map((ct, i) => {
      const old = prev.find((q) => q.key === ct && Math.abs(q.x - bx[i]) < 1);
      return { key: ct, x: bx[i], y: this.GB - 110, base: this.GB, snapR: 135, cap: kinds.filter((k) => FF_TRASH[k].cat === ct).length, open: 0, chomp: 0, smile: old ? old.smile : 0, app: old ? 1 : 0 };
    });
    targets.forEach((tg, i) => { if (tg.app < 1) tween(tg, { app: 1 }, 0.5, { ease: 'outBack', delay: 0.1 + i * 0.1, owner: this }); });
    const sp = n > 1 ? Math.min(160, 740 / (n - 1)) : 0;
    const items = kinds.map((k, i) => ({ key: FF_TRASH[k].cat, kind: k, x: 575 + (i - (n - 1) / 2) * sp, y: 668 + (i % 2 ? 24 : -14), rot: rand(-0.35, 0.35), r: 72 }));
    return { items, targets };
  }
  setup(r) {
    super.setup(r);
    const nk = this.nick, comeBack = r > 0;
    nk.mood = 'puff'; nk.spin = 0;
    if (comeBack) { nk.x = View.R + 180; nk.y = 150; tween(nk, { x: 770 }, 0.6, { ease: 'outBack', owner: this }); }
    const t0 = comeBack ? 0.8 : 0.5;
    after(t0 - 0.1, () => { Sound.play('whoosh'); Particles.burst('puff', nk.x - 70, nk.y + 30, 16, { speed: 220, angle: Math.PI * 0.8, spread: 0.6, size: 26, colors: ['#ffffff', '#d9d4ec'], life: 0.9 }); }, this);
    this.items.forEach((it, i) => {
      Tweens.kill(it); it.busy = true; it.sc = 0.35; it.x = 770 - 60; it.y = 180;
      const hx = it.hx, hy = it.hy;
      tween(it, { x: hx, y: hy, sc: 1 }, 0.7, { ease: 'outQuad', delay: t0 + i * 0.16, owner: this, done: () => { it.busy = false; Sound.play('plop', { pitch: rand(0.8, 1.2) }); } });
    });
    after(t0 + this.items.length * 0.16 + 0.8, () => { nk.mood = 'grin'; }, this);
    Game.lastInput = Game.time + t0 + this.items.length * 0.16;
  }
  label(it) { const d = FF_TRASH[it.kind]; return FF_ART[d.art][0] + ' ' + d.name; }
  onPick(it) { Voice.say(this.label(it) + '!', { force: true }); }
  placePos(it, tg) { return { x: tg.x + 6, y: tg.base - 262, sc: 0.85 }; }
  onCorrect(it, tg) {
    Voice.say(pick(['Super! ', 'Richtig! ', 'Toll! ']) + FF_BINS[tg.key].say, { force: true });
    tween(tg, { open: 1 }, 0.18, { owner: this });
    after(0.32, () => {
      tween(it, { y: tg.base - 160, sc: 0.35 }, 0.22, { ease: 'inQuad', owner: this, done: () => {
        it.hidden = true; Sound.play('chomp'); tg.chomp = 1; tg.smile = 1;
        tween(tg, { chomp: 0 }, 0.9, { owner: this });
        tween(tg, { open: 0 }, 0.25, { delay: 0.12, owner: this });
        Particles.burst('star', tg.x, tg.base - 230, 14, { speed: 240, size: 13, colors: [PAL.yellow, '#fff', FF_BINS[tg.key].col], life: 0.8 });
        this.growFlower();
      } });
    }, this);
  }
  onWrong(it) {
    const d = FF_TRASH[it.kind], b = FF_BINS[d.cat], a = FF_ART[d.art];
    Voice.say('Hoppla! ' + a[0] + ' ' + d.name + ' ist ' + b.catName + '. ' + a[1] + ' gehört in die ' + b.adj + ' Tonne.', { force: true });
  }
  growFlower() {
    const free = this.spots.findIndex(([sx, sy]) => !(this.targets || []).some((tg) => Math.abs(sx - tg.x) < 112 && sy > 300 && sy < 600));
    if (free < 0) return;
    const [x, y] = this.spots.splice(free, 1)[0];
    const f = { x, y, g: 0, col: FF_FLOWER_COLS[this.flowers.length % FF_FLOWER_COLS.length] };
    this.flowers.push(f);
    tween(f, { g: 1 }, 0.7, { ease: 'outBack', owner: this });
    Sound.play('sparkle'); Particles.burst('heart', x, y - 40, 5, { speed: 90, size: 9, colors: ['#ff6fc8', '#fff'], life: 0.9, g: -40 });
  }
  onAllPlaced() {
    after(0.9, () => {
      this.cheer = 1; Sound.play('yay');
      Voice.say('Super! Der Park ist wieder sauber!', { force: true });
      const nk = this.nick; nk.mood = 'dizzy';
      tween(nk, { spin: TAU * 2, x: View.R + 220, y: 60 }, 1.3, { ease: 'inBack', delay: 0.5, owner: this });
      for (let i = 0; i < 3; i++) after(0.2 + i * 0.3, () => Particles.pow(rand(300, 900), rand(230, 420), rand(60, 90), pick([PAL.yellow, '#7fe3ff', PAL.pink])), this);
    }, this);
    return 2.4;
  }
  nextRound(r) { this.cheer = 0; super.nextRound(r); }
  drawScene(c) {
    const w = this.W, t = Game.time;
    Draw.city(c, w, { groundY: 430, ground: 'grass', deco: false });
    // Büsche am Parkrand
    for (let x = Math.floor((View.L - 60) / 150) * 150 + 40; x < View.R + 80; x += 150) {
      c.save(); c.translate(x, 438);
      for (const [dx, dy, r] of [[-30, 0, 30], [0, -14, 36], [32, 0, 30]]) { Draw.circle(c, dx, dy, r); Draw.fs(c, '#3fae3a', 4); }
      for (const [dx, dy, r] of [[-30, 0, 30], [0, -14, 36], [32, 0, 30]]) { Draw.circle(c, dx, dy, r - 3); c.fillStyle = '#3fae3a'; c.fill(); }
      Draw.shine(c, -6, -30, 12, 6, 0.3);
      c.restore();
    }
    for (const f of this.flowers) FF_drawFlower(c, f.x, f.y, f.g, f.col, t);
    const hx = Math.max(View.L + 95, 95);
    Draw.hero(c, this.H, hx, 518, 0.72, { pose: this.cheer ? 'cheer' : 'point', face: this.cheer ? 'happy' : 'smile' });
    const nk = this.nick;
    if (typeof FA_drawNick === 'function') FA_drawNick(c, nk.x, nk.y, nk.s, t, nk.mood, nk.spin);
    else { c.save(); c.globalAlpha = 0.8; Draw.cloud(c, nk.x, nk.y, 40, '#a69fc4', 4); c.restore(); }
  }
  drawTarget(c, tg) {
    if (tg.app <= 0.01) return;
    const glow = Math.max(tg.glow * (0.5 + 0.5 * Math.sin(Game.time * 12)), tg.hover ? 0.7 : 0);
    FF_drawBin(c, tg.x, tg.base, tg.key, { open: tg.open, chomp: tg.chomp, smile: tg.smile, glow, s: tg.app });
  }
  drawItem(c, it) {
    c.rotate((it.rot || 0) * (1 - it.lift));
    FF_drawTrash(c, it.kind, 1);
  }
}

    return { name: names, want: 'Jetzt wollen ' + names + ' über die Straße.', list: others.map((h) => ({ kind: 'hero', h, s: 0.52 })) };
  }
  setupRound(r) {
    this.phase = 'enter'; this.pedLight = 'red'; this.btnLit = 0; this.cheer = 0;
    const g = this.group(r); this.grp = g;
    this.walkers = g.list.map((q, i) => ({ ...q, i, x: View.L - 80 - i * 70, y: 652, wx: 438 - i * 60, moving: true, done: false, wob: 0, ph: rand(0, 6) }));
    this.walkers.forEach((w) => tween(w, { x: w.wx }, 1.8, { ease: 'outQuad', owner: this, done: () => { w.moving = false; } }));
    after(1.9, () => {
      this.phase = 'wait'; Game.lastInput = Game.time;
      Voice.say(r === 0 ? 'Ampel-Helden! Bei Rot stehen, bei Grün gehen! ' + g.want + ' Drück den Knopf an der Ampel!' : g.want + ' Drück den Knopf an der Ampel!', { force: true });
    }, this);
  }
  instruction() {
    const g = this.grp;
    if (this.phase === 'wait' || this.phase === 'enter') return (g ? g.want + ' ' : '') + 'Drück den Knopf an der Ampel!';
    if (this.phase === 'pressed' || this.phase === 'stopping') return 'Rot heißt stehen! Wir warten, bis die Ampel grün ist.';
    if (this.phase === 'green') return this.small ? 'Grün! Jetzt dürfen wir gehen!' : 'Grün! Tipp auf ' + g.name + ', dann gehen sie los!';
    return 'Ampel-Helden! Bei Rot stehen, bei Grün gehen! Drück den Knopf an der Ampel!';
  }
  spawnCar(lane, x) {
    const L = FE_LANES[lane];
    const car = { lane, dir: L.dir, x: x !== undefined ? x : (L.dir > 0 ? View.L - 130 : View.R + 130), y: L.y, v: 170, color: pick([PAL.red, PAL.blue, PAL.yellow, PAL.green, PAL.orange, PAL.purple, PAL.pink]), s: 0.55, jump: 0 };

  }
  roadClear() { return !this.cars.some((c) => Math.abs(c.x - FE_CROSS.x) < FE_CROSS.w / 2 + 62); }
  updateCars(dt) {
    for (let lane = 0; lane < 2; lane++) {
      const L = FE_LANES[lane], dir = L.dir;
      const list = this.cars.filter((c) => c.lane === lane).sort((a, b) => (dir > 0 ? b.x - a.x : a.x - b.x));
      const stopX = L.stop - dir * 54;
      let prev = null;
      for (const car of list) {
        let limit = 1e9;
        const before = dir > 0 ? car.x <= stopX + 1 : car.x >= stopX - 1;
        if (this.carLight !== 'green' && before) limit = Math.abs(stopX - car.x);
        if (prev) limit = Math.min(limit, Math.abs(prev.x - car.x) - 125);
        const want = limit < 150 ? Math.max(0, limit) * 2.4 : 175;
        car.v += (Math.min(want, 175) - car.v) * Math.min(1, dt * 5);
        car.x += dir * clamp(car.v * dt, 0, Math.max(0, limit));
        car.jump = Math.max(0, car.jump - dt * 2.5);
        prev = car;
      }
      this.spawnT[lane] -= dt;
      if (this.spawnT[lane] <= 0) {
        const ex = dir > 0 ? View.L - 130 : View.R + 130;
        if (!this.cars.some((c) => c.lane === lane && Math.abs(c.x - ex) < 175)) this.spawnCar(lane);
        this.spawnT[lane] = rand(1.7, 3.4);

  press() {

    Particles.burst('star', this.btn.x, this.btn.y, 12, { speed: 220, size: 13, colors: [PAL.yellow, '#fff'], life: 0.7 });
    Voice.say('Super! Die Autos bekommen gleich Rot. Wir warten!', { force: true });
    after(1.0, () => { this.carLight = 'yellow'; Sound.play('tap'); }, this);
    after(2.4, () => { this.carLight = 'red'; this.phase = 'stopping'; Sound.play('tap'); }, this);
  }
  goGreen() {

  }
  cross() {

    this.phase = 'cross'; Sound.play('yay');
    const X = FE_CROSS.x - 6;
    this.walkers.forEach((w, i) => {
      w.moving = true;
      const pts = [[X, 652], [X, 398], [760 + i * 60, 396]];
      let d0 = 0.25 + i * 0.5;

  }
  checkArrived() {
    if (this.phase !== 'cross' || !this.walkers.every((w) => w.done)) return;
    this.phase = 'arrived'; Sound.play('success');

    after(0.6, () => { this.pedLight = 'red'; this.btnLit = 0; this.cheer = 0; Sound.play('tap'); }, this);

  hitWalker(p) { return this.walkers.find((w) => inRect(p, w.x, w.y - 55, 110, 130)); }
  onDown(p) {
    const b = this.btn;
    if (inRect(p, b.x, b.y, 130, 140) || inRect(p, 700, 300, 130, 210) || inRect(p, 400, 262, 100, 180)) { this.press(); return; }
    const w = this.hitWalker(p);
    if (w || (this.phase === 'green' && !this.small && inRect(p, 330, 600, 330, 200))) {
      if (this.phase === 'green') { this.cross(); return; }
      if (w) { w.wob = 1; Sound.play('boop'); }
      if (this.phase === 'wait') Voice.say('Rot heißt stehen! Drück den Knopf!', { force: true });
      else if (this.phase === 'pressed' || this.phase === 'stopping') Voice.say('Noch ist es rot. Wir warten auf Grün!', { force: true });

  }
  hint() {

    return null;
  }

  drawScene(c) {

class StartScene {
  enter() { this.t = 0; this.btn = { x: DW / 2, y: 600, r: 92 }; this.press = 0; }

    c.save(); c.translate(DW / 2, 240); c.rotate(t * 0.12); c.fillStyle = 'rgba(255,255,255,0.09)';
    for (let i = 0; i < 16; i += 2) { c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, 1400, (i / 16) * TAU, ((i + 1) / 16) * TAU); c.closePath(); c.fill(); }
    c.restore();
    for (let i = 0; i < 30; i++) { const sx = (i * 137) % 1100 - 40, sy = ((i * 89) % 420) - 40, tw = 0.5 + 0.5 * Math.sin(t * 3 + i); c.save(); c.globalAlpha = 0.35 + tw * 0.5; Draw.starPath(c, sx, sy, 6 + (i % 3) * 3, 3, 4); c.fillStyle = '#fff'; c.fill(); c.restore(); }

    }

  drawCard(c, cd) {
    const w = cd.w, x = cd.x, y = 400, cw = 440, ch = 580, t = this.t;
    const dim = this.sel && this.sel !== cd ? 0.45 : 1;
    const s = 1 + cd.pop * 0.08 + (this.sel === cd ? 0.04 : Math.sin(t * 2.5 + x) * 0.012);
    c.save(); c.translate(x, y); c.scale(s, s); c.globalAlpha = dim;
    Draw.shadow(c, 0, ch / 2 + 10, cw / 2, 16, 0.3);
    c.save(); Draw.rrPath(c, -cw / 2, -ch / 2, cw, ch, 44); c.clip();
    const g = c.createLinearGradient(0, -ch / 2, 0, ch / 2); g.addColorStop(0, w.skyTop); g.addColorStop(1, w.skyBottom); c.fillStyle = g; c.fillRect(-cw / 2, -ch / 2, cw, ch);
    if (w.id === 'girls') Draw.rainbow(c, 0, 90, 200, 16, 0.75); else { Draw.sun(c, 140, -190, 34); }
    Draw.cloud(c, -120 + Math.sin(t * 0.5) * 20, -170, 26, '#fff', 0);
    for (let i = 0; i < 5; i++) Draw.building(c, -180 + i * 90, 170, 80, 120 + ((i * 37) % 4) * 34, w.cityColors[i % w.cityColors.length], { roof: ['antenna', 'dome', 'flat', 'spike', 'flat'][i], heart: w.id === 'girls' });
    c.fillStyle = w.id === 'girls' ? w.grass : w.road; c.fillRect(-cw / 2, 170, cw, 200);
    c.restore();
    Draw.rrPath(c, -cw / 2, -ch / 2, cw, ch, 44); c.lineWidth = 10; c.strokeStyle = '#fff'; c.stroke(); c.lineWidth = 5; c.strokeStyle = INK; c.stroke();
    // Emblem oben
    Draw.circle(c, 0, -ch / 2 + 6, 48); Draw.fs(c, '#fff', 5); Draw.symbol(c, w.emblem, 0, -ch / 2 + 6, 30, w.accent, 4);
    // drei Helden
    const ids = w.heroes, sel = this.sel === cd;
    Draw.hero(c, HEROES[ids[1]], -128, 150, 0.62, { pose: sel ? 'cheer' : 'stand', face: sel ? 'happy' : 'smile' });
    Draw.hero(c, HEROES[ids[2]], 128, 150, 0.62, { pose: sel ? 'cheer' : 'stand', face: sel ? 'happy' : 'smile' });
    Draw.hero(c, HEROES[ids[0]], 0, 190, 0.78, { pose: sel ? 'cheer' : 'wave', face: 'happy' });
    // Name (für Eltern)
    Draw.rrPath(c, -150, ch / 2 - 66, 300, 54, 27); Draw.fs(c, w.ui, 4);
    Draw.label(c, w.name, 0, ch / 2 - 38, 34, '#fff', INK);
    c.restore();
  }
}

/* ---------- Held wählen ---------- */
class HeroScene {
  enter() {
    this.t = 0; const w = Game.world; this.w = w; this.sel = null;
    this.slots = w.heroes.map((id, i) => ({ h: HEROES[id], x: 230 + i * 282, y: 520, pop: 0 }));
    this.back = { x: View.L + 64, y: View.T + 64, r: 44 };
    after(0.4, () => Voice.say(w.id === 'girls' ? 'Wähle deine Heldin!' : 'Wähle deinen Helden!', { force: true }), this);
    this.hi = 0;
  }
  update(dt) { this.t += dt; for (const s of this.slots) s.pop = Math.max(0, s.pop - dt * 2); }
  down(p) {
    if (inCircle(p, this.back.x, this.back.y, this.back.r + 12)) { Sound.play('tap'); setScene(new WorldScene()); return; }
    for (const s of this.slots) if (inRect(p, s.x, s.y - 110, 240, 330)) {
      if (this.sel === s) return;
      this.sel = s; s.pop = 1; Sound.play('powerup');
      Store.data.hero[this.w.id] = s.h.id; Store.save();
      Voice.say(s.h.intro, { force: true });
      Particles.burst('star', s.x, s.y - 120, 20, { speed: 320, size: 16, colors: [PAL.yellow, '#fff', s.h.cape], life: 1 });
      Timers.cancel(this.goT); this.goT = after(2.6, () => setScene(new HubScene()), this);
      return;
    }
  }
  hint() { if (this.sel) return null; const s = this.slots[this.hi++ % 3]; return { x1: s.x, y1: s.y - 120 }; }
  draw(c) {
    Draw.city(c, this.w, { groundY: 600, ground: 'grass' });
    for (const s of this.slots) {
      const on = this.sel === s, last = !this.sel && Store.data.hero[this.w.id] === s.h.id;
      Draw.pedestal(c, s.x, s.y + 40, 190, on ? PAL.yellow : '#fff');
      if (on || last) { c.save(); c.globalAlpha = on ? 0.55 : 0.25; Draw.burst(c, s.x, s.y - 110, 150 + Math.sin(this.t * 4) * 6, '#fff', 14, 0); c.restore(); }
      const sc = 1.0 + s.pop * 0.15;
      Draw.hero(c, s.h, s.x, s.y, sc, { pose: on ? 'cheer' : (this.sel ? 'stand' : 'wave'), face: on ? 'happy' : 'smile', t: this.t + s.x * 0.01 });
    }
    Draw.roundButton(c, this.back.x, this.back.y, this.back.r, this.w.ui, Draw.iconBack);
  }
}

/* ---------- Helden-Zentrale: alle Minispiele als große Abzeichen ---------- */
class HubScene {
  enter() {
    this.t = 0; const w = Game.world; this.w = w; this.h = Game.hero; this.tapped = null;
    this.layout();
    this.back = { x: View.L + 64, y: View.T + 64, r: 44 };
    this.gear = { x: View.R - 48, y: View.B - 48, r: 30, hold: 0 };
    const done = Store.data.done[w.id];
    const allDone = GAMES.length > 0 && GAMES.every((g) => done[g.id]);
    if (allDone && !Store.data.party[w.id]) {
      Store.data.party[w.id] = true; Store.save();
      after(0.5, () => { Sound.play('fanfare'); Particles.confettiRain(200, { layer: 1 }); Voice.say('Wahnsinn! Du hast alle Missionen geschafft! Du bist ' + (w.id === 'girls' ? 'eine Super-Heldin!' : 'ein Super-Held!'), { force: true }); }, this);
      for (let i = 0; i < 6; i++) after(0.8 + i * 0.45, () => { Particles.pow(rand(150, 870), rand(150, 450), rand(70, 110), pick([PAL.yellow, PAL.pink, '#7fe3ff', PAL.green]), 1); Sound.play('pop', { pitch: rand(0.7, 1.4) }); }, this);
    } else after(0.4, () => Voice.say(Store.data.plays === 0 ? 'Willkommen in der Helden-Zentrale! Tipp auf ein Spiel!' : 'Wähle ein Spiel!', { force: true }), this);
  }
  layout() {
    // Lernspiele im Raster in der Mitte, Spezialspiele groß links und rechts (hochkant: oben)
    const reg = GAMES.filter((g) => !g.special), spe = GAMES.filter((g) => g.special);
    const port = View.portrait; this.port = port;
    const cols = reg.length > 12 ? 5 : 4, rows = Math.max(1, Math.ceil(reg.length / cols));
    const big = reg.length <= 8 && !spe.length;
    let gx, r, gy, y0;
    if (big) { gx = 210; r = 90; gy = 236; y0 = 270; }
    else if (port) { gx = 200; r = 80; gy = 196; y0 = 300; }
    else { gx = 152; r = 62; gy = Math.min(166, 480 / Math.max(1, rows - 1)); y0 = rows >= 3 ? 238 : 300; }
    const old = {}; for (const b of this.badges || []) old[b.g.id] = b.pop;
    this.badges = reg.map((g, i) => {
      const row = Math.floor(i / cols), inRow = Math.min(cols, reg.length - row * cols);
      return { g, x: DW / 2 + (i % cols - (inRow - 1) / 2) * gx, y: y0 + row * gy, r, pop: old[g.id] || 0, i };
    });
    const gridL = DW / 2 - ((cols - 1) / 2) * gx - r - 8, gridR = DW / 2 + ((cols - 1) / 2) * gx + r + 8;
    spe.forEach((g, k) => {
      const left = k % 2 === 0;
      const b = port
        ? { x: DW / 2 + (left ? -1 : 1) * 190, y: y0 - gy / 2 - 120, r: 84 }
        : { x: left ? (View.L + gridL) / 2 : (View.R + gridR) / 2, y: 404, r: Math.min(84, Math.max(60, (left ? gridL - View.L : View.R - gridR) / 2 - 16)) };
      this.badges.push(Object.assign(b, { g, special: true, pop: old[g.id] || 0, i: reg.length + k }));
    });
    this.back = { x: View.L + 64, y: View.T + 64, r: 44 };
    this.gear = Object.assign(this.gear || { hold: 0 }, { x: View.R - 48, y: View.B - 48, r: 30 });
    this.vkey = View.cw + 'x' + View.ch;
  }
  update(dt) {
    if (this.vkey !== View.cw + 'x' + View.ch) this.layout();
    this.t += dt; for (const b of this.badges) b.pop = Math.max(0, b.pop - dt * 2.5);
    const g = this.gear;
    if (g.holding && Input.down) { g.hold += dt / 1.2; if (g.hold >= 1) { g.hold = 0; g.holding = false; Game.overlay = new SettingsOverlay(); } }
    else { g.holding = false; g.hold = Math.max(0, g.hold - dt * 2); }
  }
  down(p) {
    if (this.tapped) return;
    if (inCircle(p, this.back.x, this.back.y, this.back.r + 12)) { Sound.play('tap'); setScene(new WorldScene()); return; }
    if (inCircle(p, this.gear.x, this.gear.y, this.gear.r + 16)) { this.gear.holding = true; return; }
    for (const b of this.badges) if (inCircle(p, b.x, b.y, b.r + 10)) {
      this.tapped = b; b.pop = 1; Sound.play('powerup'); Voice.say(b.g.name + '!', { force: true });
      Particles.burst('star', b.x, b.y, 18, { speed: 300, size: 15, colors: [PAL.yellow, '#fff', b.g.color], life: 0.9, layer: 1 });
      after(0.9, () => setScene(b.g.make(), { color: b.g.color }), this);
      return;
    }
  }
  up() { this.gear.holding = false; }
  hint() {
    const done = Store.data.done[this.w.id];
    const b = this.badges.find((q) => !done[q.g.id]) || this.badges[0];
    return b ? { x1: b.x, y1: b.y } : null;
  }
  draw(c) {
    const w = this.w, t = this.t;
    Draw.city(c, w, { groundY: 660, ground: 'street', deco: false });
    const done = Store.data.done[w.id];
    // Held fliegt oben hin und her
    const ph = t * 0.45, hx = DW / 2 + Math.sin(ph) * 250, hy = (this.port ? View.T + 175 : 105) + Math.sin(t * 1.6) * 8, dir = Math.cos(ph) >= 0 ? 1 : -1;
    Draw.speedLines(c, hx - dir * 70, hy + 6, 90, 3, '#fff', 0.6);
    Draw.hero(c, this.h, hx, hy, 0.46, { pose: 'fly', flip: dir < 0, face: 'happy' });
    for (const b of this.badges) this.drawBadge(c, b, !!done[b.g.id]);
    Draw.roundButton(c, this.back.x, this.back.y, this.back.r, w.ui, Draw.iconBack);
    // Pokal, wenn alles geschafft
    if (GAMES.length && GAMES.every((g) => done[g.id])) this.drawTrophy(c, View.R - 80, View.T + 72);
    // Eltern-Zahnrad (gedrückt halten)
    const g = this.gear;
    c.save(); c.globalAlpha = 0.65; Draw.circle(c, g.x, g.y, g.r); Draw.fs(c, 'rgba(0,0,0,0.25)', 0); Draw.iconGear(c, g.x, g.y, g.r * 1.4); c.restore();
    if (g.hold > 0) { c.lineWidth = 7; c.strokeStyle = '#fff'; c.beginPath(); c.arc(g.x, g.y, g.r + 8, -Math.PI / 2, -Math.PI / 2 + TAU * g.hold); c.stroke(); }
  }
  drawBadge(c, b, done) {
    const g = b.g, wob = Math.sin(this.t * 2.2 + b.i * 0.9) * 0.025;
    const s = 1 + b.pop * 0.18 + (done ? 0 : wob);
    c.save(); c.translate(b.x, b.y); c.scale(s, s);
    Draw.shadow(c, 0, b.r + 8, b.r * 0.85, 12, 0.25);
    if (b.special) {
      c.save(); c.rotate(this.t * 0.5); c.fillStyle = 'rgba(255,236,140,0.55)';
      for (let i = 0; i < 12; i += 2) { c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, b.r + 34, (i / 12) * TAU, ((i + 1) / 12) * TAU); c.closePath(); c.fill(); }
      c.restore();
      Draw.circle(c, 0, 0, b.r + 14); Draw.fs(c, PAL.gold, 5);
      for (let i = 0; i < 10; i++) { const a = (i / 10) * TAU + this.t * 0.6; Draw.starPath(c, Math.cos(a) * (b.r + 7), Math.sin(a) * (b.r + 7), 6, 2.6, 4); c.fillStyle = '#fff'; c.fill(); }
    }
    Draw.circle(c, 0, 0, b.r + 8); Draw.fs(c, '#fff', 5);
    Draw.circle(c, 0, 0, b.r - 2); c.fillStyle = g.color; c.fill();
    c.save(); Draw.circle(c, 0, 0, b.r - 10); c.clip();
    try { g.icon(c, 0, 0, b.r - 10, this.w); } catch (e) { console.error(e); }
    c.restore();
    Draw.circle(c, 0, 0, b.r - 10); c.lineWidth = 4; c.strokeStyle = INK; c.stroke();
    Draw.circle(c, 0, 0, b.r + 8); c.lineWidth = 5; c.strokeStyle = INK; c.stroke();
    if (b.special) { c.save(); c.translate(0, -b.r - 16); c.rotate(Math.sin(this.t * 2) * 0.08); this.drawCrown(c); c.restore(); }
    if (done) { c.save(); c.translate(b.r * 0.7, -b.r * 0.72); c.rotate(Math.sin(this.t * 3 + b.i) * 0.15); Draw.medal(c, 0, 0, b.r < 70 ? 20 : 26, PAL.gold, 'star'); c.restore(); }
    c.restore();
  }
  drawCrown(c) {
    c.beginPath(); c.moveTo(-30, 12); c.lineTo(-34, -16); c.lineTo(-16, -2); c.lineTo(0, -24); c.lineTo(16, -2); c.lineTo(34, -16); c.lineTo(30, 12); c.closePath(); Draw.fs(c, PAL.gold, 4);
    for (const [x, y, col] of [[-34, -18, PAL.red], [0, -26, PAL.blue], [34, -18, PAL.green]]) { Draw.circle(c, x, y, 5.5); Draw.fs(c, col, 2.5); }
    Draw.shine(c, -12, 0, 8, 4, 0.5);
  }
  drawTrophy(c, x, y) {
    c.save(); c.translate(x, y); const s = 1 + Math.sin(this.t * 3) * 0.05; c.scale(s, s);
    c.beginPath(); c.moveTo(-40, -36); c.lineTo(40, -36); c.quadraticCurveTo(40, 14, 0, 18); c.quadraticCurveTo(-40, 14, -40, -36); c.closePath(); Draw.fs(c, PAL.gold, 4);
    c.lineWidth = 7; c.strokeStyle = INK; for (const sx of [-1, 1]) { c.beginPath(); c.arc(sx * 42, -16, 14, sx > 0 ? -1.4 : 1.4 + Math.PI * 0, sx > 0 ? 1.4 : Math.PI * 2 - 1.4, sx < 0); c.stroke(); }
    Draw.rrPath(c, -10, 16, 20, 18, 3); Draw.fs(c, PAL.gold, 4); Draw.rrPath(c, -30, 32, 60, 14, 5); Draw.fs(c, '#8a5a2b', 4);
    Draw.starPath(c, 0, -14, 16, 7, 5); c.fillStyle = '#fff'; c.fill();
    c.restore();
  }
}

/* ---------- Eltern-Einstellungen (Zahnrad gedrückt halten) ---------- */
class SettingsOverlay {
  constructor() {
    Sound.play('select');
    const y0 = 250;
    this.rows = [
      { kind: 'toggle', key: 'music', label: 'Musik', y: y0 },
      { kind: 'toggle', key: 'voice', label: 'Sprache', y: y0 + 80 },
      { kind: 'toggle', key: 'sfx', label: 'Geräusche', y: y0 + 160 },
      { kind: 'level', label: 'Alter', y: y0 + 240 },
    ];
  }
  down(p) {
    if (inCircle(p, DW / 2 + 290, 160, 40)) { Sound.play('tap'); Game.overlay = null; return; }
    for (const r of this.rows) {
      if (r.kind === 'toggle' && inRect(p, DW / 2 + 150, r.y, 140, 64)) { Store.data.settings[r.key] = !Store.data.settings[r.key]; Store.save(); Sound.applySettings(); if (!Store.data.settings.voice) Voice.stop(); Sound.play('tap'); }
      if (r.kind === 'level') {
        if (inRect(p, DW / 2 + 70, r.y, 130, 64)) { Store.data.level = 'small'; Store.save(); Sound.play('tap'); }
        if (inRect(p, DW / 2 + 220, r.y, 130, 64)) { Store.data.level = 'big'; Store.save(); Sound.play('tap'); }
      }
    }
    if (inRect(p, DW / 2, 600, 360, 64)) { Store.data.done = { boys: {}, girls: {} }; Store.data.party = { boys: false, girls: false }; Store.data.plays = 0; Store.save(); Sound.play('boop'); Game.overlay = null; }
  }
  draw(c) {
    c.save(); c.fillStyle = 'rgba(20,16,40,0.6)'; c.fillRect(View.L - 5, View.T - 5, View.vw + 10, View.vh + 10); c.restore();
    Draw.rrPath(c, DW / 2 - 330, 120, 660, 540, 36); Draw.fs(c, '#fff', 5);
    Draw.label(c, 'Für Eltern', DW / 2, 165, 40, INK, null);
    Draw.roundButton(c, DW / 2 + 290, 160, 34, PAL.red, (cc, x, y) => { cc.lineWidth = 6; cc.strokeStyle = '#fff'; cc.beginPath(); cc.moveTo(x - 11, y - 11); cc.lineTo(x + 11, y + 11); cc.moveTo(x + 11, y - 11); cc.lineTo(x - 11, y + 11); cc.stroke(); });
    for (const r of this.rows) {
      Draw.label(c, r.label, DW / 2 - 260, r.y, 34, INK, null, 600, 'left');
      if (r.kind === 'toggle') {
        const on = Store.data.settings[r.key];
        Draw.rrPath(c, DW / 2 + 80, r.y - 30, 140, 60, 30); Draw.fs(c, on ? PAL.green : '#cfd3dc', 4);
        Draw.circle(c, DW / 2 + (on ? 190 : 110), r.y, 24); Draw.fs(c, '#fff', 4);
        Draw.label(c, on ? 'an' : 'aus', DW / 2 + (on ? 125 : 175), r.y + 1, 24, '#fff', null, 600);
      } else {
        const sm = Store.data.level === 'small';
        Draw.rrPath(c, DW / 2 + 5, r.y - 30, 130, 60, 22); Draw.fs(c, sm ? Game.world.ui : '#e8eaf0', 4); Draw.label(c, '2–3', DW / 2 + 70, r.y + 1, 30, sm ? '#fff' : INK, null, 700);
        Draw.rrPath(c, DW / 2 + 155, r.y - 30, 130, 60, 22); Draw.fs(c, !sm ? Game.world.ui : '#e8eaf0', 4); Draw.label(c, '4+', DW / 2 + 220, r.y + 1, 30, !sm ? '#fff' : INK, null, 700);
      }
    }
    Draw.rrPath(c, DW / 2 - 180, 568, 360, 64, 24); Draw.fs(c, '#ffe1e1', 4); Draw.label(c, 'Medaillen zurücksetzen', DW / 2, 601, 26, '#b02a2a', null, 600);
  }
}

/* ---------- Start ---------- */
function boot() {
  const q = new URLSearchParams(location.search);
  if (q.get('w') === 'boys' || q.get('w') === 'girls') Store.data.world = q.get('w');
  if (q.get('h') && HEROES[q.get('h')]) Store.data.hero[Store.data.world || 'boys'] = q.get('h');
  if (q.get('lvl') === 'small' || q.get('lvl') === 'big') Store.data.level = q.get('lvl');
  if (!Store.data.world && (q.get('g') || q.get('s'))) Store.data.world = 'boys';
  const g = q.get('g'), s = q.get('s');
  if (g && gameDef(g)) swapScene(gameDef(g).make());
  else if (s === 'hub') swapScene(new HubScene());
  else if (s === 'world') swapScene(new WorldScene(true));
  else if (s === 'hero') swapScene(new HeroScene());
  else swapScene(new StartScene());
  requestAnimationFrame(frame);
}
window.MH = { View, Game, Store, GAMES, setScene, swapScene, gameDef, HubScene, WorldScene, HeroScene, StartScene, Voice, Sound, Particles, Hand };

boot();

</script>
