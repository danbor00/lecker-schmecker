<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Netz-Jagd">
<meta name="theme-color" content="#2b1d3f">
<title>Netz-Jagd</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2b1d3f;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =========================================================
   NETZ-JAGD – Superhelden-Verfolgungsspiel fürs iPad
   Wischen: ← → Spur wechseln, ↑ springen, ↓ rutschen
   Tippen: links/rechts vom Helden = Spur wechseln,
           auf den Bösewicht oder den Netz-Knopf = Netz werfen
   ========================================================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,U=1,K=120,HOR=200,CAMH=2.5,CX=0,GROUNDY=0,CAMX=0;
const D=6,ZMAX=72,LANE_W=1.3,ROAD_HALF=2.1,EDGE=2.9,OL='#2b1d3f',LW=0.05;
const FONT='"Arial Rounded MT Bold","Avenir Next","Trebuchet MS",system-ui,sans-serif';
let T=0,DT=0,shake=0,UI=[];

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.6);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  U=Math.min(W,H)/100;CX=W/2;GROUNDY=H*0.8;
  K=Math.min(H*0.16,W*0.2);
  CAMH=Math.max(1.6,Math.min(4,(GROUNDY-H*0.36)/K));
  HOR=GROUNDY-CAMH*K;
}
window.addEventListener('resize',resize);resize();
function P(x,y,z){const s=K*D/(z+D);return{x:CX+(x-CAMX)*s,y:HOR+(CAMH-y)*s,s};}

/* ---------- Farben & Helfer ---------- */
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function hexA(h,a){const c=hex2rgb(h);return`rgba(${c[0]},${c[1]},${c[2]},${a})`;}
const FOG=[214,236,255],WINC=[236,248,255];
function mixc(c,f,dark){dark=dark||1;return`rgb(${(c[0]*dark*(1-f)+FOG[0]*f)|0},${(c[1]*dark*(1-f)+FOG[1]*f)|0},${(c[2]*dark*(1-f)+FOG[2]*f)|0})`;}
function rrect(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0.0001,r),0,Math.PI*2);}
function ell(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,Math.max(0.0001,rx),Math.max(0.0001,ry),0,0,Math.PI*2);}
function fillStroke(f,lw){ctx.fillStyle=f;ctx.fill();if(lw){ctx.lineWidth=lw;ctx.strokeStyle=OL;ctx.lineJoin='round';ctx.stroke();}}
function starPath(x,y,R,r,n){ctx.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,rr=i%2?r:R;if(i)ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);else ctx.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();}
function drawStarShape(x,y,r,col,lw){starPath(x,y,r,r*0.46,5);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=lw===undefined?r*0.15:lw;ctx.strokeStyle='#d98200';ctx.lineJoin='round';ctx.stroke();}
function txt(s,x,y,size,fill,stroke,align,lw){ctx.font=`900 ${size}px ${FONT}`;ctx.textAlign=align||'center';ctx.textBaseline='middle';if(stroke){ctx.lineJoin='round';ctx.lineWidth=lw===undefined?size*0.2:lw;ctx.strokeStyle=stroke;ctx.strokeText(s,x,y);}ctx.fillStyle=fill||'#fff';ctx.fillText(s,x,y);}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- Helden & Bösewichte ---------- */
const HEROES=[
 {id:'fox',name:'Flitz',fur:'#ff8a1f',muzzle:'#fff1de',suit:'#2f7bf0',limb:'#2f7bf0',shoe:'#173b80',mask:'#173b80',cape:'#ffd02e',net:'#ffb52e',veh:'car',vehCol:'#ff8a1f',ear:'pointy',inner:'#fff1de',tail:'fox',emblem:'bolt'},
 {id:'panda',name:'Pina',fur:'#ffffff',muzzle:'#ffffff',suit:'#ff5fa8',limb:'#2a2a35',shoe:'#2a2a35',mask:'#9b4be0',cape:'#b77bff',net:'#ff79c6',veh:'scooter',vehCol:'#ff5fa8',ear:'round',earCol:'#2a2a35',tail:'stub',emblem:'heart'},
 {id:'cat',name:'Kiko',fur:'#9a6bff',muzzle:'#efe6ff',suit:'#14b8a6',limb:'#14b8a6',shoe:'#0b6e64',mask:'#0b6e64',cape:'#ff8a3d',net:'#3fe8d8',veh:'rocket',vehCol:'#14b8a6',ear:'pointy',inner:'#ffb3d9',tail:'cat',emblem:'star'},
 {id:'dino',name:'Rexi',fur:'#3cc35a',muzzle:'#d6ffc6',suit:'#ff9f1c',limb:'#ff9f1c',shoe:'#b35f00',mask:'#c4570a',cape:'#ffe14d',net:'#b4ff4d',veh:'truck',vehCol:'#3cc35a',ear:'spikes',tail:'dino',emblem:'flame'}
];
const VILLAINS=[{name:'Graf Grummel',call:'Fang Graf Grummel!'},{name:'Schleimi',call:'Fang Schleimi!'},{name:'Robo-Krähe',call:'Fang die Robo-Krähe!'}];
const VB=[[-0.5,-2.22,1.25,2.22],[-0.72,-1.2,1.44,1.25],[-0.6,-1.5,1.2,1.5]];

/* ---------- Zeichnen: Helden ---------- */
function drawEmblem(kind,x,y,s,col){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  if(kind==='star'){starPath(0,0,1,0.45,5);}
  else{ctx.beginPath();
    if(kind==='bolt'){ctx.moveTo(0.25,-1);ctx.lineTo(-0.5,0.12);ctx.lineTo(0,0.12);ctx.lineTo(-0.25,1);ctx.lineTo(0.5,-0.18);ctx.lineTo(0,-0.18);ctx.closePath();}
    else if(kind==='heart'){ctx.moveTo(0,0.8);ctx.bezierCurveTo(-1.2,-0.1,-0.6,-1.1,0,-0.4);ctx.bezierCurveTo(0.6,-1.1,1.2,-0.1,0,0.8);}
    else{ctx.moveTo(0,-1);ctx.quadraticCurveTo(0.8,-0.1,0.55,0.5);ctx.quadraticCurveTo(0.3,1,0,0.95);ctx.quadraticCurveTo(-0.6,0.95,-0.6,0.3);ctx.quadraticCurveTo(-0.6,-0.2,-0.1,-0.3);ctx.quadraticCurveTo(0.12,-0.6,0,-1);}
  }
  ctx.fillStyle=col;ctx.fill();ctx.restore();
}
function drawEars(h,hy,front){
  if(h.ear==='pointy'){for(const sg of[-1,1]){ctx.beginPath();ctx.moveTo(sg*0.1,hy-0.34);ctx.lineTo(sg*0.36,hy-0.68);ctx.lineTo(sg*0.39,hy-0.18);ctx.closePath();fillStroke(h.fur,LW);
    if(front){ctx.beginPath();ctx.moveTo(sg*0.18,hy-0.33);ctx.lineTo(sg*0.34,hy-0.56);ctx.lineTo(sg*0.35,hy-0.27);ctx.closePath();ctx.fillStyle=h.inner;ctx.fill();}}}
  else if(h.ear==='round'){for(const sg of[-1,1]){circ(sg*0.3,hy-0.3,0.15);fillStroke(h.earCol,LW);}}
  else{for(const[x,s]of[[-0.19,0.15],[0,0.22],[0.19,0.15]]){ctx.beginPath();ctx.moveTo(x-0.1,hy-0.3);ctx.lineTo(x,hy-0.38-s);ctx.lineTo(x+0.1,hy-0.3);ctx.closePath();fillStroke(h.cape,LW);}}
}
function drawTail(h,t){
  ctx.save();ctx.translate(0,-0.42);ctx.rotate(Math.sin(t*6)*0.12);
  if(h.tail==='fox'){ctx.rotate(-0.7);ell(0.34,0,0.34,0.15);fillStroke(h.fur,LW);ell(0.6,0,0.11,0.1);ctx.fillStyle=h.muzzle;ctx.fill();}
  else if(h.tail==='cat'){ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(0.5,0.05,0.42,-0.42);ctx.lineCap='round';ctx.lineWidth=0.13;ctx.strokeStyle=OL;ctx.stroke();ctx.lineWidth=0.08;ctx.strokeStyle=h.fur;ctx.stroke();}
  else if(h.tail==='dino'){ctx.beginPath();ctx.moveTo(-0.12,-0.05);ctx.lineTo(0.12,-0.05);ctx.lineTo(0.5,0.32);ctx.closePath();fillStroke(h.fur,LW);}
  else{circ(0,0.06,0.09);fillStroke(h.limb,LW);}
  ctx.restore();
}
function drawHeadBack(h,t,ph){
  const hy=-1.12;
  drawEars(h,hy,false);
  circ(0,hy,0.4);fillStroke(h.fur,LW);
  ctx.save();circ(0,hy,0.4);ctx.clip();ctx.fillStyle=h.mask;ctx.fillRect(-0.5,hy-0.13,1,0.15);ctx.restore();
  const w=Math.sin((ph||t*5)*1.5)*0.06;ctx.fillStyle=h.mask;
  ctx.beginPath();ctx.moveTo(0,hy-0.07);ctx.quadraticCurveTo(0.15,hy+0.05+w,0.32,hy+0.2+w);ctx.lineTo(0.23,hy+0.27+w);ctx.quadraticCurveTo(0.08,hy+0.1,0,hy-0.02);ctx.fill();
  ctx.beginPath();ctx.moveTo(0,hy-0.07);ctx.quadraticCurveTo(-0.08,hy+0.1-w,-0.12,hy+0.32-w);ctx.lineTo(-0.21,hy+0.28-w);ctx.quadraticCurveTo(-0.12,hy+0.08,0,hy-0.02);ctx.fill();
  circ(0,hy-0.05,0.065);ctx.fill();
}
function drawHeadFront(h,t,happy){
  const hy=-1.12;
  drawEars(h,hy,true);
  circ(0,hy,0.4);fillStroke(h.fur,LW);
  ell(0,hy+0.17,0.21,0.14);ctx.fillStyle=h.muzzle;ctx.fill();
  ctx.fillStyle='rgba(255,110,150,0.45)';circ(-0.26,hy+0.1,0.06);ctx.fill();circ(0.26,hy+0.1,0.06);ctx.fill();
  ctx.save();circ(0,hy,0.4);ctx.clip();
  ctx.beginPath();ctx.moveTo(-0.5,hy-0.17);ctx.quadraticCurveTo(0,hy-0.25,0.5,hy-0.17);ctx.lineTo(0.5,hy+0.02);ctx.quadraticCurveTo(0.25,hy+0.07,0,hy-0.02);ctx.quadraticCurveTo(-0.25,hy+0.07,-0.5,hy+0.02);ctx.closePath();ctx.fillStyle=h.mask;ctx.fill();ctx.restore();
  const blink=(t%3.7)<0.12;
  for(const sg of[-1,1]){
    if(blink){ctx.strokeStyle='#fff';ctx.lineWidth=0.04;ctx.beginPath();ctx.moveTo(sg*0.15-0.07,hy-0.07);ctx.lineTo(sg*0.15+0.07,hy-0.07);ctx.stroke();}
    else{ell(sg*0.15,hy-0.07,0.095,0.08);ctx.fillStyle='#fff';ctx.fill();circ(sg*0.15+0.01,hy-0.065,0.047);ctx.fillStyle=OL;ctx.fill();circ(sg*0.15+0.027,hy-0.087,0.016);ctx.fillStyle='#fff';ctx.fill();}
  }
  ell(0,hy+0.09,0.05,0.035);ctx.fillStyle=OL;ctx.fill();
  ctx.strokeStyle=OL;ctx.lineWidth=0.035;
  if(happy){ctx.beginPath();ctx.moveTo(-0.11,hy+0.15);ctx.quadraticCurveTo(0,hy+0.32,0.11,hy+0.15);ctx.closePath();ctx.fillStyle='#c2335a';ctx.fill();ctx.stroke();}
  else{ctx.beginPath();ctx.moveTo(-0.08,hy+0.16);ctx.quadraticCurveTo(0,hy+0.23,0.08,hy+0.16);ctx.stroke();}
}
function drawHeroFront(h,t,happy){
  const w=Math.sin(t*3)*0.05;
  ctx.beginPath();ctx.moveTo(-0.24,-0.86);ctx.lineTo(0.24,-0.86);ctx.lineTo(0.44+w,-0.06);ctx.quadraticCurveTo(0,0.02,-0.44-w,-0.06);ctx.closePath();fillStroke(h.cape,LW);
  drawTail(h,t);
  rrect(-0.2,-0.46,0.16,0.46,0.07);fillStroke(h.limb,LW);rrect(0.04,-0.46,0.16,0.46,0.07);fillStroke(h.limb,LW);
  rrect(-0.24,-0.12,0.22,0.12,0.05);fillStroke(h.shoe,LW);rrect(0.02,-0.12,0.22,0.12,0.05);fillStroke(h.shoe,LW);
  for(const sg of[-1,1]){ctx.save();ctx.translate(sg*0.26,-0.8);ctx.rotate(-sg*(happy?2.5+Math.sin(t*10)*0.2:0.3));rrect(-0.075,0,0.15,0.36,0.07);fillStroke(h.limb,LW);circ(0,0.37,0.085);fillStroke(h.fur,LW);ctx.restore();}
  rrect(-0.28,-0.88,0.56,0.5,0.2);fillStroke(h.suit,LW);
  ctx.fillStyle=h.cape;ctx.fillRect(-0.27,-0.5,0.54,0.07);
  circ(0,-0.68,0.13);fillStroke('#fff',0.03);drawEmblem(h.emblem,0,-0.68,0.09,h.mask);
  drawHeadFront(h,t,happy);
}
function drawHeroBack(h,ph,air,slide,t){
  const bob=air?0:Math.abs(Math.sin(ph))*0.07;
  ctx.save();ctx.translate(0,-bob);
  if(slide)ctx.scale(1.15,0.55);
  const s1=Math.sin(ph);
  const l1=air?0.15:Math.max(0,s1)*0.17,l2=air?0.15:Math.max(0,-s1)*0.17;
  rrect(-0.2,-0.46,0.16,0.46-l1,0.07);fillStroke(h.limb,LW);
  rrect(0.04,-0.46,0.16,0.46-l2,0.07);fillStroke(h.limb,LW);
  rrect(-0.22,-0.12-l1,0.2,0.12,0.05);fillStroke(h.shoe,LW);
  rrect(0.02,-0.12-l2,0.2,0.12,0.05);fillStroke(h.shoe,LW);
  const a=air?-0.2:s1*0.12;
  rrect(-0.41,-0.82+a,0.15,0.36,0.07);fillStroke(h.limb,LW);
  rrect(0.26,-0.82-a,0.15,0.36,0.07);fillStroke(h.limb,LW);
  rrect(-0.28,-0.88,0.56,0.5,0.2);fillStroke(h.suit,LW);
  ctx.fillStyle=h.cape;ctx.fillRect(-0.27,-0.5,0.54,0.07);
  drawTail(h,t);
  const w=Math.sin(ph*2)*0.06+(air?0.1:0);
  ctx.beginPath();ctx.moveTo(-0.22,-0.86);ctx.lineTo(0.22,-0.86);ctx.quadraticCurveTo(0.36+w,-0.5,0.38+w,-0.24);ctx.quadraticCurveTo(0.12,-0.16-w,0,-0.22);ctx.quadraticCurveTo(-0.12,-0.16+w,-0.38-w,-0.24);ctx.quadraticCurveTo(-0.36-w,-0.5,-0.22,-0.86);ctx.closePath();fillStroke(h.cape,LW);
  drawEmblem(h.emblem,0,-0.58,0.09,'rgba(255,255,255,0.85)');
  drawHeadBack(h,t,ph);
  ctx.restore();
}
function drawHeroSwing(h,t,th,side,sway,air){
  const lim=h.limb;
  ctx.save();ctx.translate(0,-0.46);ctx.rotate(sway);const tk=air?0.12:0;
  rrect(-0.18,0,0.16,0.42-tk,0.07);fillStroke(lim,LW);rrect(0.02,-0.02,0.16,0.4-tk,0.07);fillStroke(lim,LW);
  rrect(-0.21,0.32-tk,0.2,0.12,0.05);fillStroke(h.shoe,LW);rrect(0.01,0.3-tk,0.2,0.12,0.05);fillStroke(h.shoe,LW);ctx.restore();
  ctx.save();ctx.translate(-side*0.26,-0.8);ctx.rotate(side*(0.55+Math.sin(t*6)*0.12));rrect(-0.075,0,0.15,0.36,0.07);fillStroke(lim,LW);circ(0,0.37,0.08);fillStroke(h.fur,LW);ctx.restore();
  rrect(-0.28,-0.88,0.56,0.5,0.2);fillStroke(h.suit,LW);
  ctx.fillStyle=h.cape;ctx.fillRect(-0.27,-0.5,0.54,0.07);
  drawTail(h,t);
  const w=Math.sin(t*9)*0.08,f=-side*0.12;
  ctx.beginPath();ctx.moveTo(-0.22,-0.86);ctx.lineTo(0.22,-0.86);ctx.quadraticCurveTo(0.4+w+f,-0.45,0.44+w+f,-0.12);ctx.quadraticCurveTo(0.14+f,-0.02-w,f,-0.08);ctx.quadraticCurveTo(-0.14+f,-0.02+w,-0.44-w+f,-0.12);ctx.quadraticCurveTo(-0.4-w+f,-0.45,-0.22,-0.86);ctx.closePath();fillStroke(h.cape,LW);
  drawEmblem(h.emblem,0,-0.58,0.09,'rgba(255,255,255,0.85)');
  drawHeadBack(h,t,t*6);
  ctx.save();ctx.translate(side*0.26,-0.8);ctx.rotate(th);rrect(-0.075,0,0.15,0.4,0.07);fillStroke(lim,LW);circ(0,0.42,0.09);fillStroke(h.fur,LW);ctx.restore();
}
function flame(x,y,t,sz){sz=sz||1;ell(x,y+0.06*sz,0.08*sz,(0.13+0.04*Math.sin(t*40+x*9))*sz);ctx.fillStyle='#ffb020';ctx.fill();ell(x,y+0.03*sz,0.045*sz,0.07*sz);ctx.fillStyle='#fff6b0';ctx.fill();}
function drawVehicle(h,t){
  const c=h.vehCol;
  if(h.veh==='car'){
    flame(-0.32,-0.16,t);flame(0.32,-0.16,t);
    rrect(-0.74,-0.34,0.3,0.36,0.08);fillStroke('#222',LW);rrect(0.44,-0.34,0.3,0.36,0.08);fillStroke('#222',LW);
    ctx.save();ctx.translate(0,-0.36);ctx.scale(0.8,0.8);drawHeroBack(h,0,true,false,t);ctx.restore();
    rrect(-0.7,-0.74,1.4,0.5,0.17);fillStroke(c,LW);
    rrect(-0.62,-0.62,0.2,0.1,0.05);ctx.fillStyle='#ff3b5c';ctx.fill();rrect(0.42,-0.62,0.2,0.1,0.05);ctx.fill();
    rrect(-0.22,-0.48,0.44,0.16,0.04);ctx.fillStyle='#fff';ctx.fill();
    drawEmblem(h.emblem,0,-0.4,0.06,h.mask);
  }else if(h.veh==='scooter'){
    const g=0.5+0.5*Math.sin(t*8);
    ell(0,-0.1,0.55,0.1);ctx.fillStyle=hexA(h.net,0.25+0.25*g);ctx.fill();
    ell(0,-0.16,0.4,0.07);ctx.fillStyle=hexA(h.net,0.4);ctx.fill();
    ctx.save();ctx.translate(0,-0.3);ctx.scale(0.9,0.9);drawHeroBack(h,0,false,false,t);ctx.restore();
    ell(0,-0.27,0.62,0.13);fillStroke(c,LW);
    ell(0,-0.3,0.45,0.06);ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fill();
  }else if(h.veh==='rocket'){
    flame(0,-0.12,t,1.8);
    rrect(-0.2,-0.34,0.4,0.2,0.09);fillStroke('#e8e8f0',LW);
    ctx.save();ctx.translate(0,-0.38);ctx.scale(0.9,0.8);drawHeroBack(h,0,true,false,t);ctx.restore();
    rrect(-0.62,-0.42,1.24,0.14,0.07);fillStroke(c,LW);
    ctx.fillStyle='#ffd23f';ctx.fillRect(-0.5,-0.38,0.2,0.05);ctx.fillRect(0.3,-0.38,0.2,0.05);
  }else{
    for(const sg of[-1,1]){rrect(sg>0?0.46:-0.84,-0.66,0.38,0.66,0.13);fillStroke('#262233',LW);ctx.strokeStyle='#4a4560';ctx.lineWidth=0.04;ctx.beginPath();for(let i=1;i<5;i++){const y=-0.66+i*0.13;ctx.moveTo(sg>0?0.48:-0.82,y);ctx.lineTo(sg>0?0.82:-0.48,y);}ctx.stroke();}
    ctx.save();ctx.translate(0,-0.62);ctx.scale(0.75,0.75);drawHeroBack(h,0,true,false,t);ctx.restore();
    rrect(-0.7,-1.02,1.4,0.5,0.15);fillStroke(c,LW);
    rrect(-0.62,-0.9,0.2,0.1,0.05);ctx.fillStyle='#ff3b5c';ctx.fill();rrect(0.42,-0.9,0.2,0.1,0.05);ctx.fill();
    drawEmblem(h.emblem,0,-0.72,0.08,h.mask);
  }
}

/* ---------- Zeichnen: Bösewichte ---------- */
function drawGrummel(ph){
  const p=Math.sin(ph),l1=Math.max(0,p)*0.14,l2=Math.max(0,-p)*0.14;
  rrect(-0.19,-0.5,0.14,0.5-l1,0.05);fillStroke('#2b2440',LW);
  rrect(0.05,-0.5,0.14,0.5-l2,0.05);fillStroke('#2b2440',LW);
  ell(-0.13,-0.03-l1,0.12,0.06);fillStroke('#111',LW);ell(0.13,-0.03-l2,0.12,0.06);fillStroke('#111',LW);
  circ(0.42,-1.32,0.3);fillStroke('#c48a52',LW);
  drawStarShape(0.36,-1.6,0.12,'#ffd23f',0.03);drawStarShape(0.58,-1.54,0.09,'#ffd23f',0.03);

  }

  const t=types[Math.floor(Math.random()*types.length)];
  if(t==='crate'){const lanes=[-1,0,1].sort(()=>Math.random()-0.5).slice(0,Math.random()<0.2?2:1);for(const l of lanes)G.objs.push({kind:'obs',type:'crate',x:l*LANE_W,z});
    const free=[-1,0,1].find(l=>!lanes.includes(l));for(let i=0;i<3;i++)G.objs.push({kind:'star',x:free*LANE_W,y:0.6,z:z-1.5+i*1.5});}
  else{const lanes=Math.random()<0.2?[-1,0,1]:[ln()];for(const l of lanes)G.objs.push({kind:'obs',type:t,x:l*LANE_W,z});
    if(t==='hurdle'){const al=lanes[Math.floor(Math.random()*lanes.length)];for(let i=-2;i<=2;i++)G.objs.push({kind:'star',x:al*LANE_W,y:0.6+(1-(i*i)/4)*1.1,z:z+i*0.9});}}
}
function burst(x,y,zw,col,n){for(let i=0;i<n;i++)G.parts.push({x,y,z:zw,vx:rnd(-2.5,2.5),vy:rnd(1,4.5),vz:G.curSpd+rnd(-2,2),life:rnd(0.5,0.9),col:Math.random()<0.3?'#fff':col,size:rnd(0.05,0.1)});}
function sparkle(x,y,zw){for(let i=0;i<5;i++)G.parts.push({x,y,z:zw,vx:rnd(-1.5,1.5),vy:rnd(0.5,2.5),vz:G.curSpd,life:rnd(0.3,0.5),col:i%2?'#fff':'#ffd23f',size:0.05});}

function move(d){if(scene!=='play'||G.caughtT>0)return;const nl=clamp(G.lane+d,-1,1);if(nl!==G.lane){G.lane=nl;G.zip=0.32;G.zipSide=d;sfx.swing();}}
function jump(){if(scene!=='play'||G.caughtT>0)return;if(G.y<=0.01){G.vy=8.6;G.slideT=0;G.jumpT=0;sfx.jump();sfx.swing();}}
function slide(){if(scene!=='play'||G.caughtT>0)return;if(G.y>0.05)G.vy=-12;G.slideT=0.75;sfx.slide();}
function fireNet(){if(scene!=='play'||!G||G.netCD>0||G.caughtT>0)return;G.netCD=0.5;sfx.net();G.nets.push({x:G.x,y:G.y+0.9,z:0.4,t:0,rot:0});}
function netHit(){
  const v=G.vil;v.hits++;v.hitFlash=0.5;sfx.hit();burst(v.x,1,W0.pz+v.dist,hero.net,18);
  if(v.hits>=3){G.caughtT=0.0001;G.stars+=5;setTimeout(()=>sfx.fanfare(),250);say('Hab dich! Super gemacht!');
    for(const o of G.objs)if(o.kind==='obs'&&!o.dead){o.dead=true;burst(o.x,0.6,o.z,'#d9d2f0',6);}}
  else{say(v.hits===1?'Treffer!':'Noch einmal!');v.dist=Math.min(28,v.dist+(mode===2?2:2.5));v.switchT=Math.min(v.switchT,0.7);}
}

function updatePlay(dt){
  const v=G.vil;
  G.introT=Math.max(0,G.introT-dt);G.netCD=Math.max(0,G.netCD-dt);G.slideT=Math.max(0,G.slideT-dt);
  G.stumbleT=Math.max(0,G.stumbleT-dt);G.vehT=Math.max(0,G.vehT-dt);v.hitFlash=Math.max(0,v.hitFlash-dt);
  let spd=G.speedBase*(G.stumbleT>0?0.6:1)*(G.vehT>0?1.3:1);
  if(G.caughtT>0){G.caughtT+=dt;spd*=Math.max(0,1-G.caughtT/1.4);v.dist+=(4.2-v.dist)*Math.min(1,dt*1.5);v.ph+=dt*4;
    if(G.caughtT>2.3){scene='caught';bank();confettiBurst(120);}}
  G.curSpd=spd;W0.pz+=spd*dt;G.ph+=dt*spd*1.2;
  G.zip=Math.max(0,G.zip-dt);G.jumpT+=dt;
  {const sw=G.sw;sw.shoot=Math.min(1,sw.shoot+dt*9);
   if(W0.pz-sw.startZ>=sw.len){sw.side=-sw.side;sw.startZ=W0.pz;sw.len=rnd(7,9);sw.az=W0.pz+sw.len*0.6;sw.ax=sw.side*(EDGE-0.02);sw.ay=rnd(5,7.5);sw.shoot=0;if(G.vehT<=0&&G.stumbleT<=0&&G.caughtT===0&&G.zip<=0&&G.y<=0.05)sfx.swing(0.5);}
   const u=clamp((W0.pz-sw.startZ)/sw.len,0,1);G.swU=u;
   const tgt=G.slideT>0?0.08:G.stumbleT>0?0.02:0.22+0.55*(2*u-1)*(2*u-1);G.swOff+=(tgt-G.swOff)*Math.min(1,dt*10);}
  G.x+=(G.lane*LANE_W-G.x)*Math.min(1,dt*14);CAMX+=(G.x*0.5-CAMX)*Math.min(1,dt*6);
  if(G.y>0||G.vy>0){G.vy-=26*dt;G.y+=G.vy*dt;if(G.y<=0){G.y=0;G.vy=0;}}
  if(G.caughtT===0){
    let cr=mode===2?1.3:1.2;if(G.vehT>0)cr+=2.5;if(G.stumbleT>0)cr=-0.5;
    v.dist=clamp(v.dist-cr*dt,6.5,28);
    v.switchT-=dt;if(v.switchT<=0){let nl;do{nl=Math.floor(Math.random()*3)-1;}while(nl===v.lane);v.lane=nl;
      v.switchT=mode===2?rnd(3,6):Math.max(1.2,2.4-G.vi*0.3)+Math.random()*1.8;}
    v.x+=(v.lane*LANE_W-v.x)*Math.min(1,dt*4.5);v.ph+=dt*13;
    if(v.y<=0)for(const o of G.objs){if(o.kind!=='obs'||o.hit||o.dead)continue;const d=o.z-W0.pz-v.dist;if(d>0&&d<1.8&&Math.abs(o.x-v.x)<0.9){v.vy=7.5;break;}}
    v.dropT-=dt;if(v.dropT<=0){v.dropT=0.45;const zw=W0.pz+v.dist;if(!G.objs.some(o=>o.kind==='obs'&&Math.abs(o.z-zw)<1.6&&Math.abs(o.x-v.x)<0.9))G.objs.push({kind:'star',x:v.x,y:0.6,z:zw});}
    if(v.dist<=16&&!G.saidRange){G.saidRange=true;say('Jetzt Netz werfen!');}
  }
  if(v.y>0||v.vy>0){v.vy-=24*dt;v.y+=v.vy*dt;if(v.y<=0){v.y=0;v.vy=0;}}
  while(G.nextSpawn<W0.pz+ZMAX){spawnRow(G.nextSpawn);G.nextSpawn+=mode===2?rnd(9,15):rnd(12,18)-G.vi;}
  const sliding=G.slideT>0;
  for(const o of G.objs){
    if(o.dead)continue;const r=o.z-W0.pz;
    if(o.hit){o.kt+=dt;if(o.kt>0.8)o.dead=true;continue;}
    if(o.kind==='star'&&G.vehT>0&&r<10&&r>-0.5){const k=Math.min(1,dt*7);o.x+=(G.x-o.x)*k;o.y+=(G.y+0.75-o.y)*k;if(r>0)o.z-=r*Math.min(1,dt*4);}
    if(r<-0.8||r>0.8||Math.abs(o.x-G.x)>0.7)continue;
    if(o.kind==='star'){const cy=G.y+G.swOff+(sliding?0.35:0.75);if(Math.abs(o.y-cy)<1.0){o.dead=true;G.stars++;sfx.star();sparkle(o.x,o.y,o.z);}}
    else if(o.kind==='veh'){o.dead=true;G.vehT=7;sfx.veh();say('Turbo!');burst(G.x,0.8,W0.pz,hero.net,16);}
    else if(o.kind==='obs'&&G.caughtT===0){
      const hit=o.type==='hurdle'?G.y<0.6:o.type==='crate'?G.y<1.45:!sliding;
      if(hit){
        if(G.vehT>0){o.dead=true;burst(o.x,0.6,o.z,o.type==='crate'?'#d18b47':'#ff4b5c',12);sfx.smash();shake=0.15;}
        else if(G.stumbleT<=0){o.hit=true;o.kt=0;o.kdir=o.x>0.1?1:o.x<-0.1?-1:(Math.random()<0.5?-1:1);G.stumbleT=1.1;v.dist=Math.min(28,v.dist+3.5);shake=0.35;sfx.bump();say('Hoppla!');}
      }
    }
  }
  G.objs=G.objs.filter(o=>!o.dead&&o.z-W0.pz>-D+0.5);
  for(const n of G.nets){
    n.t+=dt;
    if(n.fall){n.ft+=dt;n.y=Math.max(0.05,n.y-dt*3);n.z-=dt*G.curSpd;continue;}
    n.z+=dt*30;n.rot+=dt*9;
    if(mode===2)n.x+=(v.x-n.x)*Math.min(1,dt*7);
    n.y+=((G.vi===2?1.35:0.95)-n.y)*Math.min(1,dt*4);
    if(!n.done&&n.z>=v.dist&&v.dist<=16.5&&G.caughtT===0){n.done=true;if(Math.abs(n.x-v.x)<0.8){n.dead=true;netHit();}}
    if(n.z>17.5){n.fall=true;n.ft=0;sfx.miss();}
  }
  G.nets=G.nets.filter(n=>!n.dead&&!(n.fall&&n.ft>0.6));
  for(const q of G.parts){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;q.vy-=10*dt;if(q.y<0){q.y=0;q.vy*=-0.4;}}
  G.parts=G.parts.filter(q=>q.life>0);
}

/* ---------- Welt-Objekte zeichnen ---------- */
function drawStarObj(y,ph){ctx.save();ctx.translate(0,-y);ctx.scale(Math.max(0.2,Math.abs(Math.cos(T*4+ph))),1);starPath(0,0,0.3,0.14,5);ctx.fillStyle='#ffd23f';ctx.fill();ctx.lineWidth=0.05;ctx.strokeStyle='#e08a00';ctx.lineJoin='round';ctx.stroke();ctx.restore();}
function drawObj(o,r){
  const fa=Math.min(1,(ZMAX-r)/10);ctx.globalAlpha=fa;
  if(o.kind==='star'){shadowAt(o.x,r,0.2);const p=P(o.x,0,r);ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.s,p.s);drawStarObj(o.y+Math.sin(T*4+o.z)*0.06,o.z);ctx.restore();}
  else if(o.kind==='veh'){shadowAt(o.x,r,0.4);const p=P(o.x,0,r);ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.s,p.s);ctx.translate(0,-0.95+Math.sin(T*3)*0.1);
    circ(0,0,0.62);ctx.fillStyle=hexA(hero.net,0.3+0.15*Math.sin(T*8));ctx.fill();
    circ(0,0,0.5);ctx.fillStyle='rgba(255,255,255,0.45)';ctx.fill();ctx.lineWidth=0.07;ctx.strokeStyle=hero.net;ctx.stroke();
    ctx.save();ctx.translate(0,0.36);ctx.scale(0.42,0.42);drawVehicle(hero,T);ctx.restore();
    ell(-0.2,-0.27,0.11,0.06);ctx.fillStyle='rgba(255,255,255,0.8)';ctx.fill();ctx.restore();}
  else{
    let kx=0,ky=0,rot=0,a=1;
    if(o.hit){const k=o.kt;kx=o.kdir*k*3;ky=k*2.5-k*k*4;rot=o.kdir*k*3;a=Math.max(0,1-k/0.8);}
    ctx.globalAlpha=fa*a;
    if(!o.hit)shadowAt(o.x,r,0.6);
    if(o.type==='crate'&&!o.hit){
      const x=o.x,A=P(x-0.5,1.5,r),B=P(x+0.5,1.5,r),C=P(x+0.5,1.5,r+1),Dd=P(x-0.5,1.5,r+1);
      if(Math.abs(x-CAMX)>0.3){const sx=x>CAMX?x-0.5:x+0.5,a0=P(sx,0,r),a1=P(sx,1.5,r),a2=P(sx,1.5,r+1),a3=P(sx,0,r+1);
        ctx.beginPath();ctx.moveTo(a0.x,a0.y);ctx.lineTo(a1.x,a1.y);ctx.lineTo(a2.x,a2.y);ctx.lineTo(a3.x,a3.y);ctx.closePath();ctx.fillStyle='#a5672f';ctx.fill();ctx.lineWidth=Math.max(1,A.s*0.04);ctx.strokeStyle=OL;ctx.stroke();}
      ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.lineTo(C.x,C.y);ctx.lineTo(Dd.x,Dd.y);ctx.closePath();ctx.fillStyle='#e8ac6c';ctx.fill();ctx.lineWidth=Math.max(1,A.s*0.04);ctx.strokeStyle=OL;ctx.stroke();
    }
    const p=P(o.x+kx,ky,r);ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.s,p.s);ctx.rotate(rot);
    if(o.type==='hurdle')drawHurdle();else if(o.type==='crate')drawCrate();else drawBanner();
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function drawVillainWorld(){
  const v=G.vil,r=v.dist;
  let by=v.y;if(G.vi===2)by+=0.55+Math.sin(T*3)*0.1;if(G.vi===1&&G.caughtT===0)by+=Math.abs(Math.sin(v.ph*0.5))*0.25;
  ctx.globalAlpha=Math.min(1,(ZMAX-r)/10);
  shadowAt(v.x,r,0.55);
  if(v.dist<=16&&G.caughtT===0){const g=P(v.x,0,r);ctx.globalAlpha=0.55+0.45*Math.sin(T*8);ell(g.x,g.y,0.75*g.s,0.22*g.s);ctx.lineWidth=Math.max(2,0.08*g.s);ctx.strokeStyle='#3ccf6e';ctx.stroke();ctx.globalAlpha=1;}
  const p=P(v.x,by,r);
  G.vilScr={x:p.x,y:p.y-p.s*1.0,r:Math.max(70,p.s*1.4)};
  ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.s,p.s);
  if(v.hitFlash>0)ctx.rotate(Math.sin(v.hitFlash*40)*0.12);
  drawVillain(G.vi,v.ph,v.hits,hero.net);
  ctx.restore();ctx.globalAlpha=1;
}
function drawNetProj(n){
  const p=P(n.x,n.y,n.z),rr=0.2+Math.min(1,n.t*5)*0.3;
  ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.s,p.s);ctx.rotate(n.rot);
  if(n.fall)ctx.globalAlpha=Math.max(0,1-n.ft/0.6);
  circ(0,0,rr);ctx.fillStyle=hexA(hero.net,0.25);ctx.fill();
  ctx.save();circ(0,0,rr);ctx.clip();ctx.beginPath();const st=rr/2.5;
  for(let d=-2*rr;d<=2*rr;d+=st){ctx.moveTo(d-rr,-rr);ctx.lineTo(d+rr,rr);ctx.moveTo(d+rr,-rr);ctx.lineTo(d-rr,rr);}
  ctx.lineWidth=0.035;ctx.strokeStyle=hero.net;ctx.stroke();ctx.restore();
  circ(0,0,rr);ctx.lineWidth=0.06;ctx.strokeStyle=hero.net;ctx.stroke();
  for(let i=0;i<4;i++){const a=i*Math.PI/2;circ(Math.cos(a)*rr,Math.sin(a)*rr,0.06);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=0.025;ctx.strokeStyle=OL;ctx.stroke();}
  ctx.restore();ctx.globalAlpha=1;
}
function drawPlayer(){
  const swinging=G.vehT<=0&&G.stumbleT<=0,off=G.vehT>0?0:G.swOff;
  shadowAt(G.x,0,0.45*(1-Math.min(0.6,(G.y+off)*0.3)));
  const p=P(G.x,G.y+off,0),s=p.s;G.heroX=p.x;
  let rot=(G.lane*LANE_W-G.x)*0.22;
  let A=null,shoot=1;
  if(swinging){
    if(G.zip>0){A=P(G.zipSide*(EDGE-0.02),4.8,3.2);shoot=Math.min(1,(0.32-G.zip)*10);}
    else if(G.y>0.05){A=P(G.x*0.4,8.5,6.5);shoot=Math.min(1,G.jumpT*10);}
    else{A=P(G.sw.ax,G.sw.ay,G.sw.az-W0.pz);shoot=G.sw.shoot;}
  }
  let th=Math.PI,side=1,hx=0,hy=0;
  if(A){
    side=A.x>=p.x?1:-1;const u=G.swU;rot+=side*0.12*(1-(2*u-1)*(2*u-1));
    const dx=A.x-p.x,dy=A.y-p.y,c=Math.cos(rot),sn=Math.sin(rot);
    const lx=(dx*c+dy*sn)/s,ly=(-dx*sn+dy*c)/s,rx=lx-side*0.26,ry=ly+0.8,rl=Math.hypot(rx,ry)||1;
    th=Math.atan2(-rx,ry);
    const hlx=side*0.26+rx/rl*0.42,hly=-0.8+ry/rl*0.42;
    hx=p.x+(hlx*c-hly*sn)*s;hy=p.y+(hlx*sn+hly*c)*s;
  }
  ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);ctx.rotate(rot);
  if(G.stumbleT>0){ctx.rotate(Math.sin(G.stumbleT*22)*0.18);if(Math.floor(T*12)%2===0)ctx.globalAlpha=0.55;}
  if(G.vehT>0){if(G.vehT<1.6&&Math.floor(T*10)%2)ctx.globalAlpha=0.6;drawVehicle(hero,T);}
  else if(!A)drawHeroBack(hero,G.ph,G.y>0.05,false,T);
  else{if(G.slideT>0)ctx.scale(1.1,0.75);drawHeroSwing(hero,T,th,side,Math.sin(T*5)*0.15-side*0.15,G.y>0.05);}
  ctx.globalAlpha=1;
  if(G.stumbleT>0)for(let i=0;i<3;i++){const a=T*6+i*2.09;drawStarShape(Math.cos(a)*0.35,-1.72+Math.sin(a)*0.1,0.09,'#ffd23f',0.02);}
  ctx.restore();
  if(A){
    const ex=hx+(A.x-hx)*shoot,ey=hy+(A.y-hy)*shoot;
    ctx.lineCap='round';ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(ex,ey);
    ctx.strokeStyle=hexA(hero.net,0.6);ctx.lineWidth=Math.max(4,s*0.08);ctx.stroke();
    ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(2,s*0.03);ctx.stroke();
    if(shoot>=1&&A.y>-50&&A.y<H+50){const r=Math.max(6,0.32*A.s);ctx.save();ctx.translate(A.x,A.y);
      circ(0,0,r);ctx.fillStyle=hexA(hero.net,0.45);ctx.fill();ctx.save();circ(0,0,r);ctx.clip();ctx.beginPath();
      for(let d=-2*r;d<=2*r;d+=r/2){ctx.moveTo(d-r,-r);ctx.lineTo(d+r,r);ctx.moveTo(d+r,-r);ctx.lineTo(d-r,r);}ctx.lineWidth=Math.max(1,r*0.1);ctx.strokeStyle='#fff';ctx.stroke();ctx.restore();
      circ(0,0,r);ctx.lineWidth=Math.max(1.5,r*0.14);ctx.strokeStyle='#fff';ctx.stroke();ctx.restore();}
  }
}
function drawParts(){for(const q of G.parts){const r=q.z-W0.pz;if(r<-D+0.5)continue;const p=P(q.x,q.y,r);ctx.globalAlpha=Math.min(1,q.life*2);circ(p.x,p.y,Math.max(1.5,q.size*p.s));ctx.fillStyle=q.col;ctx.fill();}ctx.globalAlpha=1;}

function renderWorld(withGame){
  drawSky();
  ctx.fillStyle='#c9c1e0';ctx.fillRect(0,HOR,W,H-HOR);
  drawRoad(W0.pz);
  const g=ctx.createLinearGradient(0,HOR,0,HOR+H*0.1);g.addColorStop(0,'rgba(214,236,255,0.9)');g.addColorStop(1,'rgba(214,236,255,0)');ctx.fillStyle=g;ctx.fillRect(0,HOR,W,H*0.1);
  drawBuildings(W0.bl,-1,W0.pz);drawBuildings(W0.br,1,W0.pz);
  const items=[],pz=W0.pz;
  for(let zw=Math.ceil((pz-D+1)/12)*12;zw<pz+ZMAX;zw+=12){const r=zw-pz;items.push([r,()=>drawLamp(-1,r)],[r,()=>drawLamp(1,r)]);const r2=r+6;if(r2<ZMAX&&r2>-D+1)items.push([r2,()=>drawTree(-1,r2)],[r2,()=>drawTree(1,r2)]);}
  if(withGame&&G&&G.objs){
    for(const o of G.objs){const r=o.z-pz;if(r<-D+0.8||r>ZMAX)continue;items.push([r,()=>drawObj(o,r)]);}
    items.push([G.vil.dist,drawVillainWorld]);
    for(const n of G.nets)items.push([n.z,()=>drawNetProj(n)]);
    items.push([0,drawPlayer]);
  }
  items.sort((a,b)=>b[0]-a[0]);
  for(const it of items)it[1]();
  if(withGame&&G&&G.parts)drawParts();
}

function initAudio(){

      musicGain=AC.createGain();musicGain.gain.value=0.2;musicGain.connect(master);

      NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}

}

function toggleMute(){muted=!muted;try{localStorage.setItem('netzjagd_mute',muted?'1':'0');}catch(e){}if(master)master.gain.value=muted?0:1;if(muted)try{speechSynthesis.cancel();}catch(e){}}
function osc(f,t,dur,type,vol,dest,slide){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+0.03);}
function tone(f,dur,type,vol,when,slide){if(!AC)return;osc(f,AC.currentTime+(when||0),dur,type,vol,sfxGain,slide);}
function noiseAt(t,dur,vol,freq,ftype,dest){const s=AC.createBufferSource();s.buffer=NB;const fl=AC.createBiquadFilter();fl.type=ftype;fl.frequency.value=freq;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(dest);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02);}
function noiseS(dur,vol,freq,ftype){if(!AC)return;noiseAt(AC.currentTime,dur,vol,freq,ftype,sfxGain);}
const sfx={
  tap(){tone(660,0.08,'triangle',0.25);},
  swing(v){v=v||1;noiseS(0.16,0.22*v,3200,'highpass');tone(1300,0.12,'sine',0.07*v,0,650);},
  star(){tone(1320,0.1,'triangle',0.16);tone(1760,0.14,'triangle',0.12,0.05);},
  move(){tone(480,0.08,'sine',0.12,0,760);},
  jump(){tone(320,0.22,'sine',0.25,0,760);},
  slide(){noiseS(0.25,0.22,1200,'bandpass');},
  net(){noiseS(0.22,0.3,2600,'highpass');tone(950,0.18,'square',0.05,0,320);},
  hit(){[523,659,784].forEach((f,i)=>tone(f,0.16,'triangle',0.22,i*0.07));},
  miss(){tone(420,0.25,'sine',0.12,0,210);},
  bump(){tone(170,0.3,'sawtooth',0.18,0,60);noiseS(0.2,0.25,400,'lowpass');},
  smash(){noiseS(0.3,0.35,800,'lowpass');tone(220,0.15,'square',0.08,0,80);},
  veh(){tone(180,0.6,'sawtooth',0.1,0,520);tone(660,0.12,'square',0.08,0.5);tone(880,0.2,'square',0.08,0.64);},
  fanfare(){[523,659,784,1047].forEach((f,i)=>{tone(f,i===3?0.55:0.15,'square',0.09,i*0.12);tone(f/2,i===3?0.55:0.15,'triangle',0.2,i*0.12);});}
};
const STEP=60/138/2;
const BASS=[48,0,55,0,48,0,55,0, 53,0,60,0,53,0,60,0, 55,0,62,0,55,0,62,0, 48,0,55,0,52,0,55,0];
const MEL1=[72,0,76,0,79,0,76,79, 81,0,79,0,76,0,72,0, 74,0,77,0,81,0,79,77, 76,0,74,0,72,0,0,0];
const MEL2=[72,74,76,77,79,0,79,0, 81,79,77,76,74,0,74,0, 76,77,79,81,84,0,81,79, 77,0,76,0,72,0,0,0];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function playStep(i,t){
  const b=BASS[i%32];if(b)osc(mtof(b),t,STEP*0.9,'triangle',0.32,musicGain);
  const m=(i<32?MEL1:MEL2)[i%32];if(m)osc(mtof(m),t,STEP*0.85,'square',0.07,musicGain);
  if(i%2===0)noiseAt(t,0.04,0.06,7000,'highpass',musicGain);
  if(i%8===4)noiseAt(t,0.12,0.12,1800,'bandpass',musicGain);
  if(i%8===0)osc(130,t,0.14,'sine',0.35,musicGain,45);
}
function startMusic(){if(!AC||musicTimer)return;nextNoteT=AC.currentTime+0.1;musicTimer=setInterval(()=>{if(!AC||AC.state!=='running')return;while(nextNoteT<AC.currentTime+0.25){playStep(stepI,nextNoteT);nextNoteT+=STEP;stepI=(stepI+1)%64;}if(nextNoteT<AC.currentTime)nextNoteT=AC.currentTime+0.05;},50);}

/* ---------- Eingabe ---------- */
const ptrs=new Map();
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();startMusic();
  const p={sx:e.clientX,sy:e.clientY,used:false};
  for(let i=UI.length-1;i>=0;i--){const b=UI[i];const hit=b.r!==undefined?Math.hypot(e.clientX-b.x,e.clientY-b.y)<=b.r:(e.clientX>=b.x&&e.clientX<=b.x+b.w&&e.clientY>=b.y&&e.clientY<=b.y+b.h);if(hit){p.used=true;b.fn();break;}}
  ptrs.set(e.pointerId,p);
},{passive:false});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p||p.used||scene!=='play')return;
  const dx=e.clientX-p.sx,dy=e.clientY-p.sy;
  if(Math.hypot(dx,dy)>Math.max(22,U*3.2)){p.used=true;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)jump();else slide();}
});
function endPtr(e){
  const p=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);if(!p||p.used||scene!=='play')return;
  const x=e.clientX,y=e.clientY;
  if(G.vilScr&&Math.hypot(x-G.vilScr.x,y-G.vilScr.y)<G.vilScr.r)fireNet();
  else move(x<G.heroX?-1:1);
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',e=>ptrs.delete(e.pointerId));
document.addEventListener('touchend',()=>{initAudio();primeSpeech();startMusic();},{passive:true});
document.addEventListener('click',()=>{initAudio();primeSpeech();startMusic();});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  initAudio();startMusic();if(scene!=='play')return;
  if(e.key==='ArrowLeft')move(-1);else if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowUp')jump();else if(e.key==='ArrowDown')slide();else if(e.key===' '){fireNet();e.preventDefault();}
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(scene==='play'&&G&&G.caughtT===0)scene='pause';try{AC&&AC.suspend();speechSynthesis.cancel();}catch(e){}}
  else{try{AC&&AC.resume();}catch(e){}}
});

/* ---------- Hauptschleife ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;T+=dt;DT=dt;UI=[];
  if(scene==='play')updatePlay(dt);
  else if(scene==='title'||scene==='select'){W0.pz+=7*dt;CAMX=Math.sin(T*0.3)*0.6;}
  genSide(W0.bl,W0.pz+ZMAX+12);genSide(W0.br,W0.pz+ZMAX+12);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  let sx=0,sy=0;if(shake>0){shake=Math.max(0,shake-dt);sx=(Math.random()-0.5)*shake*40;sy=(Math.random()-0.5)*shake*40;}
  ctx.save();ctx.translate(sx,sy);
  renderWorld(scene==='play'||scene==='pause'||scene==='caught');
  ctx.restore();
  if(scene==='title')drawTitle();
  else if(scene==='select')drawSelect();
  else if(scene==='play')drawHUD();
  else if(scene==='pause'){drawHUD();UI=[];drawPause();}
  else if(scene==='caught')drawCaught();
  else if(scene==='win')drawWin();
  drawConfetti(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
