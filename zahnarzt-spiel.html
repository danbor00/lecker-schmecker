<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blitzeblank">
<meta name="theme-color" content="#bdeffc">
<title>Zahnarzt-Praxis Blitzeblank</title>
<style>
:root{--ink:#3a3355;--accent:#ff6f91}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{font-family:"Chalkboard SE","Comic Sans MS","Avenir Next Rounded","Avenir Next",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 15% 8%,rgba(255,255,255,.9) 0,transparent 35%),radial-gradient(circle at 90% 20%,rgba(255,255,255,.6) 0,transparent 25%),linear-gradient(180deg,#bdeffc 0%,#dcf8ff 55%,#c8f7dc 100%)}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.screen{position:fixed;inset:0}
.hidden{display:none!important}

/* ---------- Menü ---------- */
#menu{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);text-align:center;overflow:auto}
#menu h1{margin:0;font-size:clamp(32px,6vw,62px);line-height:1.05;color:#2f6fb3;text-shadow:0 4px 0 #fff}
#menu h1 span{color:var(--accent)}
#menu .sub{font-size:clamp(20px,3vw,30px);margin:0;font-weight:700}
#patients{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;max-width:960px}
.pcard{width:clamp(120px,20vw,190px);background:#fff;border-radius:30px;padding:10px 8px 12px;box-shadow:0 8px 0 #9fd3ea,0 12px 24px rgba(0,0,0,.08);transition:transform .15s}
.pcard:active{transform:translateY(6px) scale(.97);box-shadow:0 2px 0 #9fd3ea}
.pcard svg{width:100%;height:auto;display:block}
.pcard b{display:block;font-size:clamp(17px,2.3vw,23px);margin-top:2px}
.pcard small{display:block;min-height:1.3em;font-size:15px}
#starsTotal{font-size:clamp(20px,3vw,28px);background:#fff;padding:8px 22px;border-radius:999px;box-shadow:0 5px 0 #ffd54f;font-weight:700}

/* ---------- Spiel ---------- */
#game{display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 14px) 4px calc(env(safe-area-inset-left) + 14px)}
.round{width:58px;height:58px;border-radius:50%;background:#fff;font-size:28px;box-shadow:0 5px 0 #9fd3ea;display:inline-flex;align-items:center;justify-content:center;margin-left:6px}
.round:active{transform:translateY(4px);box-shadow:0 1px 0 #9fd3ea}
#progress{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;background:rgba(255,255,255,.8);padding:6px 14px;border-radius:999px;font-size:clamp(22px,3.4vw,32px)}
#progress span{opacity:.28;filter:grayscale(1);transition:.4s;display:inline-block}
#progress span.done{opacity:1;filter:none;transform:scale(1.15)}
#main{flex:1;display:flex;flex-direction:column;min-height:0}
#stage{flex:1;position:relative;min-height:0;min-width:0}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#bubble{position:absolute;top:4px;left:50%;transform:translateX(-50%);max-width:min(92%,640px);width:max-content;background:#fff;border-radius:26px;padding:10px 22px;font-size:clamp(18px,2.6vw,26px);font-weight:700;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.08);pointer-events:none;transition:opacity .3s,transform .3s;z-index:5}
#bubble.off{opacity:0;transform:translateX(-50%) translateY(-10px)}
#tray{display:flex;justify-content:center;align-items:stretch;gap:10px;padding:10px calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 10px);background:rgba(255,255,255,.55);border-radius:30px 30px 0 0}
.tool{flex:0 1 112px;height:118px;background:#fff;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 0 #b7d9e8;transition:transform .12s,box-shadow .12s,background .12s;padding:6px 4px;min-width:0}
.tool svg{height:64%;width:auto;max-width:92%;pointer-events:none}
.tool span{font-size:clamp(12px,1.8vw,15px);font-weight:700;white-space:nowrap;pointer-events:none}
.tool.sel{background:#fff6c7;box-shadow:0 0 0 5px #ffca28,0 6px 0 #e0a800;transform:translateY(-6px) scale(1.04)}
.tool.hint{animation:hintb .4s ease-in-out infinite alternate}
@keyframes hintb{from{transform:translateY(0) scale(1)}to{transform:translateY(-12px) scale(1.12);box-shadow:0 0 0 8px #ff6f91,0 6px 0 #b7d9e8}}
@media (orientation:landscape){
  #main{flex-direction:row}
  #tray{flex-direction:column;justify-content:center;padding:8px calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 8px) 8px;border-radius:30px 0 0 30px;gap:9px}
  .tool{flex:1 1 0;width:118px;max-height:116px;min-height:0;height:auto}
  .tool.sel{transform:translateX(-8px) scale(1.04)}
}

/* Werkzeug am Finger */
#cursor{position:fixed;left:0;top:0;width:140px;height:140px;pointer-events:none;z-index:40;display:none;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25))}
#cursor.on{display:block}
#cursor svg{width:100%;height:100%}
#cursor.buzz svg{animation:buzz .05s linear infinite}
@keyframes buzz{0%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}100%{transform:translate(-2px,1px)}}

/* SVG-Zähne */
.tooth .enamel{stroke:#cfd6de;stroke-width:3}
.tooth .stains circle{fill:#9c7b64}
.tooth .foam circle{fill:#fff;stroke:#b3e5fc;stroke-width:2.5}
.tooth .twinkle{display:none;transform-box:fill-box;transform-origin:center}
.tooth.clean .twinkle{display:inline;animation:twinkle 1.1s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.4) rotate(0);opacity:.4}50%{transform:scale(1.15) rotate(45deg);opacity:1}}
.tooth.loose .inner{animation:wiggle .7s ease-in-out infinite}
.tooth.pulling .inner{animation:wiggle .14s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.tooth.gone .inner{display:none}
.tooth.grow .inner{animation:grow .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes grow{from{transform:scale(.05)}to{transform:scale(1)}}
.tooth.shake .inner{animation:shake .07s linear infinite}
@keyframes shake{0%{transform:translate(-2px,0)}50%{transform:translate(2px,1px)}100%{transform:translate(-2px,0)}}
.gb{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-4px) rotate(6deg)}}
.glow{fill:none;stroke:#ffeb3b;stroke-width:12;animation:glow .5s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.25}to{opacity:1}}
#face.cheer{animation:cheer .55s ease-in-out 4}
@keyframes cheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}

/* Gewonnen */
.overlay{position:fixed;inset:0;background:rgba(40,30,80,.35);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.card{background:#fff;border-radius:40px;padding:26px 36px;text-align:center;box-shadow:0 12px 0 #ffd54f;animation:popin .5s cubic-bezier(.3,1.6,.5,1);max-width:560px}
@keyframes popin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.card .big{font-size:110px;line-height:1;display:inline-block;animation:spin 1.6s ease-in-out infinite}
@keyframes spin{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(12deg) scale(1.12)}}
.card h2{font-size:clamp(32px,5vw,46px);margin:6px 0;color:#2f6fb3}
.card p{font-size:clamp(19px,2.6vw,24px);margin:0 0 18px}
.btn{font-size:clamp(22px,3vw,28px);font-weight:700;padding:14px 28px;border-radius:999px;background:var(--accent);color:#fff;box-shadow:0 6px 0 #d94f74;margin:6px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d94f74}
.btn.alt{background:#4fc3f7;box-shadow:0 6px 0 #2a9bd0}
.conf{position:fixed;top:-24px;width:13px;height:19px;border-radius:3px;animation:fall linear forwards;z-index:70;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}
</style>
</head>
<body>

<div id="menu" class="screen">
  <h1>🦷 Zahnarzt-Praxis<br><span>Blitzeblank</span> ✨</h1>
  <p class="sub">Welches Tier kommt heute zu dir?</p>
  <div id="patients"></div>
  <div id="starsTotal">⭐ 0</div>
</div>

<div id="game" class="screen hidden">
  <div id="topbar">
    <button id="homeBtn" class="round" aria-label="Menü">🏠</button>
    <div id="progress"></div>
    <div style="display:flex">
      <button id="helpBtn" class="round" aria-label="Hilfe">💡</button>
      <button id="soundBtn" class="round" aria-label="Ton">🔊</button>
    </div>
  </div>
  <div id="main">
    <div id="stage">
      <svg id="scene" viewBox="0 -40 1000 920" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="bubble" class="off"></div>
    </div>
    <div id="tray"></div>
  </div>
</div>

<div id="win" class="overlay hidden">
  <div class="card">
    <div class="big">⭐</div>
    <h2>Super gemacht!</h2>
    <p id="winText"></p>
    <button id="nextBtn" class="btn">Nächstes Tier ▶</button>
    <button id="menuBtn" class="btn alt">🏠</button>
  </div>
</div>

<div id="cursor"></div>

<script>
"use strict";
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function mix(c1,c2,t){const a=parseInt(c1.slice(1),16),b=parseInt(c2.slice(1),16);
  const ch=s=>Math.round(((a>>s)&255)*(1-t)+((b>>s)&255)*t);
  return '#'+((1<<24)|(ch(16)<<16)|(ch(8)<<8)|ch(0)).toString(16).slice(1);}

/* ---------- Speicher ---------- */
let mem={total:0,per:{}};
try{const s=localStorage.getItem('blitzeblank');if(s)mem=JSON.parse(s);}catch(e){}
function save(){try{localStorage.setItem('blitzeblank',JSON.stringify(mem));}catch(e){}}

/* ---------- Ton ---------- */
let soundOn=true, AC=null, noiseBuf=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function env(g,t0,a,d,v){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d);}
function tone(f,d=.15,type='sine',v=.2,f2=null,delay=0){
  if(!soundOn)return;const a=ac();if(!a)return;
  const t0=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  env(g,t0,.01,d,v);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.05);
}
function noise(d=.1,f=2500,q=1.2,v=.15){
  if(!soundOn)return;const a=ac();if(!a)return;
  if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate,a.sampleRate);const c=noiseBuf.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;}
  const s=a.createBufferSource();s.buffer=noiseBuf;const fl=a.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;
  const g=a.createGain(),t0=a.currentTime;env(g,t0,.02,d,v);
  s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(t0,Math.random()*.5);s.stop(t0+d+.05);
}
let lastBrush=0,lastWater=0;
const sfx={
  click(){tone(660,.06,'triangle',.12);},
  brush(){const n=performance.now();if(n-lastBrush<110)return;lastBrush=n;noise(.09,rand(3200,4800),1.6,.14);},
  water(){const n=performance.now();if(n-lastWater<90)return;lastWater=n;noise(.14,rand(900,1500),.7,.12);},
  pop(){tone(500,.12,'sine',.25,1150);},
  squeak(){tone(1300,.09,'sine',.14,2100);},
  ding(){tone(1046,.25,'triangle',.18);tone(1568,.35,'triangle',.15,null,.09);},
  plop(){tone(900,.2,'sine',.3,180);},
  fanfare(){[523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.2,null,i*.13));[523,659,784].forEach(f=>tone(f*2,.6,'triangle',.1,null,.56));}
};
let drillNodes=null;
function drillOn(on,target){
  if(on&&soundOn){
    const a=ac();if(!a)return;
    if(!drillNodes){
      const o=a.createOscillator();o.type='sawtooth';o.frequency.value=180;
      const lfo=a.createOscillator();lfo.frequency.value=28;const lg=a.createGain();lg.gain.value=25;lfo.connect(lg);lg.connect(o.frequency);
      const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;
      const g=a.createGain();g.gain.value=0;o.connect(f);f.connect(g);g.connect(a.destination);
      o.start();lfo.start();g.gain.setTargetAtTime(.06,a.currentTime,.03);drillNodes={o,lfo,g};
    }
    drillNodes.o.frequency.setTargetAtTime(target?270:180,AC.currentTime,.05);
  }else if(drillNodes){
    const {o,lfo,g}=drillNodes,t=AC.currentTime;g.gain.setTargetAtTime(0,t,.03);o.stop(t+.25);lfo.stop(t+.25);drillNodes=null;
  }
}

/* ---------- Sprache ---------- */
let deVoice=null;
function loadVoices(){const vs=speechSynthesis.getVoices();
  deVoice=vs.find(v=>/^de/i.test(v.lang)&&/Anna|Petra|Helena|Marlene|Vicki|Katja/i.test(v.name))||vs.find(v=>/^de/i.test(v.lang))||null;}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
let bubbleTimer=null;
function say(text){
  const b=$('#bubble');b.textContent=text;b.classList.remove('off');
  clearTimeout(bubbleTimer);bubbleTimer=setTimeout(()=>b.classList.add('off'),4200);
  if(!soundOn||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';if(deVoice)u.voice=deVoice;u.rate=1;u.pitch=1.3;speechSynthesis.speak(u);}catch(e){}
}

/* ---------- Werkzeuge ---------- */
const TOOLS=[
  {id:'brush',label:'Zahnbürste',tip:[24,30]},
  {id:'water',label:'Wasser',tip:[20,20]},
  {id:'drill',label:'Bohrer',tip:[18,18]},
  {id:'fill',label:'Füllung',tip:[23,23]},
  {id:'pliers',label:'Zange',tip:[18,18]},
  {id:'newtooth',label:'Neuer Zahn',tip:[50,50]},
];
const ICON={
brush:`<g transform="rotate(-45 50 50)">
  <rect x="43" y="34" width="14" height="64" rx="7" fill="#29b6f6"/>
  <rect x="47" y="44" width="6" height="40" rx="3" fill="#81d4fa"/>
  <rect x="42" y="4" width="16" height="36" rx="7" fill="#29b6f6"/>
  <rect x="26" y="6" width="18" height="28" rx="4" fill="#fff" stroke="#b0bec5" stroke-width="2"/>
  <path d="M31 9v22M35.5 9v22M40 9v22" stroke="#cfd8dc" stroke-width="2"/>
  <path d="M24 10 q-6 6 0 12 q-6 6 0 10" stroke="#80cbc4" stroke-width="5" fill="none" stroke-linecap="round"/>
</g>`,
water:`<g transform="rotate(-45 50 50)">
  <path d="M50 1 C43 10 43 15 50 17 C57 15 57 10 50 1Z" fill="#29b6f6"/>
  <rect x="47" y="15" width="6" height="19" rx="3" fill="#90a4ae"/>
  <rect x="37" y="31" width="26" height="47" rx="9" fill="#e1f5fe" stroke="#4fc3f7" stroke-width="3"/>
  <rect x="41" y="47" width="18" height="28" rx="5" fill="#4fc3f7"/>
  <rect x="31" y="76" width="38" height="7" rx="3.5" fill="#78909c"/>
  <rect x="46" y="81" width="8" height="12" fill="#78909c"/>
  <rect x="37" y="91" width="26" height="8" rx="4" fill="#78909c"/>
</g>`,
drill:`<g transform="rotate(-45 50 50)">
  <circle cx="50" cy="6" r="5" fill="#ffd54f"/>
  <rect x="48" y="8" width="4" height="16" fill="#607d8b"/>
  <rect x="41" y="20" width="18" height="16" rx="5" fill="#90a4ae"/>
  <rect x="39" y="32" width="22" height="64" rx="11" fill="#ff8a65"/>
  <rect x="44" y="46" width="12" height="4" rx="2" fill="#fff" opacity=".75"/>
  <rect x="44" y="56" width="12" height="4" rx="2" fill="#fff" opacity=".75"/>
  <rect x="44" y="66" width="12" height="4" rx="2" fill="#fff" opacity=".75"/>
</g>`,
fill:`<g transform="rotate(-45 50 50)">
  <rect x="45" y="30" width="10" height="68" rx="5" fill="#ba68c8"/>
  <rect x="47.5" y="18" width="5" height="16" fill="#90a4ae"/>
  <ellipse cx="50" cy="13" rx="14" ry="11" fill="#fff" stroke="#b0bec5" stroke-width="2.5"/>
  <path d="M43 10 q4 -4 9 -2" stroke="#e0e0e0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</g>
<path d="M82 14 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#ffd54f"/>`,
pliers:`<g transform="rotate(-45 50 50)">
  <path d="M46 5 Q39 30 46 56" stroke="#90a4ae" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M54 5 Q61 30 54 56" stroke="#90a4ae" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M47 60 L36 95" stroke="#ef5350" stroke-width="12" stroke-linecap="round"/>
  <path d="M53 60 L64 95" stroke="#ef5350" stroke-width="12" stroke-linecap="round"/>
  <circle cx="50" cy="57" r="7.5" fill="#607d8b"/>
</g>`,
newtooth:`<path d="M27 24 Q27 9 40 11 Q50 15 60 11 Q73 9 73 24 Q73 42 67 54 L63 84 Q60 94 56 84 L52 64 Q50 57 48 64 L44 84 Q40 94 37 84 L33 54 Q27 42 27 24Z" fill="#fff" stroke="#b0bec5" stroke-width="3"/>
  <path d="M37 22 Q35 32 38 41" stroke="#bbdefb" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M83 8 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#ffd54f"/>
  <path d="M15 62 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#ffd54f"/>`
};
const TOOLNAME={brush:'Die Zahnbürste!',water:'Das Wasser!',drill:'Der Bohrer!',fill:'Die Füllung!',pliers:'Die Zange!',newtooth:'Ein neuer Zahn!'};
const HINT={
  brush:'Nimm die Zahnbürste und putz die Bakterien weg!',
  water:'Spül den Schaum mit Wasser weg!',
  drill:'Da ist ein Loch im Zahn! Nimm den Bohrer.',
  fill:'Mach das Loch mit der Füllung zu!',
  pliers:'Der Zahn wackelt. Zieh ihn mit der Zange raus!',
  newtooth:'Setz einen neuen Zahn ein!'
};

/* ---------- Tiere ---------- */
const PATIENTS=[
  {id:'baer',name:'Bruno',art:'der Bär',skin:'#b9835a',light:'#ecc9a3',dark:'#7a4e33',lip:'#6d3a26',brow:'#5d3a22'},
  {id:'hase',name:'Hoppel',art:'der Hase',skin:'#e9e4df',light:'#ffffff',dark:'#bfb3aa',lip:'#c25b7a',brow:'#8f8178',inner:'#ffb6c8'},
  {id:'katze',name:'Mimi',art:'die Katze',skin:'#ffb35c',light:'#ffe6c7',dark:'#e0812a',lip:'#a9472e',brow:'#a85414',inner:'#ffb6c8'},
  {id:'hund',name:'Bello',art:'der Hund',skin:'#e3b783',light:'#fff4e3',dark:'#8d5f45',lip:'#7d3a2a',brow:'#6d4632'},
  {id:'loewe',name:'Leo',art:'der Löwe',skin:'#f7c55e',light:'#fde9b8',dark:'#c46f22',lip:'#8a4a1c',brow:'#9c5a1c'},
  {id:'kroko',name:'Kroki',art:'das Krokodil',skin:'#6dbb5a',light:'#b4e29a',dark:'#3f8a33',lip:'#2f6b28',brow:'#2f6b28'},
  {id:'nilpferd',name:'Nilsi',art:'das Nilpferd',skin:'#a99cc4',light:'#d4c9ea',dark:'#6f5f92',lip:'#5c4a80',brow:'#4e3f70'},
  {id:'monster',name:'Momo',art:'das Monster',skin:'#9c7be0',light:'#c9b8f7',dark:'#5f40b0',lip:'#4b2a99',brow:'#3f2585'},
];
const whiskers=c=>`<g stroke="${c}" stroke-width="7" stroke-linecap="round" opacity=".8"><path d="M300 400 L120 370"/><path d="M300 425 L110 440"/><path d="M700 400 L880 370"/><path d="M700 425 L890 440"/></g>`;
function headArt(p){
  const S=p.skin,L=p.light,D=p.dark;let back='',extra='',nose='',front='';

/* ---------- Zähne ---------- */
const MCX=500,MCY=610,MRX=300,MRY=180;
const GP=[[-14,-16],[14,2],[-8,20]];
const BODY={
  up:'M-37 -20 L37 -20 L36 78 Q35 105 12 105 Q0 97 -12 105 Q-35 105 -36 78Z',
  down:'M-37 20 L37 20 L36 -78 Q35 -105 12 -105 Q0 -97 -12 -105 Q-35 -105 -36 -78Z'};
const SHINE={up:'M-22 40 Q-25 64 -20 88',down:'M-22 -40 Q-25 -64 -20 -88'};
let teeth=[];
function buildTeeth(){
  teeth=[];
  ['up','down'].forEach(row=>{
    [-200,-120,-40,40,120,200].forEach(dx=>{
      const r=dx/MRX,e=MRY*Math.sqrt(1-r*r),x=MCX+dx,y=row==='up'?MCY-e:MCY+e;
      const a=row==='up'?r*26:-r*26,c=row==='up'?70:-70,rad=a*Math.PI/180;
      teeth.push({row,x,y,a,c,cx:x-c*Math.sin(rad),cy:y+c*Math.cos(rad),problem:null});
    });
  });
}
function assignProblems(){
  const n=Math.min(4+Math.floor((mem.total||0)/2),8);
  const idx=shuffle([...Array(12).keys()]).slice(0,n);
  let loose=false;
  idx.forEach((ti,k)=>{
    const t=teeth[ti];let type;
    if(k===0)type='dirty';else if(k===1)type='cavity';
    else if(k===2&&Math.random()<.65)type='loose';
    else{const pool=['dirty','dirty','cavity'];if(!loose)pool.push('loose');type=pick(pool);}
    if(type==='loose')loose=true;
    t.problem=type;
    if(type==='dirty'){t.germs=100;t.foam=0;}
    if(type==='cavity'){t.cav='hole';t.drill=0;}
    if(type==='loose'){t.lz='loose';t.pull=0;}
  });
}
function germArt(col){
  return `<circle r="14" fill="${col}"/><circle cx="-13" cy="-8" r="5" fill="${col}"/><circle cx="12" cy="-10" r="5" fill="${col}"/><circle cx="0" cy="-15" r="5" fill="${col}"/>
   <circle cx="-5" cy="-3" r="4.6" fill="#fff"/><circle cx="5" cy="-3" r="4.6" fill="#fff"/><circle cx="-4.4" cy="-2.4" r="2.3" fill="#222"/><circle cx="5.6" cy="-2.4" r="2.3" fill="#222"/>
   <path d="M-5 5 Q0 10 5 5" stroke="#222" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
}
function toothSVG(t,i){
  const cols=['#8bc34a','#ab47bc','#ffa726','#26c6da','#ef5350'];
  const germs=GP.map(([gx,gy])=>`<g class="germ" transform="translate(${gx},${gy})"><g class="gb" style="animation-delay:${(-Math.random()).toFixed(2)}s">${germArt(pick(cols))}</g></g>`).join('');
  return `<g class="tooth" id="tooth${i}" transform="translate(${t.x.toFixed(1)},${t.y.toFixed(1)}) rotate(${t.a.toFixed(2)})"><g class="inner">
    <path class="enamel" d="${BODY[t.row]}" fill="#fff"/>
    <path d="${SHINE[t.row]}" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="${SHINE[t.row]}" stroke="#e3f2fd" stroke-width="4" stroke-linecap="round" fill="none"/>
    <g transform="translate(0,${t.c})">
      <g class="stains"><circle cx="14" cy="-22" r="8"/><circle cx="-20" cy="10" r="6"/><circle cx="8" cy="26" r="7"/><circle cx="20" cy="12" r="4"/></g>
      <g class="cavity"><ellipse class="cavRing" cx="3" cy="4" rx="20" ry="16" fill="#8d6e63" opacity=".5"/><ellipse class="cavHole" cx="3" cy="4" rx="13" ry="10" fill="#3e2723"/></g>
      <g class="filling"><ellipse cx="3" cy="4" rx="15" ry="12" fill="#f5f7fa" stroke="#b0bec5" stroke-width="3"/><path d="M-4 0 q4 -4 10 -2" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></g>
      <path class="crack" d="M-4 -32 L6 -14 L-5 2 L5 18 L-2 32" stroke="#8d6e63" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      <g class="germs">${germs}</g>
      <g class="foam"><circle cx="-16" cy="-20" r="12"/><circle cx="8" cy="-24" r="10"/><circle cx="18" cy="0" r="13"/><circle cx="-10" cy="4" r="11"/><circle cx="4" cy="24" r="12"/><circle cx="-20" cy="24" r="9"/><circle cx="20" cy="22" r="7"/></g>
      <g transform="translate(18,-28)"><path class="twinkle" d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4Z" fill="#ffd54f"/></g>
    </g></g></g>`;
}
function toGlobal(t,lx,ly){const r=t.a*Math.PI/180,c=Math.cos(r),s=Math.sin(r);return{x:t.x+lx*c-ly*s,y:t.y+lx*s+ly*c};}
function need(t){
  if(t.problem==='dirty'){if(t.germs>0)return'brush';if(t.foam>0)return'water';return null;}
  if(t.problem==='cavity'){if(t.cav==='hole')return'drill';if(t.cav==='drilled')return'fill';return null;}
  if(t.problem==='loose'){if(t.lz==='loose')return'pliers';if(t.lz==='gone')return'newtooth';return null;}
  return null;
}
function renderTooth(t){
  const q=t.q,dirty=t.problem==='dirty',s=dirty?Math.max(0,t.germs)/100:0;
  q.germs.style.display=dirty&&t.germs>0?'':'none';
  if(dirty){
    q.germList.forEach((ge,k)=>{
      const sc=clamp((s-k/3)*3,0,1);
      ge.setAttribute('transform',`translate(${GP[k][0]},${GP[k][1]}) scale(${sc.toFixed(3)})`);
      if(t.alive[k]&&sc<=0){t.alive[k]=false;const g=toGlobal(t,GP[k][0],t.c+GP[k][1]);popGerm(g.x,g.y);}
    });
  }
  q.stains.style.opacity=s;
  q.foam.style.display=dirty&&t.foam>0?'':'none';
  q.foam.style.opacity=dirty?Math.min(1,t.foam/50):0;
  const cav=t.problem==='cavity';
  q.cavity.style.display=cav&&t.cav!=='filled'?'':'none';
  if(cav){
    const drilled=t.cav==='drilled';
    q.cavRing.style.display=drilled?'none':'';
    q.cavRing.setAttribute('opacity',(.5*(1-t.drill/100)).toFixed(2));
    q.cavHole.setAttribute('fill',drilled?'#b0bec5':mix('#3e2723','#90a4ae',clamp(t.drill/100,0,1)));
  }
  q.filling.style.display=cav&&t.cav==='filled'?'':'none';
  const loose=t.problem==='loose';
  q.crack.style.display=loose&&t.lz==='loose'?'':'none';
  t.el.classList.toggle('loose',loose&&t.lz==='loose');
  t.el.classList.toggle('gone',loose&&t.lz==='gone');
  q.enamel.setAttribute('fill',loose&&t.lz==='loose'?'#efe3c4':dirty?mix('#ffffff','#efe0b8',s):'#ffffff');
  t.el.classList.toggle('clean',!!t.problem&&need(t)===null);
}

function mk(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}

function spawnDebris(x,y){if(Math.random()<.5)addPart(mk('circle',{r:rand(2,4),fill:pick(['#8d6e63','#a1887f','#cfd8dc'])}),{x:x+rand(-10,10),y:y+rand(-10,10),vx:rand(-170,170),vy:rand(-170,40),g:600,life:.5,max:.5});}
function sparkle(x,y,n=10){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),sp=rand(120,280);
  addPart(mk('path',{d:'M0 -12 L3.5 -3.5 L12 0 L3.5 3.5 L0 12 L-3.5 3.5 L-12 0 L-3.5 -3.5Z',fill:pick(['#ffd54f','#fff59d','#ffffff','#ff8fb1'])}),
  {x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,vr:rand(-300,300),life:.8,max:.8,scale:rand(.7,1.4)});}}
function popGerm(x,y){sfx.squeak();for(let i=0;i<7;i++){const a=rand(0,Math.PI*2);
  addPart(mk('circle',{r:rand(3,6),fill:pick(['#8bc34a','#ab47bc','#ffa726','#ffffff'])}),{x,y,vx:Math.cos(a)*200,vy:Math.sin(a)*200,life:.45,max:.45});}}
function flyTooth(t){const g=mk('g',{});g.innerHTML=`<path d="${BODY[t.row]}" fill="#efe3c4" stroke="#cfd6de" stroke-width="3"/>`;
  addPart(g,{x:t.x,y:t.y,rot:t.a,vr:rand(-500,500),vx:rand(-250,250),vy:t.row==='up'?-350:-650,g:1300,life:1.5,max:1.5});}
function updateParticles(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;
    if(p.life<=0){p.el.remove();parts.splice(i,1);continue;}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    p.el.setAttribute('transform',`translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) rotate(${p.rot.toFixed(1)}) scale(${p.scale})`);
    p.el.setAttribute('opacity',Math.min(1,p.life/p.max*1.6).toFixed(2));}
}

let tool='brush',finished=false,saidOnce={},happyUntil=0,lastProgress=0,lastHint=0,wrongTimer=0;

function praise(){say(pick(['Super!','Toll gemacht!','Prima!','Juhu!','Klasse!','Spitze!','Wow!']));}
function onStage(t,ev){
  switch(ev){
    case 'brushed':sfx.pop();sparkle(t.cx,t.cy,6);sayOnce('brushed','Toll geputzt! Jetzt spül den Schaum mit Wasser weg.');break;
    case 'rinsed':sfx.ding();sparkle(t.cx,t.cy,12);praise();break;

  }
  lastProgress=performance.now();
  if(need(t)===null)happyUntil=lastProgress+1300;

}
function showHint(t){
  const open=teeth.filter(x=>x.problem&&need(x));if(!open.length)return;
  if(!t||!need(t))t=open.find(x=>need(x)===tool)||open[0];
  const n=need(t);say(HINT[n]);
  const b=document.querySelector(`.tool[data-id="${n}"]`);
  if(b&&n!==tool){b.classList.add('hint');setTimeout(()=>b.classList.remove('hint'),2800);}
  const g=mk('circle',{cx:t.cx.toFixed(1),cy:t.cy.toFixed(1),r:62,class:'glow'});fx.insertBefore(g,fx.firstChild);setTimeout(()=>g.remove(),2800);
  lastHint=lastProgress=performance.now();
}
function clearActive(){teeth.forEach(t=>t.el&&t.el.classList.remove('shake','pulling'));ring.setAttribute('display','none');ringBg.setAttribute('display','none');cursorEl.classList.remove('buzz');}

function startPatient(p){
  P=p;finished=false;saidOnce={};mood=null;happyUntil=0;
  buildTeeth();assignProblems();buildScene(p);buildProgress();
  $('#menu').classList.add('hidden');$('#win').classList.add('hidden');$('#game').classList.remove('hidden');
  selectTool('brush',true);setMood('sad');
  lastProgress=lastHint=performance.now();
  say(pick([`Hallo, ich bin ${p.name} ${p.art}! Meine Zähne tun weh. Kannst du mir helfen?`,`Hallo! Ich bin ${p.name} ${p.art}. Bitte putz meine Zähne!`,`Aua, aua! Ich bin ${p.name} ${p.art}. Kannst du meine Zähne gesund machen?`]));
}
function win(){
  if(finished)return;finished=true;
  drillOn(false);pointer.active=false;cursorEl.classList.remove('on');clearActive();
  mem.total=(mem.total||0)+1;mem.per[P.id]=(mem.per[P.id]||0)+1;save();
  setMood('happy');$('#face').classList.add('cheer');sfx.fanfare();confetti();
  teeth.forEach(t=>{t.el.classList.add('clean');});
  say('Danke! Meine Zähne sind wieder blitzeblank!');
  setTimeout(()=>{
    $('#winText').textContent=`${P.name} ${P.art} hat wieder blitzeblanke Zähne! Du hast schon ${mem.total} ${mem.total===1?'Tier':'Tieren'} geholfen.`;
    $('#win').classList.remove('hidden');
  },2000);
}
function showMenu(){
  try{speechSynthesis.cancel();}catch(e){}
  drillOn(false);finished=true;eyes=[];
  $('#game').classList.add('hidden');$('#win').classList.add('hidden');$('#menu').classList.remove('hidden');
  $('#patients').innerHTML=PATIENTS.map(p=>`<button class="pcard" data-id="${p.id}">${faceMini(p)}<b>${p.name}</b><small>${mem.per[p.id]?'⭐'.repeat(Math.min(mem.per[p.id],5)):''}</small></button>`).join('');
  $('#starsTotal').textContent=`⭐ ${mem.total||0} Sterne gesammelt`;
  document.querySelectorAll('.pcard').forEach(b=>b.addEventListener('click',()=>{ac();sfx.click();startPatient(PATIENTS.find(p=>p.id===b.dataset.id));}));
}

/* ---------- Eingabe ---------- */
const stage=$('#stage');
function moveCursor(){
  const tt=TOOLS.find(t=>t.id===tool),k=1.4;
  cursorEl.style.transform=`translate(${pointer.x-tt.tip[0]*k}px,${pointer.y-tt.tip[1]*k}px)`;
}
function setPointer(e,first){
  pointer.x=e.clientX;pointer.y=e.clientY;const s=toSvg(e.clientX,e.clientY);pointer.sx=s.x;pointer.sy=s.y;
  if(first){pointer.lsx=s.x;pointer.lsy=s.y;}moveCursor();
}
stage.addEventListener('pointerdown',e=>{
  if(pointer.active||finished)return;ac();
  pointer.active=true;pointer.id=e.pointerId;try{stage.setPointerCapture(e.pointerId);}catch(_){}
  setPointer(e,true);cursorEl.classList.add('on');
});
stage.addEventListener('pointermove',e=>{
  if(pointer.active&&e.pointerId===pointer.id){setPointer(e,false);return;}
  if(e.pointerType==='mouse'&&!finished){setPointer(e,true);cursorEl.classList.add('on');stage.style.cursor='none';}
});
stage.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!pointer.active)cursorEl.classList.remove('on');});
function endPointer(e){
  if(e.pointerId!==pointer.id)return;pointer.active=false;pointer.id=null;
  if(e.pointerType!=='mouse')cursorEl.classList.remove('on');
  drillOn(false);clearActive();wrongTimer=0;
}
stage.addEventListener('pointerup',endPointer);stage.addEventListener('pointercancel',endPointer);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

$('#tray').innerHTML=TOOLS.map(t=>`<button class="tool" data-id="${t.id}"><svg viewBox="0 0 100 100">${ICON[t.id]}</svg><span>${t.label}</span></button>`).join('');
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();ac();selectTool(b.dataset.id);}));
$('#homeBtn').addEventListener('click',()=>{sfx.click();showMenu();});
$('#helpBtn').addEventListener('click',()=>{ac();sfx.click();if(!finished)showHint();});
$('#soundBtn').addEventListener('click',()=>{soundOn=!soundOn;$('#soundBtn').textContent=soundOn?'🔊':'🔇';
  if(!soundOn){try{speechSynthesis.cancel();}catch(e){}drillOn(false);}else{ac();sfx.click();}});
$('#nextBtn').addEventListener('click',()=>{ac();const others=PATIENTS.filter(p=>p!==P);startPatient(pick(others));});
$('#menuBtn').addEventListener('click',()=>showMenu());

/* ---------- Hauptschleife ---------- */
let lastT=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(fx)updateParticles(dt);
  if(!$('#game').classList.contains('hidden')&&eyes.length){
    let scared=false,ringT=null,ringP=0;
    if(pointer.active&&!finished){
      const p=pointer,dist=Math.hypot(p.sx-p.lsx,p.sy-p.lsy);p.lsx=p.sx;p.lsy=p.sy;
      const t=nearestTooth(p.sx,p.sy),n=t?need(t):null;let worked=false;
      teeth.forEach(x=>{if(x!==t)x.el.classList.remove('shake','pulling');});
      switch(tool){
        case 'brush':
          if(dist>.5){if(Math.random()<dist/22)spawnBubble(p.sx,p.sy);sfx.brush();}
          if(t&&n==='brush'&&dist>0){t.germs-=dist*.22;worked=true;
            if(t.germs<=0){t.germs=0;t.foam=100;renderTooth(t);onStage(t,'brushed');}else renderTooth(t);}
          break;
        case 'water':
          spawnDrop(p.sx,p.sy);spawnDrop(p.sx,p.sy);sfx.water();
          if(t&&n==='water'){t.foam-=dt*110;worked=true;
            if(t.foam<=0){t.foam=0;onStage(t,'rinsed');}else renderTooth(t);}
          break;
        case 'drill':
          drillOn(true,t&&n==='drill');cursorEl.classList.add('buzz');
          if(t&&n==='drill'){t.drill+=dt*65;worked=true;scared=true;ringT=t;ringP=t.drill/100;spawnDebris(t.cx,t.cy);t.el.classList.add('shake');
            if(t.drill>=100){t.drill=100;t.cav='drilled';t.el.classList.remove('shake');onStage(t,'drilled');}else renderTooth(t);}
          else if(t)t.el.classList.remove('shake');
          break;
        case 'fill':
          if(t&&n==='fill'){t.cav='filled';worked=true;onStage(t,'filled');}
          break;
        case 'pliers':
          if(t&&n==='pliers'){t.pull+=dt*75;worked=true;scared=true;ringT=t;ringP=t.pull/100;t.el.classList.add('pulling');
            if(t.pull>=100){t.lz='gone';t.el.classList.remove('pulling');flyTooth(t);onStage(t,'pulled');}}
          break;
        case 'newtooth':
          if(t&&n==='newtooth'){t.lz='new';worked=true;t.el.classList.add('grow');const el=t.el;setTimeout(()=>el.classList.remove('grow'),800);onStage(t,'newtooth');}
          break;
      }
      if(worked){lastProgress=now;wrongTimer=0;}
      else if(t&&n&&n!==tool){wrongTimer+=dt;if(wrongTimer>.9&&now-lastHint>4500){showHint(t);wrongTimer=0;}}
      else wrongTimer=0;
      updateEyes(p.sx,p.sy);
    }else{
      updateEyes(pointer.hover?pointer.sx:null,pointer.sy);
    }
    if(ringT&&ringP<1){
      const tr=`translate(${ringT.cx.toFixed(1)},${ringT.cy.toFixed(1)}) rotate(-90)`;
      ring.setAttribute('transform',tr);ringBg.setAttribute('transform',tr);
      ring.setAttribute('stroke-dashoffset',(377*(1-ringP)).toFixed(1));
      ring.setAttribute('display','inline');ringBg.setAttribute('display','inline');
    }else{ring.setAttribute('display','none');ringBg.setAttribute('display','none');}
    if(finished)setMood('happy');
    else if(scared)setMood('scared');
    else if(now<happyUntil)setMood('happy');
    else setMood('sad');
    if(!finished&&now-lastProgress>9000&&now-lastHint>9000)showHint();
  }
  requestAnimationFrame(loop);
}
showMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
