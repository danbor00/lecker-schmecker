/* ===== src/games/trace.js ===== */
/* Zahlen nachspuren: der Finger fährt die Ziffer nach, sie färbt sich ein */
(() => {
  const DIGITS = {
    '1': ['M65,85 L115,40 L115,262'],
    '2': ['M52,95 C52,25 165,25 162,95 C160,150 60,195 48,260 L168,260'],
    '3': ['M50,70 C70,25 160,25 158,88 C156,135 100,145 92,148 C165,148 175,262 102,262 C72,262 52,248 46,232'],
    '4': ['M135,262 L135,40 L40,190 L172,190'],
    '5': ['M158,42 L68,42 L58,138 C100,108 168,122 168,190 C168,255 88,275 46,240'],
    '6': ['M152,55 C120,32 52,48 50,170 C48,238 80,264 108,264 C145,264 166,236 166,200 C166,160 138,138 108,138 C78,138 54,158 50,185'],
    '7': ['M44,44 L168,44 L88,262'],
    '8': ['M105,148 C58,144 56,46 105,44 C154,46 152,144 105,148 C44,152 46,262 105,262 C164,262 166,152 105,148'],
    '9': ['M160,100 C160,55 132,40 105,40 C72,40 50,64 50,100 C50,138 78,158 105,158 C134,158 160,136 160,100 L160,262'],
  };
  const SC = 1.5, OY = 400 - 150 * SC;
  let sampler = null;
  function samplePath(d, step) {
    if (!sampler) { sampler = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); sampler.setAttribute('width', '10'); sampler.setAttribute('height', '10'); sampler.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden'; document.body.appendChild(sampler); }
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d); sampler.appendChild(p);
    const L = p.getTotalLength(), out = [];
    for (let l = 0; l < L; l += step) { const q = p.getPointAtLength(l); out.push({ x: q.x, y: q.y }); }
    const q = p.getPointAtLength(L); out.push({ x: q.x, y: q.y }); p.remove(); return out;
  }
  function mark(g, x, y) {
    let any = false;
    for (const p of g.pts) if (!p.hit && (p.x - x) ** 2 + (p.y - y) ** 2 < g.tol * g.tol) { p.hit = true; g.hits++; any = true; }
    if (any && Math.random() < 0.35) Sound.play('tap');
    if (g.state === 'play' && g.hits / g.pts.length >= g.need) {
      for (const p of g.pts) p.hit = true;
      Sound.play('magic'); Particles.burst('star', g.cx, 400, 18, { colors: [PAL.yellow, '#fff', NUMCOL[g.n - 1]], speed: 300, life: 1.1, size: 15 });
      g.drawing = false; g.demo = null; g.roundDone(`${NAME[g.n]}! Super!`);
    }
  }
  const def = {
    id: 'trace', name: 'Nachspuren',
    intro: 'Mal die Zahl mit dem Finger!',
    icon(c, x, y) { Draw.card(c, x, y - 56, 96, 110, '#fff'); Draw.label(c, '2', x, y - 52, 76, NUMCOL[1], INK, 700); Draw.hand(c, x + 40, y - 30, 1); },
    rounds(mode) { return mode === 'small' ? [{ n: 1 }, { n: 2 }, { n: 3 }] : sample([4, 5, 6, 7, 8, 9], 3).sort((a, b) => a - b).map((n) => ({ n })); },
    start(g, spec) {
      g.n = spec.n; const ox = 430 - 105 * SC; g.cx = 430;
      g.paths = DIGITS[String(spec.n)].map((d) => ({ d, p2: new Path2D(d) })); g.ox = ox;
      g.pts = []; g.hits = 0; g.trail = []; g.drawing = false; g.demo = null;
      for (const pth of g.paths) for (const q of samplePath(pth.d, 5)) g.pts.push({ x: ox + q.x * SC, y: OY + q.y * SC, hit: false });
      g.tol = Game.small ? 52 : 40; g.need = Game.small ? 0.7 : 0.85;
      g.task = `Fahr die ${NAME[spec.n]} mit dem Finger nach! Fang beim grünen Punkt an.`;
      Game.lastInput = Game.time;
    },
    down(g, p) { g.demo = null; g.drawing = true; g.trail = [p]; mark(g, p.x, p.y); },
    move(g, p) {
      if (!g.drawing) return; const l = g.trail[g.trail.length - 1];
      const n = Math.max(1, Math.ceil(dist(l.x, l.y, p.x, p.y) / 10));
      for (let i = 1; i <= n; i++) mark(g, lerp(l.x, p.x, i / n), lerp(l.y, p.y, i / n));
      g.trail.push(p); if (g.trail.length > 60) g.trail.shift();
    },
    up(g) { g.drawing = false; g.trail = []; },
    update(g, dt) {
      if (g.state !== 'play') return;
      if (g.demo) { g.demo.t += dt; if (g.demo.t > 3.4) { g.demo = null; Game.lastInput = Game.time; } return; }
      if (!Input.down && Game.time - Game.lastInput > (g.hits ? 7 : 3.5)) g.demo = { t: 0 };
    },
    draw(g, c) {
      Draw.wallpaper(c, '#fff1cf', '#fff7e3'); Draw.floor(c, 690, '#d9a66b');
      Draw.rrPath(c, 230, 150, 400, 500, 40); Draw.fs(c, '#fff', 5);
      c.save(); c.translate(g.ox, OY); c.scale(SC, SC);
      for (const pth of g.paths) {
        c.lineWidth = 50; c.strokeStyle = '#f1e4d2'; c.stroke(pth.p2);
        c.lineWidth = 3; c.strokeStyle = '#c9b293'; c.setLineDash([2, 12]); c.stroke(pth.p2); c.setLineDash([]);
      }
      c.restore();
      const col = NUMCOL[g.n - 1];
      c.fillStyle = col; for (const p of g.pts) if (p.hit) { c.beginPath(); c.arc(p.x, p.y, 36, 0, TAU); c.fill(); }
      if (g.trail.length > 1) { c.save(); c.globalAlpha = 0.35; c.lineWidth = 14; c.strokeStyle = col; c.beginPath(); g.trail.forEach((p, i) => (i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y))); c.stroke(); c.restore(); }
      if (g.state === 'play' && g.hits < 4) { const s = g.pts[0], k = 1 + Math.sin(Game.time * 6) * 0.15; c.beginPath(); c.arc(s.x, s.y, 26 * k, 0, TAU); Draw.fs(c, PAL.green, 4); Draw.starPath(c, s.x, s.y, 11, 5, 5); Draw.fs(c, '#fff', 0); }
      // Menge daneben: so viele Punkte
      Draw.card(c, 790, 400, 230, 250, '#fff'); drawDots(c, 790, 400, g.n, 82, col);
      if (g.demo) {
        const t = g.demo.t, k = clamp((t - 0.3) / 2.6, 0, 1), first = g.pts.filter((p, i) => i < g.pts.length);
        const p = first[Math.min(first.length - 1, Math.floor(k * (first.length - 1)))];
        c.save(); c.globalAlpha = Math.min(1, t * 3) * (t > 3.1 ? (3.4 - t) / 0.3 : 1); Draw.hand(c, p.x + 14, p.y + 18, t > 0.3 ? 1 : t / 0.3); c.restore();
      }
    },
  };
  registerCustom(def);
})();

/* ===== src/games/fish.js ===== */
/* Fische fangen: welche Zahl wird gesucht? (ab 4: nur Punkte als Hinweis) */
(() => {
  const FCOL = [PAL.orange, PAL.pink, PAL.green, PAL.purple, '#2bb5a0', PAL.yellow];
  function drawFish(c, f) {
    c.save(); c.translate(f.x, f.y - (f.jump || 0)); c.rotate(Math.sin(Game.time * 40) * 0.15 * (f.wob || 0)); c.scale(f.dir, 1);
    c.beginPath(); c.moveTo(-58, 0); c.lineTo(-96, -32); c.lineTo(-92, 32); c.closePath(); Draw.fs(c, shade(f.col, -0.15), 4);
    Draw.ellipse(c, 0, 0, 72, 50); Draw.fs(c, f.col, 4); Draw.shine(c, -10, -26, 26, 9, 0.45);
    c.beginPath(); c.arc(44, -12, 10, 0, TAU); Draw.fs(c, '#fff', 3); c.beginPath(); c.arc(47, -11, 5, 0, TAU); Draw.fs(c, INK, 0);
    c.restore();
    Draw.label(c, String(f.v), f.x - f.dir * 6, f.y - (f.jump || 0) + 4, 52, '#fff', INK, 700);
  }
  const def = {
    id: 'fish', name: 'Fische',
    intro: 'Ab ins Wasser!',
    icon(c, x, y) { drawFish(c, { x, y: y - 56, dir: 1, col: PAL.orange, v: 3, jump: 0, wob: 0 }); },
    rounds(mode) {
      const mk = (n, k, max) => ({ n, opts: shuffle([n, ...sample(range(1, max).filter((v) => v !== n), k - 1)]) });
      return mode === 'small' ? [mk(1, 2, 3), mk(2, 2, 3), mk(3, 3, 3)] : [mk(randi(4, 6), 3, 7), mk(randi(5, 8), 4, 9), mk(randi(6, 10), 4, 10)];
    },
    start(g, spec) {
      g.n = spec.n; const ys = spreadX(spec.opts.length, 210, 540);
      g.fish = spec.opts.map((v, i) => ({ v, x: rand(380, 820), y: ys[i], dir: Math.random() < 0.5 ? -1 : 1, col: FCOL[i % FCOL.length], sp: Game.small ? 34 : 55, wob: 0, jump: 0, scale: 1 }));
      g.task = `Wo ist die ${NAME[spec.n]}?` + (Game.small ? '' : ' Zähl die Punkte!');
    },
    down(g, p) {
      const f = g.fish.find((q) => Math.abs(p.x - q.x) < 100 && Math.abs(p.y - q.y) < 62); if (!f) return;
      if (f.v === g.n) {
        g.heroJoy = Game.time; Sound.play('pop'); Sound.play('sparkle');
        tween(f, { jump: 60 }, 0.3, { ease: 'outQuad', owner: g, done: () => tween(f, { jump: 0 }, 0.4, { ease: 'outBounce', owner: g }) });
        Particles.burst('bubble', f.x, f.y, 14, { speed: 160, life: 1.2, size: 12, g: -120 });
        g.roundDone(`Ja! Das ist die ${NAME[g.n]}!`);
      } else { Sound.play('boing'); f.wob = 1; tween(f, { wob: 0 }, 0.5, { owner: g }); Voice.say(`Das ist die ${NAME[f.v]}. Wo ist die ${NAME[g.n]}?`, { force: true }); }
    },
    hint(g) { const f = g.fish.find((q) => q.v === g.n); return f ? { x1: f.x, y1: f.y, x2: f.x, y2: f.y } : null; },
    update(g, dt) {
      for (const f of g.fish) { if (g.state !== 'play' && f.v === g.n) continue; f.x += f.dir * f.sp * dt; if (f.x > 880) f.dir = -1; if (f.x < 360) f.dir = 1; f.y += Math.sin(Game.time * 1.5 + f.v) * 6 * dt; }
      if (Math.random() < 0.03) Particles.add({ type: 'bubble', x: rand(View.L + 40, View.R - 40), y: View.B - 80, vy: -70, life: 4, size: rand(5, 12) });
    },
    draw(g, c) {
      Draw.sky(c, '#3fb6ec', '#1f78c8');
      c.fillStyle = '#f3d79a'; c.fillRect(View.L - 5, 680, View.vw + 10, View.B - 670); c.lineWidth = 4; c.strokeStyle = INK; c.beginPath(); c.moveTo(View.L - 5, 680); c.lineTo(View.R + 5, 680); c.stroke();
      for (const sx of [330, 600, 930]) { c.lineWidth = 12; c.strokeStyle = '#3fae4a'; c.beginPath(); c.moveTo(sx, 690); for (let i = 1; i <= 5; i++) c.lineTo(sx + Math.sin(Game.time * 1.5 + i + sx) * 12, 690 - i * 34); c.stroke(); }
      for (const f of g.fish) drawFish(c, f);
      heroWithBubble(c, g, (cc, bx, by) => { if (Game.small) numBadge(cc, bx, by, g.n, 44); else drawDots(cc, bx, by, g.n, 58, INK); });
    },
  };
  registerCustom(def);
})();

/* ===== src/games/more.js ===== */
/* Mehr oder weniger: Wo sind mehr Früchte? Danach wird gemeinsam gezählt. */
(() => {
  const KINDS = [{ k: 'apple', pl: 'Äpfel' }, { k: 'strawberry', pl: 'Erdbeeren' }, { k: 'cherry', pl: 'Kirschen' }];
  function spots(n, cx) { const per = 3, out = []; for (let i = 0; i < n; i++) { const row = Math.floor(i / per), inRow = Math.min(per, n - row * per); out.push({ x: cx + ((i % per) - (inRow - 1) / 2) * 70, y: 500 - row * 60, lit: 0 }); } return out; }
  const def = {
    id: 'more', name: 'Mehr',
    intro: 'Schau genau!',
    icon(c, x, y) { Draw.bowl(c, x - 34, y - 26, 32, PAL.blue); Draw.food(c, 'apple', x - 34, y - 46, 0.45); Draw.bowl(c, x + 36, y - 26, 32, PAL.orange); for (const [dx, dy] of [[-12, -44], [12, -44], [0, -66]]) Draw.food(c, 'apple', x + 36 + dx, y + dy, 0.4); },
    rounds(mode) { return (mode === 'small' ? [[1, 3], [2, 5], [1, 4]] : [[3, 5], [4, 6], [5, 6]]).map(([a, b]) => ({ a, b, kind: pick(KINDS) })); },
    start(g, spec) {
      const swap = Math.random() < 0.5, ns = swap ? [spec.b, spec.a] : [spec.a, spec.b];
      g.kind = spec.kind; g.baskets = ns.map((n, i) => { const x = i ? 724 : 300; return { x, n, items: spots(n, x), shake: 0, col: i ? PAL.orange : PAL.blue }; });
      g.big = g.baskets[0].n > g.baskets[1].n ? g.baskets[0] : g.baskets[1];
      g.task = `Wo sind mehr ${spec.kind.pl}? Tipp drauf!`;
    },
    down(g, p) {
      const b = g.baskets.find((q) => inRect(p, q.x, 470, 320, 330)); if (!b) return;
      if (b === g.big) {
        g.state = 'count'; Sound.play('select');
        b.items.forEach((it, i) => after(0.5 + i * 0.6, () => { it.lit = 1; Sound.play('count', { n: i + 1 }); Voice.say(NAME[i + 1], { force: true }); g.heroJoy = Game.time; }, g));
        after(0.6 + b.n * 0.6, () => g.roundDone(`${NAME[b.n]}! Hier sind mehr!`), g);
      } else { Sound.play('boing'); b.shake = 1; tween(b, { shake: 0 }, 0.5, { owner: g }); Voice.say(`Hier sind weniger. Wo sind mehr?`, { force: true }); }
    },
    hint(g) { return { x1: g.big.x, y1: 470, x2: g.big.x, y2: 470 }; },
    draw(g, c) {
      Draw.wallpaper(c, '#e6f8d8', '#f0fbe6'); Draw.floor(c, 660, '#d9a66b'); Draw.table(c, 512, 580, 900, '#f3d9a4');
      for (const b of g.baskets) {
        c.save(); c.translate(Math.sin(Game.time * 60) * 8 * b.shake, 0);
        Draw.bowl(c, b.x, 560, 135, b.col);
        for (const it of b.items) { if (it.lit) { c.save(); c.globalAlpha = 0.55; c.beginPath(); c.arc(it.x, it.y, 40, 0, TAU); c.fillStyle = PAL.yellow; c.fill(); c.restore(); } Draw.food(c, g.kind.k, it.x, it.y, 1.0); }
        c.restore();
      }
    },
  };
  registerCustom(def);
})();

/* ===== src/main.js ===== */
/* ---------- Start ---------- */
setScene(makeTitle(), { instant: true });
requestAnimationFrame(frame);
/* Entwicklerhaken (zum Testen im Browser): KF.open('bus'), KF.mode('big'), KF.hub() */
window.KF = {
  open(id) { const d = gameById(id); if (d) setScene(d.make ? d.make() : makeSortGame(d), { instant: true }); return !!d; },
  hub() { setScene(makeHub(), { instant: true }); },
  heroes() { setScene(makeHeroSelect(true), { instant: true }); },
  hero(id) { Store.data.hero = id; Store.save(); },
  page(n) { hubPage = n; },
  hint() { const s = Game.scene; return s && s.hint ? s.hint() : null; },
  title() { setScene(makeTitle(), { instant: true }); },
  mode(m) { Store.data.mode = m; Store.save(); },
  state() { const s = Game.scene; return { scene: s && s.def ? s.def.id : (s && s.toys ? 'hub' : 'other'), state: s && s.state, round: s && s.round, items: s && s.items ? s.items.map((it) => ({ x: it.x, y: it.y, placed: !!it.placed, r: it.r })) : null, slots: s && s.slots ? s.slots.map((sl) => ({ x: sl.x, y: sl.y, r: sl.r, filled: sl.filled.length, cap: sl.cap || 1 })) : null, bowls: s && s.bowls ? s.bowls.map((b) => ({ x: b.x, y: b.y, want: b === s.want, found: b.found })) : null }; },
  view() { return { sc: View.sc, ox: View.ox, oy: View.oy }; },
  games: () => GAMES.map((g) => g.id),
  allDone() { for (const g of GAMES) Store.data.done[Store.data.mode][g.id] = true; Store.data.party[Store.data.mode] = false; Store.save(); },
  reset() { Store.resetProgress('small'); Store.resetProgress('big'); },
  parents() { if (Game.scene && Game.scene.toys) Game.overlay = makeParents(Game.scene); },
  done: () => Store.data.done,
};
