<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blitzblank">
<link id="appIcon" rel="apple-touch-icon" href="">
<title>Blitzblank-Garage</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#74c0fc;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
  font-family:"Arial Rounded MT Bold","Avenir Next Rounded","Avenir Next","Nunito",system-ui,sans-serif;color:#2b2d42}
#cv{position:fixed;inset:0;display:block}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.round{width:64px;height:64px;border-radius:50%;background:#fff;font-size:30px;box-shadow:0 5px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;flex:none}
.round:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
#hud{position:fixed;left:0;right:0;top:0;height:96px;display:none;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left));pointer-events:none;z-index:5}
#hud.on{display:flex}
#hud>*{pointer-events:auto}
#steps{display:flex;gap:12px;background:rgba(255,255,255,.6);padding:8px 16px;border-radius:40px}
.step{width:56px;height:56px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;opacity:.55;transition:transform .3s,opacity .3s}
.step i{font-style:normal;font-size:28px;width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.step.cur{opacity:1;transform:scale(1.18)}
.step.done{opacity:1;background:#51cf66}
.step.done::after{content:'✓';position:absolute;right:-5px;bottom:-5px;background:#2f9e44;color:#fff;font-size:15px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900}
#tray{position:fixed;left:50%;bottom:0;transform:translateX(-50%);display:none;gap:12px;align-items:center;justify-content:center;
  padding:14px 22px calc(14px + env(safe-area-inset-bottom));background:rgba(255,255,255,.9);border-radius:30px 30px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.12);z-index:5;max-width:100vw}
#tray.on{display:flex}
.sw{width:62px;height:62px;border-radius:50%;border:5px solid #fff;box-shadow:0 0 0 3px #ced4da;flex:none;transition:transform .15s}
.sw.sel{box-shadow:0 0 0 5px #2b2d42;transform:scale(1.15)}
.tItem{width:74px;height:74px;flex:none;border-radius:20px;background:#f1f3f5;display:flex;align-items:center;justify-content:center;font-size:46px;touch-action:none;transition:transform .15s}
.tItem svg{width:62px;height:62px;pointer-events:none}
.tItem.sel{background:#ffe066;transform:scale(1.1)}
.tItem.gone{visibility:hidden}
.okBtn{background:#51cf66;color:#fff;font-size:44px;width:92px;height:74px;border-radius:24px;box-shadow:0 5px 0 #2f9e44;flex:none;margin-left:8px}
.okBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #2f9e44}
#bubble{position:fixed;z-index:6;background:#fff;border-radius:24px;padding:12px 18px;font-size:22px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.12);
  max-width:300px;opacity:0;transform:scale(.6);transform-origin:bottom left;transition:opacity .25s,transform .25s;pointer-events:none;line-height:1.25}
#bubble.on{opacity:1;transform:scale(1)}
#bubble::after{content:'';position:absolute;left:26px;bottom:-14px;border:14px solid transparent;border-top-color:#fff;border-bottom:0}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.6vh;padding:20px;z-index:10;
  background:radial-gradient(circle at 50% 0%,#a5d8ff,#4dabf7 75%);overflow:hidden}
.screen.on{display:flex}
.screen h1{margin:0;font-size:clamp(34px,5.4vw,64px);color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.18);text-align:center;letter-spacing:1px}
.screen h2{margin:0;font-size:clamp(22px,3.2vw,36px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.15);text-align:center}
.row{display:flex;gap:2vw;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}
.card{background:#fff;border-radius:28px;box-shadow:0 8px 0 rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;transition:transform .15s}
.card:active{transform:scale(.94)}
.card span{font-size:clamp(18px,2.4vw,28px);font-weight:800}
.card small{font-size:15px;color:#868e96;font-weight:700}
.char{width:clamp(130px,17vw,190px)}
.char svg{width:100%;height:auto;aspect-ratio:2/3}
.char.sel{box-shadow:0 0 0 6px #ffd43b,0 8px 0 rgba(0,0,0,.15)}
.mode{width:clamp(230px,34vw,380px);height:clamp(210px,30vw,320px);gap:8px}
.mode .big{font-size:clamp(70px,10vw,118px);line-height:1}
#vehGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6vw;width:min(94vw,1100px);position:relative;z-index:1}
@media (orientation:portrait){#vehGrid{grid-template-columns:repeat(3,1fr);gap:2.4vw}}
.veh{position:relative;padding:10px 8px 8px}
.veh svg{width:100%;height:clamp(64px,11vh,120px)}
.veh span{font-size:clamp(16px,2vw,22px)}
.badges{position:absolute;top:6px;right:10px;font-size:22px;letter-spacing:2px}
.back{position:absolute;top:calc(16px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));z-index:2}
#modeChar{position:absolute;left:3vw;bottom:2vh;width:clamp(110px,15vw,180px);z-index:1}
#scrDone{background:rgba(25,35,80,.55)}
#doneStars{font-size:clamp(50px,8vw,90px);letter-spacing:10px}
#doneStars span{display:inline-block;animation:pop .5s backwards}
#doneStars span:nth-child(2){animation-delay:.25s}#doneStars span:nth-child(3){animation-delay:.5s}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.small{width:clamp(130px,17vw,190px);height:clamp(120px,15vw,170px);gap:6px}
.small .big{font-size:clamp(44px,6vw,64px);line-height:1}
.deco{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(255,255,255,.25) 40%,rgba(255,255,255,.08) 70%);border:2px solid rgba(255,255,255,.6);animation:rise linear infinite;z-index:0;pointer-events:none}
@keyframes rise{from{transform:translateY(110vh)}to{transform:translateY(-30vh)}}
.title-veh{display:flex;gap:2vw;font-size:clamp(34px,5vw,60px)}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <button class="round" id="btnBack" aria-label="Zurück">◀</button>
  <div id="steps"></div>
  <button class="round" id="btnSound" aria-label="Ton">🔊</button>
</div>
<div id="tray"></div>
<div id="bubble"></div>

<div class="screen" id="scrChar">
  <div class="title-veh">🚗🫧🔧🚀</div>
  <h1>Blitzblank-Garage</h1>
  <h2>Wer hilft heute mit?</h2>
  <div class="row" id="charList"></div>
</div>

<div class="screen" id="scrMode">
  <button class="round back" data-go="char">◀</button>
  <h1>Was machen wir heute?</h1>
  <div class="row">
    <button class="card mode" data-mode="wash"><div class="big">🫧🚿</div><span>Waschanlage</span></button>
    <button class="card mode" data-mode="repair"><div class="big">🔧🔨</div><span>Werkstatt</span></button>
  </div>
  <div id="modeChar"></div>
</div>

<div class="screen" id="scrVeh">
  <button class="round back" data-go="mode">◀</button>
  <h1 id="vehTitle">Welches Fahrzeug?</h1>
  <div id="vehGrid"></div>
</div>

<div class="screen" id="scrDone">
  <div id="doneStars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
  <h1 id="doneTitle">Super gemacht!</h1>
  <div class="row">
    <button class="card small" id="dAgain"><div class="big">🔁</div><span>Nochmal</span></button>
    <button class="card small" id="dSwitch"><div class="big">🔧</div><span>Reparieren</span></button>
    <button class="card small" id="dVeh"><div class="big">🚗</div><span>Fahrzeuge</span></button>
    <button class="card small" id="dHome"><div class="big">🏠</div><span>Figuren</span></button>
  </div>
</div>

let AC=null,master=null,noiseBuf=null,loopN=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{
    AC=new C();master=AC.createGain();master.gain.value=store.d.mute?0:.8;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1200;f.Q.value=.8;
    const g=AC.createGain();g.gain.value=0;src.connect(f);f.connect(g);g.connect(master);src.start();
    loopN={f,g,kind:null};
  }catch(e){AC=null}
}
const LOOPS={water:['bandpass',1500,.6,.32],dryer:['lowpass',650,.7,.4],weld:['highpass',3800,.7,.22],spray:['bandpass',5200,.9,.22],scrub:['bandpass',900,1.4,.22],polish:['bandpass',3200,2,.12]};
function setLoop(kind,on){
  if(!loopN)return;const now=AC.currentTime;const p=LOOPS[kind];
  if(!p||!on){loopN.g.gain.setTargetAtTime(0,now,.05);return}
  if(loopN.kind!==kind){loopN.f.type=p[0];loopN.f.frequency.setValueAtTime(p[1],now);loopN.f.Q.setValueAtTime(p[2],now);loopN.kind=kind}
  if(kind==='weld')loopN.f.frequency.setTargetAtTime(p[1]*(.7+Math.random()*.8),now,.02);
  loopN.g.gain.setTargetAtTime(p[3],now,.05);
}
function tone(freq,dur,type='sine',vol=.3,slide=null,delay=0){
  if(!AC)return;const t=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,freq,vol=.3,type='bandpass',delay=0,slide=null){
  if(!AC)return;const t=AC.currentTime+delay;const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t);if(slide)f.frequency.exponentialRampToValueAtTime(slide,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+dur+.05);
}
function sfx(n){
  if(!AC)return;
  switch(n){
    case 'pop':tone(500+Math.random()*300,.09,'sine',.25,1300);break;
    case 'tap':tone(300,.06,'triangle',.15,200);break;
    case 'clank':tone(1180,.25,'triangle',.18,1100);tone(1770,.18,'sine',.1);noise(.06,2500,.4);tone(140,.12,'square',.08,90);break;
    case 'click':noise(.02,4200,.35,'highpass');tone(2200,.025,'square',.04);break;
    case 'ding':[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.18,null,i*.08));break;
    case 'fanfare':[[523,0],[659,.12],[784,.24],[1047,.38],[784,.55],[1047,.68]].forEach(([f,d],i)=>tone(f,i===5?.7:.2,'triangle',.22,null,d));
      [[262,0],[330,.38],[392,.68]].forEach(([f,d])=>tone(f,.4,'sine',.15,null,d));break;
    case 'glug':tone(160+Math.random()*80,.13,'sine',.4,80);break;
    case 'snap':tone(260,.08,'square',.12,900);tone(1300,.15,'triangle',.15,null,.06);break;
    case 'boing':tone(180,.35,'sine',.3,520);break;
    case 'vroom':tone(70,1.4,'sawtooth',.12,210);tone(72,1.4,'sawtooth',.08,230);break;
    case 'whoosh':noise(1.6,300,.5,'bandpass',0,2500);tone(60,1.6,'sawtooth',.12,40);break;
    case 'fly':noise(1.4,500,.3,'bandpass',0,1500);tone(120,1.4,'triangle',.1,260);break;
    case 'sticker':tone(800,.07,'sine',.2,1500);tone(1500,.1,'sine',.12,null,.06);break;
    case 'squeak':tone(1400,.08,'sine',.08,2200);break;
  }
}
let voices=[];function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function say(t){
  if(store.d.mute||!t||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.95;u.pitch=1.2;
    const v=voices.find(v=>/de(-|_)DE/i.test(v.lang)&&/Anna|Petra|Helena|Marlene|Vicki/i.test(v.name))||voices.find(v=>/^de/i.test(v.lang));if(v)u.voice=v;
    speechSynthesis.speak(u)}catch(e){}
}

/* ================= Layout ================= */
function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  layout();
}
function layout(){
  if(!G)return;const d=G.def,top=104,trayH=126,land=W>H;
  let chH,ax,aw,ay,ah;
  if(land){chH=Math.min(H*.44,340);ax=chH*2/3*.9+14;aw=W-ax-24;ay=top;ah=H-top-trayH-8}
  else{chH=Math.min(H*.25,290);ax=20;aw=W-40;ay=top+10;ah=H-top-trayH-chH*.8}
  const s=Math.min(aw/d.w,ah/d.h)*.96;
  G.s=s;G.vw=d.w*s;G.vh=d.h*s;G.vx=ax+(aw-G.vw)/2;G.vy=ay+ah-G.vh;G.floorY=G.vy+G.vh;
  G.chH=chH;G.chW=chH*2/3;G.chX=land?8:14;G.chB=land?Math.min(G.floorY+24,H-trayH+16):H-trayH+8;
  bgC=null;placeBubble();
}
const toLocal=(px,py)=>[(px-(G.vx+G.offX))/G.s,(py-(G.vy+G.offY))/G.s];
const toScreen=(x,y)=>[G.vx+G.offX+x*G.s,G.vy+G.offY+y*G.s];

/* ================= Hintergrund ================= */
function renderBG(){
  bgC=mk(W*DPR,H*DPR);const x=bgC.getContext('2d');x.scale(DPR,DPR);
  const fy=G?G.floorY-14:H*.75;
  if(!G||G.mode==='wash'){
    let g=x.createLinearGradient(0,0,0,fy);g.addColorStop(0,'#d0ebff');g.addColorStop(1,'#a5d8ff');x.fillStyle=g;x.fillRect(0,0,W,fy);
    x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=3;const ts=64;
    for(let i=0;i<W;i+=ts){x.beginPath();x.moveTo(i,0);x.lineTo(i,fy);x.stroke()}
    for(let j=0;j<fy;j+=ts){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}
    // Waschbürsten links/rechts
    [[W-70,'#4dabf7','#a5d8ff'],[W-150,'#f783ac','#fcc2d7']].forEach(([bx,c1,c2])=>{
      x.fillStyle='#868e96';x.fillRect(bx-4,0,8,fy*.25);
      for(let k=0;k<9;k++){x.fillStyle=k%2?c1:c2;rr(x,bx-34,fy*.25+k*(fy*.07),68,fy*.07+2,10);x.fill()}
    });
    // Schild
    x.fillStyle='#1c7ed6';rr(x,W*.5-150,108,300,46,23);x.fill();
    x.fillStyle='#fff';x.font='bold 24px "Arial Rounded MT Bold",system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText('🫧 WASCHSTRASSE 🫧',W*.5,132);
    g=x.createLinearGradient(0,fy,0,H);g.addColorStop(0,'#ced4da');g.addColorStop(1,'#adb5bd');x.fillStyle=g;x.fillRect(0,fy,W,H-fy);
    x.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<W;i+=120){x.fillRect(i,fy,60,8)}
    x.fillStyle='#868e96';x.beginPath();x.ellipse(W*.6,H-60,46,14,0,0,7);x.fill();
    x.strokeStyle='#495057';x.lineWidth=3;for(let i=-30;i<=30;i+=12){x.beginPath();x.moveTo(W*.6+i,H-70);x.lineTo(W*.6+i,H-50);x.stroke()}
  } else {
    let g=x.createLinearGradient(0,0,0,fy);g.addColorStop(0,'#fff4e6');g.addColorStop(1,'#ffd8a8');x.fillStyle=g;x.fillRect(0,0,W,fy);
    // Ziegel
    x.strokeStyle='rgba(201,120,40,.18)';x.lineWidth=2;
    for(let j=0,r=0;j<fy;j+=36,r++){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke();for(let i=(r%2)*40;i<W;i+=80){x.beginPath();x.moveTo(i,j);x.lineTo(i,j+36);x.stroke()}}
    // Werkzeugwand
    const bw=Math.min(380,W*.34),bx=W-bw-30,by=110,bh=Math.min(170,fy-by-40);
    if(bh>60){x.fillStyle='#c48a3a';rr(x,bx,by,bw,bh,14);x.fill();x.fillStyle='rgba(0,0,0,.18)';
      for(let i=bx+16;i<bx+bw-8;i+=22)for(let j=by+16;j<by+bh-8;j+=22){x.beginPath();x.arc(i,j,2.5,0,7);x.fill()}
      x.fillStyle='#000';x.font=`46px ${EMO}`;x.textAlign='center';x.textBaseline='middle';x.globalAlpha=.85;
      ['🔧','🔨','🪛','🪚','🧰'].forEach((e,i)=>x.fillText(e,bx+bw*(i+.5)/5,by+bh/2));x.globalAlpha=1}
    x.fillStyle='#e8590c';rr(x,30,108,240,46,23);x.fill();
    x.fillStyle='#fff';x.font='bold 24px "Arial Rounded MT Bold",system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText('🔧 WERKSTATT 🔧',150,132);
    g=x.createLinearGradient(0,fy,0,H);g.addColorStop(0,'#868e96');g.addColorStop(1,'#495057');x.fillStyle=g;x.fillRect(0,fy,W,H-fy);
    for(let i=-40;i<W;i+=40){x.fillStyle=(i/40)%2?'#ffd43b':'#2b2d42';x.beginPath();x.moveTo(i,fy);x.lineTo(i+40,fy);x.lineTo(i+30,fy+12);x.lineTo(i-10,fy+12);x.fill()}
    x.fillStyle='rgba(0,0,0,.22)';x.beginPath();x.ellipse(W*.72,H-50,70,16,0,0,7);x.fill();
  }
}

/* ================= Spielstart ================= */
async function startGame(mode,def){
  stopGame();show(null);
  const color=store.d.colors[def.id]||def.color;
  const [img,chImg]=await Promise.all([svgImage(vehSVG(def,color)),svgImage(charSVG(curChar()))]);
  const g={mode,def,color,img,chImg,steps:mode==='wash'?WASH:REPAIR,si:-1,phase:'enter',pt:0,offX:0,offY:0,rot:0,
    layers:{},order:mode==='wash'?['dirt','foam','drops','polish']:['rust','cracks','paint'],clip:new Set(),
    dents:[],screws:[],slots:[],stickers:[],fuel:0,progress:0,shiny:false,idle:0,cheer:0,smokeT:0,toolHit:0,travel:0,
    selSticker:STICKERS[0],paintColor:PALETTE[0],drag:null,holding:false,glugT:0,lastM:0,mDirty:false,initSum:null,hint:null,resaid:false,t:0};
  G=g;resize();setupMask();
  if(mode==='wash')genDirt();else genDamage();
  buildHUD();updSoundBtn();
  sfx(def.move==='launch'?'whoosh':def.move==='fly'?'fly':'vroom');
}
function setupMask(){
  const d=G.def;const mc=mk(d.w*LS,d.h*LS);mc.getContext('2d').drawImage(G.img,0,0,mc.width,mc.height);G.maskC=mc;
  const sw=Math.round(d.w/5),sh=Math.round(d.h/5),sc=mk(sw,sh),sx=sc.getContext('2d',{willReadFrequently:true});
  sx.drawImage(G.img,0,0,sw,sh);let a=null;
  try{a=sx.getImageData(0,0,sw,sh).data;G.canRead=true}catch(e){G.canRead=false}
  const m=new Uint8Array(sw*sh);let cnt=0;for(let i=0;i<m.length;i++){m[i]=a?(a[i*4+3]>128?1:0):1;cnt+=m[i]}
  G.sm={c:sc,x:sx,w:sw,h:sh,m,cnt:Math.max(1,cnt),k:sw/d.w};
  G.cov=mk(sw,sh);G.covX=G.cov.getContext('2d',{willReadFrequently:true});G.covX.setTransform(G.sm.k,0,0,G.sm.k,0,0);G.covX.fillStyle='#000';
}
function clearCov(){G.covX.save();G.covX.setTransform(1,0,0,1,0,0);G.covX.clearRect(0,0,G.cov.width,G.cov.height);G.covX.restore()}
function inMask(x,y){const s=G.sm,d=G.def;if(x<0||y<0||x>=d.w||y>=d.h)return false;return s.m[Math.floor(y*s.k)*s.w+Math.floor(x*s.k)]===1}
function samplePts(n,margin,minD,avoid=[]){
  const d=G.def,out=[];let tries=0;
  while(out.length<n&&tries<6000){tries++;if(tries%1500===0){margin*=.65;minD*=.75}
    const x=rand(4,d.w-4),y=rand(4,d.h-4);
    if(!(inMask(x,y)&&inMask(x-margin,y)&&inMask(x+margin,y)&&inMask(x,y-margin)&&inMask(x,y+margin)))continue;
    if(out.concat(avoid).some(p=>Math.hypot(p.x-x,p.y-y)<minD))continue;out.push({x,y})}
  return out;
}
function newLayer(name){const d=G.def,c=mk(d.w*LS,d.h*LS),x=c.getContext('2d');x.setTransform(LS,0,0,LS,0,0);return G.layers[name]={c,x,a:1,fade:false}}
function clipLayer(L){const x=L.x;x.save();x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='destination-in';x.drawImage(G.maskC,0,0);x.restore()}
function fadeLayer(n){if(G.layers[n])G.layers[n].fade=true}
function blob(x,cx,cy,r,col,alpha=.92){x.fillStyle=col;x.globalAlpha=alpha;for(let i=0;i<8;i++){const a=rand(0,6.283),dd=rand(0,r*.6);x.beginPath();x.arc(cx+Math.cos(a)*dd,cy+Math.sin(a)*dd,r*rand(.35,.6),0,7);x.fill()}x.globalAlpha=1}

/* ---- Waschanlage: Dreck ---- */
function genDirt(){
  const L=newLayer('dirt'),x=L.x,d=G.def,sz=Math.min(d.w,d.h);
  const g=x.createLinearGradient(0,d.h,0,d.h*.3);g.addColorStop(0,'rgba(96,62,28,.9)');g.addColorStop(1,'rgba(96,62,28,.12)');x.fillStyle=g;x.fillRect(0,0,d.w,d.h);
  samplePts(16,4,sz*.11).forEach(p=>blob(x,p.x,p.y,rand(.08,.16)*sz,pick(['#7a5230','#8b5e34','#6b4423','#9c6b3c'])));
  samplePts(70,1,0).forEach(p=>{x.fillStyle=pick(['#6b4423','#8b5e34']);x.beginPath();x.arc(p.x,p.y,rand(2,6)*sz/300,0,7);x.fill()});
  x.fillStyle='#000';x.font=`${sz*.11}px ${EMO}`;x.textAlign='center';x.textBaseline='middle';
  samplePts(4,sz*.05,sz*.2).forEach((p,i)=>{x.save();x.translate(p.x,p.y);x.rotate(rand(-1,1));x.fillText(['🍂','🍃','🍂','🪶'][i],0,0);x.restore()});
  clipLayer(L);
}
function bubbleDraw(x,cx,cy,r){
  x.fillStyle='rgba(255,255,255,.95)';x.beginPath();x.arc(cx,cy,r,0,7);x.fill();
  x.strokeStyle='rgba(116,192,252,.85)';x.lineWidth=Math.max(1,r*.13);x.stroke();
  x.fillStyle='rgba(208,235,255,.9)';x.beginPath();x.arc(cx+r*.25,cy+r*.25,r*.45,0,7);x.fill();
}
function fillFoam(){
  const L=G.layers.foam;if(!L)return;const d=G.def,sp=Math.min(d.w,d.h)*.05;
  for(let y=0;y<d.h;y+=sp)for(let x=0;x<d.w;x+=sp){const px=x+rand(-sp*.4,sp*.4),py=y+rand(-sp*.4,sp*.4);if(inMask(px,py)||inMask(px+sp*.5,py)||inMask(px,py+sp*.5))bubbleDraw(L.x,px,py,rand(sp*.5,sp*.9))}
  clipLayer(L);
}
function genDrops(){
  const L=newLayer('drops'),x=L.x,d=G.def,sz=Math.min(d.w,d.h);
  x.fillStyle='rgba(116,192,252,.22)';x.fillRect(0,0,d.w,d.h);
  samplePts(80,1,sz*.04).forEach(p=>{const r=rand(5,12)*sz/300;
    x.fillStyle='rgba(116,192,252,.9)';x.beginPath();x.ellipse(p.x,p.y,r,r*1.25,0,0,7);x.fill();
    x.strokeStyle='rgba(255,255,255,.95)';x.lineWidth=r*.25;x.stroke();
    x.fillStyle='#fff';x.beginPath();x.arc(p.x-r*.35,p.y-r*.4,r*.3,0,7);x.fill()});
  clipLayer(L);
}
/* ---- Werkstatt: Schäden ---- */
function genDamage(){
  const d=G.def,sz=Math.min(d.w,d.h);
  G.slots=d.slots.map(([x,y,r,t])=>({x,y,r,t,fixed:false,pop:0}));
  const avoid=G.slots.map(s=>({x:s.x,y:s.y})).concat([{x:d.fuelPos[0],y:d.fuelPos[1]}]);
  // Rost & stumpfer Lack
  const R=newLayer('rust'),rx=R.x;rx.fillStyle='rgba(110,100,90,.38)';rx.fillRect(0,0,d.w,d.h);
  samplePts(8,2,sz*.15).forEach(p=>{blob(rx,p.x,p.y,rand(.07,.13)*sz,pick(['#b5651d','#a0522d','#c47a2c']),.85);
    for(let i=0;i<10;i++){rx.fillStyle='rgba(70,35,10,.6)';rx.beginPath();rx.arc(p.x+rand(-.1,.1)*sz,p.y+rand(-.1,.1)*sz,rand(1,3.5)*sz/300,0,7);rx.fill()}});
  clipLayer(R);
  // Beulen
  G.dents=samplePts(3,sz*.08,sz*.26,avoid).map(p=>({...p,r:sz*.08,hits:0,need:3,done:false,wob:0}));
  // Schrauben
  G.screws=samplePts(4,sz*.04,sz*.17,avoid.concat(G.dents)).map(p=>({...p,r:sz*.038,done:false,spin:false,anim:0,rot:rand(0,3),ct:0}));
  // Risse
  const C=newLayer('cracks'),cx=C.x;cx.strokeStyle='#1d1f24';cx.lineCap='round';cx.lineJoin='round';
  samplePts(3,sz*.06,sz*.22,avoid).forEach(p=>{
    let x=p.x,y=p.y,a=rand(0,6.283);const seg=sz*.045;
    cx.lineWidth=sz*.018;cx.beginPath();cx.moveTo(x,y);
    for(let i=0;i<6;i++){a+=rand(-.9,.9);x+=Math.cos(a)*seg;y+=Math.sin(a)*seg;cx.lineTo(x,y);
      if(i===2){cx.stroke();cx.lineWidth=sz*.01;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+Math.cos(a+1.3)*seg*1.3,y+Math.sin(a+1.3)*seg*1.3);cx.stroke();cx.lineWidth=sz*.018;cx.beginPath();cx.moveTo(x,y)}}
    cx.stroke()});
  clipLayer(C);
}

/* ================= HUD & Ablage ================= */
let hudCache='';
function buildHUD(){const box=$('#steps');box.innerHTML='';hudCache='';G.steps.forEach(s=>{const e=document.createElement('div');e.className='step';e.innerHTML=`<i>${s.icon}</i>`;box.appendChild(e)})}
function updateHUD(){
  if(!G)return;const p=Math.round(clamp(G.progress,0,1)*40)/40;const key=G.si+'|'+p+'|'+G.phase;if(key===hudCache)return;hudCache=key;
  [...$('#steps').children].forEach((e,i)=>{const done=i<G.si||(i===G.si&&G.phase!=='play'&&G.phase!=='enter')||G.si>=G.steps.length;
    e.classList.toggle('done',done);e.classList.toggle('cur',i===G.si&&!done);
    e.style.background=(i===G.si&&!done)?`conic-gradient(#51cf66 ${p*360}deg,#fff 0)`:''});
}
function setTray(st){
  const tr=$('#tray');tr.innerHTML='';tr.classList.remove('on');if(!st)return;
  if(st.type==='paint'&&st.id==='paint'){
    PALETTE.forEach(c=>{const b=document.createElement('button');b.className='sw'+(c===G.paintColor?' sel':'');b.style.background=c;
      b.onpointerdown=e=>{e.preventDefault();initAudio();sfx('pop');G.paintColor=c;tr.querySelectorAll('.sw').forEach(s=>s.classList.toggle('sel',s===b))};tr.appendChild(b)});
    tr.classList.add('on');
  } else if(st.type==='drag'){
    G.slots.forEach((s,i)=>{if(s.fixed)return;const b=document.createElement('div');b.className='tItem';b.dataset.i=i;
      b.innerHTML=s.t==='wheel'?`<svg viewBox="-60 -60 120 120">${wh(0,0,52)}</svg>`:'⚙️';
      b.onpointerdown=e=>{e.preventDefault();initAudio();sfx('pop');G.drag={kind:'part',i,x:e.clientX,y:e.clientY,el:b};b.classList.add('gone');G.idle=0};
      tr.appendChild(b)});
    tr.classList.add('on');
  } else if(st.type==='sticker'){
    STICKERS.forEach(ch=>{const b=document.createElement('div');b.className='tItem'+(ch===G.selSticker?' sel':'');b.textContent=ch;
      b.onpointerdown=e=>{e.preventDefault();initAudio();sfx('squeak');G.selSticker=ch;tr.querySelectorAll('.tItem').forEach(s=>s.classList.toggle('sel',s===b));G.drag={kind:'sticker',ch,x:e.clientX,y:e.clientY,el:b,sx:e.clientX,sy:e.clientY};G.idle=0};
      tr.appendChild(b)});
    const ok=document.createElement('button');ok.className='okBtn';ok.textContent='✔';

function nextStep(){

  if(G.si>=G.steps.length){finale();return}
  const st=step();G.phase='play';G.pt=0;clearCov();
  if(st.id==='foam')newLayer('foam');

  setTray(st);

}
function completeStep(){

/* ================= Messen ================= */
function brushR(){return clamp(56/G.s,12,95)}
function measure(){
  G.mDirty=false;G.lastM=G.t;const st=step();if(!st)return;const sm=G.sm;
  if(!G.canRead){const need=(G.def.w*G.def.h*.5)/(brushR()*1.6);G.progress=clamp(G.travel/need,0,1);return}
  try{
    if(st.type==='erase'){
      const L=G.layers[st.layer];if(!L){G.progress=1;return}
      sm.x.clearRect(0,0,sm.w,sm.h);sm.x.drawImage(L.c,0,0,sm.w,sm.h);
      const a=sm.x.getImageData(0,0,sm.w,sm.h).data;let sum=0;const cand=[];
      for(let i=0;i<sm.m.length;i++){const v=a[i*4+3];sum+=v;if(v>110&&i%3===0)cand.push(i)}
      if(G.initSum==null)G.initSum=Math.max(1,sum);G.progress=clamp(1-sum/G.initSum,0,1);
      G.hint=cand.length?idxToLocal(pick(cand)):null;
    } else if(st.type==='paint'){
      const a=G.covX.getImageData(0,0,sm.w,sm.h).data;let c=0;const cand=[];
      for(let i=0;i<sm.m.length;i++)if(sm.m[i]){if(a[i*4+3]>60)c++;else if(i%3===0)cand.push(i)}
      G.progress=c/sm.cnt;G.hint=cand.length?idxToLocal(pick(cand)):null;
    }
  }catch(e){G.canRead=false}
}
function idxToLocal(i){const s=G.sm;return{x:(i%s.w+.5)/s.k,y:(Math.floor(i/s.w)+.5)/s.k}}

function brush(ax,ay,bx,by){
  const st=step(),br=brushR();const dist=Math.hypot(bx-ax,by-ay);G.travel+=dist;
  if(st.type==='erase'){
    const L=G.layers[st.layer];if(!L)return;const x=L.x;x.save();x.globalCompositeOperation='destination-out';x.lineCap='round';x.lineJoin='round';
    x.lineWidth=br*2*(st.id==='weld'?.8:1);x.strokeStyle='#000';x.beginPath();x.moveTo(ax,ay);x.lineTo(bx+.01,by);x.stroke();x.restore();
  } else {
    const L=G.layers[st.layer];if(!L)return;const x=L.x;const n=Math.max(1,Math.ceil(dist/(br*.3)));
    for(let i=0;i<=n;i++){const t=i/n,px=ax+(bx-ax)*t,py=ay+(by-ay)*t;
      if(st.id==='foam'){for(let k=0;k<3;k++){const a=rand(0,6.283),r=rand(0,br*.85);bubbleDraw(x,px+Math.cos(a)*r,py+Math.sin(a)*r,rand(br*.18,br*.42))}}
      else if(st.id==='polish'){const g=x.createRadialGradient(px,py,0,px,py,br);g.addColorStop(0,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,br,0,7);x.fill()}
      else if(st.id==='paint'){x.fillStyle=G.paintColor;x.globalAlpha=.5;x.beginPath();x.arc(px,py,br*.78,0,7);x.fill();x.globalAlpha=1;
        for(let k=0;k<12;k++){const a=rand(0,6.283),r=Math.sqrt(Math.random())*br;x.beginPath();x.arc(px+Math.cos(a)*r,py+Math.sin(a)*r,rand(1.5,4),0,7);x.fill()}}
      G.covX.beginPath();G.covX.arc(px,py,br*.9,0,7);G.covX.fill();
    }
    G.clip.add(st.layer);
  }

}

function onDown(){
  const st=step();if(!st)return;G.idle=0;P.lastT=G.t;const [lx,ly]=toLocal(P.x,P.y);

function onMove(){
  const st=step();if(!st)return;G.idle=0;P.lastT=G.t;
  if(st.type==='erase'||st.type==='paint'){const [lx,ly]=toLocal(P.x,P.y);brush(P.lx,P.ly,lx,ly);
    const d=Math.hypot(lx-P.lx,ly-P.ly)*G.s;G.fxAcc=(G.fxAcc||0)+d;while(G.fxAcc>10){G.fxAcc-=10;emitFx(st.fx,P.x,P.y)}P.lx=lx;P.ly=ly;P.lastMove=G.t}

function tapTargets(st){
  G.toolHit=.18;
  const list=st.target==='dents'?G.dents:G.screws;let best=null,bd=1e9;
  for(const t of list){if(t.done||t.spin)continue;const [sx,sy]=toScreen(t.x,t.y);const dd=Math.hypot(sx-P.x,sy-P.y);const hr=Math.max(t.r*G.s*1.6,56);if(dd<hr&&dd<bd){bd=dd;best=t}}
  if(!best){sfx('tap');return}

    if(best.hits>=best.need){best.done=true;sfx('pop');burst(sx,sy,14,'#fff')}}
  else{best.spin=true;best.anim=0}

}

/* ================= Update ================= */
function moveOffsets(k,dir){
  const m=G.def.move;G.rot=0;
  if(m==='drive'||m==='float'){G.offX=dir==='in'?-k*(G.vx+G.vw+80):k*(W-G.vx+80);G.offY=0;G.rot=Math.sin(G.t*30)*.006*(k>0&&k<1?1:0)}
  else if(m==='fly'){G.offX=dir==='in'?-k*(G.vx+G.vw+80):k*(W-G.vx+80);G.offY=-k*(G.vy+G.vh+80)*.8;G.rot=dir==='in'?k*.18:-k*.22}
  else{G.offX=k>0&&k<1?rand(-2,2):0;G.offY=-k*(G.vy+G.vh+120)}
}
function update(dt,t){
  G.t=t;G.pt+=dt;if(G.cheer>0)G.cheer-=dt;if(G.toolHit>0)G.toolHit-=dt;
  const st=step();
  if(G.phase==='enter'){const k=clamp(G.pt/1.5,0,1);moveOffsets(1-ease(k),'in');vehicleFx(true);if(k>=1){G.offX=G.offY=G.rot=0;nextStep()}}
  else if(G.phase==='stepdone'){if(G.pt>1.5)nextStep()}
  else if(G.phase==='celebrate'){if(Math.random()<.6)confetti();if(G.pt>2.6){G.phase='exit';G.pt=0;sfx(G.def.move==='launch'?'whoosh':G.def.move==='fly'?'fly':'vroom')}}
  else if(G.phase==='exit'){const k=clamp(G.pt/2,0,1);moveOffsets(easeIn(k),'out');vehicleFx(false);if(k>=1&&!G.shownDone){G.shownDone=true;showDone()}}
  else if(G.phase==='play'){
    G.idle+=dt;
    if(st.type==='hold'&&G.holding){G.idle=0;G.fuel=Math.min(1,G.fuel+dt*.3);G.progress=G.fuel;G.glugT-=dt;
      if(G.glugT<=0){G.glugT=.2;sfx('glug');const [fx,fy]=toScreen(...G.def.fuelPos);parts.push({type:'bubble',x:fx+rand(-10,10),y:fy,vx:rand(-30,30),vy:rand(-120,-60),g:-10,life:1,max:1,size:rand(6,12)})}
      if(G.fuel>=1)completeStep()}
    if(st.type==='tap'&&st.target==='screws'){
      G.screws.forEach(s=>{if(!s.spin)return;s.anim+=dt/.7;s.rot+=dt*14;s.ct-=dt;if(s.ct<=0){s.ct=.07;sfx('click')}
        if(s.anim>=1){s.spin=false;s.done=true;s.anim=1;sfx('snap');const [sx,sy]=toScreen(s.x,s.y);burst(sx,sy,10);
          G.progress=G.screws.filter(x=>x.done).length/G.screws.length}});
    }
    if(st.type==='tap'){const list=st.target==='dents'?G.dents:G.screws;if(list.length&&list.every(x=>x.done)&&G.pt>.2)completeStep();else if(!list.length)completeStep()}
    if(G.mDirty&&t-G.lastM>.15)measure();
    if(G.phase==='play'){
      if(st.type==='erase'&&G.progress>=.9)completeStep();
      else if(st.type==='paint'&&G.progress>=.8)completeStep();
    }
    if(G.idle>9&&!G.resaid){G.resaid=true;say(G.instr);bubble(G.instr)}
  }
  const s2=step();const active=G.phase==='play'&&P.down&&s2&&s2.snd&&(t-P.lastMove<.12);setLoop(s2&&s2.snd,!!active);
  for(const k in G.layers){const L=G.layers[k];if(L.fade){L.a-=dt*1.6;if(L.a<=0)delete G.layers[k]}}
  G.clip.forEach(n=>{if(G.layers[n])clipLayer(G.layers[n])});G.clip.clear();
  G.dents.forEach(d=>{if(d.wob>0)d.wob=Math.max(0,d.wob-dt*4)});
  G.slots.forEach(s=>{if(s.pop>0)s.pop=Math.max(0,s.pop-dt*2.5)});
  G.stickers.forEach(s=>{if(s.sc<1)s.sc=Math.min(1,s.sc+dt*5)});
  if(G.mode==='repair'&&(G.phase==='play'||G.phase==='stepdone')){G.smokeT-=dt;if(G.smokeT<=0){G.smokeT=.5;
    G.slots.forEach(s=>{if(s.fixed||s.t!=='gear')return;const [sx,sy]=toScreen(s.x,s.y);parts.push({type:'smoke',x:sx,y:sy,vx:rand(-10,10),vy:rand(-50,-30),g:0,life:1.6,max:1.6,size:rand(10,16)})})}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.vr)p.rot+=p.vr*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1)}
  updateHUD();
}

/* ================= Zeichnen ================= */
function render(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);

  if(G.mode==='repair'){const y=G.floorY,x0=G.vx-24,x1=G.vx+G.vw+24,mx=(x0+x1)/2;
    ctx.fillStyle='#ffd43b';ctx.fillRect(mx-24,y+8,48,Math.max(0,H-y));ctx.fillStyle='#2b2d42';for(let j=y+14;j<H;j+=28){ctx.beginPath();ctx.moveTo(mx-24,j);ctx.lineTo(mx+24,j+14);ctx.lineTo(mx+24,j+22);ctx.lineTo(mx-24,j+8);ctx.fill()}
    ctx.fillStyle='#868e96';rr(ctx,x0,y-2,x1-x0,16,8);ctx.fill();ctx.strokeStyle=K;ctx.lineWidth=3;ctx.stroke()}
  else{ctx.fillStyle='rgba(116,192,252,.45)';ctx.beginPath();ctx.ellipse(G.vx+G.vw/2,G.floorY+4,G.vw*.55,14,0,0,7);ctx.fill()}

  if(G.offY>-20){ctx.fillStyle='rgba(0,0,0,.16)';ctx.beginPath();ctx.ellipse(ox+G.vw/2,G.floorY+2,G.vw*.45,10,0,0,7);ctx.fill()}
  // Fahrzeug
  ctx.save();ctx.translate(ox+G.vw/2,oy+G.vh/2);ctx.rotate(G.rot||0);ctx.translate(-G.vw/2,-G.vh/2);ctx.scale(s,s);
  ctx.drawImage(G.img,0,0,d.w,d.h);
  for(const n of G.order){const L=G.layers[n];if(!L)continue;ctx.globalAlpha=Math.max(0,L.a)*(n==='polish'?.3:1);ctx.drawImage(L.c,0,0,d.w,d.h)}ctx.globalAlpha=1;
  if(G.mode==='repair'){G.dents.forEach(drawDent);G.screws.forEach(drawScrew);G.slots.forEach(s=>drawSlot(s,t))}
  G.stickers.forEach(st=>{ctx.save();ctx.translate(st.x,st.y);ctx.rotate(st.rot);const sz=Math.min(d.w,d.h)*.2*(st.sc<1?ease(st.sc)*1.15:1);ctx.fillStyle='#000';ctx.font=`${sz}px ${EMO}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(st.ch,0,0);ctx.restore()});
  if(G.shiny)drawShine(t);
  const st=step();
  if(G.phase==='play'&&st&&st.type==='hold'){const [fx,fy]=G.def.fuelPos;const pr=1+Math.sin(t*6)*.12;ctx.strokeStyle='#fff';ctx.lineWidth=5/s*2;ctx.setLineDash([8,8]);ctx.beginPath();ctx.arc(fx,fy,26*pr,0,7);ctx.stroke();ctx.setLineDash([])}
  if(G.phase==='play'&&st&&st.type==='tap'){const list=st.target==='dents'?G.dents:G.screws;const pr=1+Math.sin(t*6)*.1;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3;ctx.setLineDash([6,6]);list.forEach(o=>{if(o.done)return;ctx.beginPath();ctx.arc(o.x,o.y,o.r*1.35*pr,0,7);ctx.stroke()});ctx.setLineDash([])}
  ctx.restore();
  drawChar(t);
  drawParticles();
  if(G.phase==='play'&&st&&st.type==='hold')drawGauge();
  drawTool(t);
  drawDrag();
  drawHint(t);
}
function drawDent(c){
  if(c.done)return;const k=1-c.hits/c.need,r=c.r*(.55+.45*k)*(1+c.wob*.2);
  const g=ctx.createRadialGradient(c.x+r*.15,c.y+r*.15,r*.05,c.x,c.y,r);g.addColorStop(0,'rgba(0,0,0,.5)');g.addColorStop(.65,'rgba(0,0,0,.2)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(c.x,c.y,r,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=r*.13;ctx.lineCap='round';ctx.beginPath();ctx.arc(c.x,c.y,r*.72,.15*Math.PI,.85*Math.PI);ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=r*.08;ctx.beginPath();ctx.arc(c.x,c.y,r*.72,1.15*Math.PI,1.85*Math.PI);ctx.stroke();
}
function drawScrew(sc){
  const out=sc.done?0:1-ease(clamp(sc.anim,0,1)),r=sc.r*(1+.35*out),wob=sc.done||sc.spin?0:Math.sin(G.t*8+sc.x)*.25;
  ctx.save();ctx.translate(sc.x,sc.y);
  if(out>0){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.arc(r*.35*out,r*.55*out,r,0,7);ctx.fill()}
  ctx.rotate(sc.rot+wob);
  const g=ctx.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);g.addColorStop(0,'#f8f9fa');g.addColorStop(1,'#868e96');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.strokeStyle=K;ctx.lineWidth=Math.max(2,r*.15);ctx.stroke();
  ctx.lineWidth=Math.max(2,r*.22);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-r*.55,0);ctx.lineTo(r*.55,0);ctx.moveTo(0,-r*.55);ctx.lineTo(0,r*.55);ctx.stroke();
  ctx.restore();
}
function drawSlot(s,t){
  if(s.fixed){if(s.pop>0){ctx.strokeStyle=`rgba(255,255,255,${s.pop})`;ctx.lineWidth=6;ctx.beginPath();ctx.arc(s.x,s.y,s.r*(1.6-s.pop*.5),0,7);ctx.stroke()}return}
  const r=s.r;
  if(s.t==='wheel'){
    ctx.fillStyle='#5c636a';ctx.beginPath();ctx.moveTo(s.x-r*1.06,s.y+r*.75);ctx.quadraticCurveTo(s.x-r*1.15,s.y-r*1.05,s.x,s.y-r*1.02);ctx.quadraticCurveTo(s.x+r*1.15,s.y-r*1.05,s.x+r*1.1,s.y+r*.75);ctx.quadraticCurveTo(s.x,s.y+r*1.15,s.x-r*1.06,s.y+r*.75);ctx.fill();
    ctx.strokeStyle=K;ctx.lineWidth=Math.max(3,r*.1);ctx.stroke();
    ctx.save();ctx.translate(s.x,s.y+r*.1);ctx.rotate(.4);ctx.fillStyle='#adb5bd';ctx.beginPath();ctx.ellipse(0,0,r*.5,r*.32,0,0,7);ctx.fill();ctx.stroke();ctx.restore();
    ctx.strokeStyle='#1d1f24';ctx.lineWidth=Math.max(2,r*.06);ctx.beginPath();ctx.moveTo(s.x-r*.8,s.y-r*.3);ctx.lineTo(s.x-r*.55,s.y-r*.1);ctx.lineTo(s.x-r*.7,s.y+r*.15);ctx.stroke();
    ctx.fillStyle='#000';ctx.font=`${r*.6}px ${EMO}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('💥',s.x+r*.6,s.y-r*.6);
  } else {
    const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,r*1.2);g.addColorStop(0,'#111');g.addColorStop(.6,'#2b2b2b');g.addColorStop(1,'rgba(40,40,40,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,r*1.2,0,7);ctx.fill();
    ctx.strokeStyle='#111';ctx.lineWidth=Math.max(2,r*.08);for(let i=0;i<6;i++){const a=i*1.05+.3;ctx.beginPath();ctx.moveTo(s.x+Math.cos(a)*r*.8,s.y+Math.sin(a)*r*.8);ctx.lineTo(s.x+Math.cos(a+.2)*r*1.4,s.y+Math.sin(a+.2)*r*1.4);ctx.stroke()}
  }
  if(G.phase==='play'&&step()&&step().type==='drag'){const pr=1+Math.sin(t*6)*.1;ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(3,r*.1);ctx.setLineDash([r*.3,r*.25]);ctx.beginPath();ctx.arc(s.x,s.y,r*1.3*pr,0,7);ctx.stroke();ctx.setLineDash([])}
}
function drawShine(t){
  const w=G.maskC.width,h=G.maskC.height;if(!G.shineC){G.shineC=mk(w,h);G.shineX=G.shineC.getContext('2d')}
  const p=((t*.55)%2.4)-.4;if(p<-.25||p>1.25)return;
  const x=G.shineX;x.globalCompositeOperation='source-over';x.clearRect(0,0,w,h);x.drawImage(G.maskC,0,0);x.globalCompositeOperation='source-in';
  const g=x.createLinearGradient(0,0,w,h*.6);const a=clamp(p-.09,0,1),b=clamp(p,0,1),c=clamp(p+.09,0,1);
  g.addColorStop(a,'rgba(255,255,255,0)');g.addColorStop(b,'rgba(255,255,255,.75)');g.addColorStop(c,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,w,h);
  ctx.drawImage(G.shineC,0,0,G.def.w,G.def.h);
}
function drawChar(t){
  const h=G.chH,w=G.chW,x=G.chX,b=G.chB;
  const working=(P.down||G.holding)&&G.phase==='play';
  const jump=G.cheer>0?-Math.abs(Math.sin(G.cheer*7))*h*.14:0;
  const sq=Math.sin(t*3)*.025;
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(x+w/2,b-4,w*.36,10,0,0,7);ctx.fill();
  ctx.save();ctx.translate(x+w/2,b+jump);ctx.rotate(working?Math.sin(t*16)*.05:(G.cheer>0?Math.sin(G.cheer*14)*.08:0));ctx.scale(1+sq,1-sq);
  ctx.drawImage(G.chImg,-w/2,-h,w,h);ctx.restore();
}
function drawParticles(){
  for(const p of parts){const a=clamp(p.life/p.max,0,1);ctx.globalAlpha=a;
    switch(p.type){
      case 'drop':ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();break;
      case 'bubble':ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=2;ctx.fillStyle='rgba(208,235,255,.35)';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x-p.size*.35,p.y-p.size*.35,p.size*.22,0,7);ctx.fill();break;
      case 'wind':ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.size,p.y);ctx.stroke();break;
      case 'spark':ctx.strokeStyle=p.color;ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.03,p.y-p.vy*.03);ctx.stroke();break;
      case 'glint':star4(p.x,p.y,p.size*(.5+a*.5),'#fff');break;
      case 'star':ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);star5(0,0,p.size,p.color);ctx.restore();break;
      case 'confetti':ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);ctx.restore();break;
      case 'smoke':ctx.globalAlpha=a*.5;ctx.fillStyle='#ced4da';ctx.beginPath();ctx.arc(p.x,p.y,p.size*(2-a),0,7);ctx.fill();break;
      case 'fire':{const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size);g.addColorStop(0,'#fff3bf');g.addColorStop(.4,'#ffd43b');g.addColorStop(1,'rgba(255,107,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();break}
    }}
  ctx.globalAlpha=1;
}
function star5(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();for(let i=0;i<10;i++){const rr2=i%2?r*.45:r,a=i*Math.PI/5-Math.PI/2;ctx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2)}ctx.closePath();ctx.fill()}
function star4(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.quadraticCurveTo(x,y,x,y+r);ctx.quadraticCurveTo(x,y,x-r,y);ctx.quadraticCurveTo(x,y,x,y-r);ctx.fill()}
function drawGauge(){
  const gw=56,gh=Math.min(220,H*.3),gx=W-gw-28,gy=118;
  ctx.fillStyle='#fff';rr(ctx,gx-8,gy-56,gw+16,gh+72,22);ctx.fill();ctx.strokeStyle=K;ctx.lineWidth=4;ctx.stroke();
  ctx.fillStyle='#000';ctx.font=`40px ${EMO}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⛽',gx+gw/2,gy-26);
  ctx.fillStyle='#e9ecef';rr(ctx,gx,gy,gw,gh,14);ctx.fill();
  const fh=gh*G.fuel;ctx.save();rr(ctx,gx,gy,gw,gh,14);ctx.clip();const g=ctx.createLinearGradient(0,gy+gh,0,gy);g.addColorStop(0,'#2f9e44');g.addColorStop(1,'#8ce99a');ctx.fillStyle=g;ctx.fillRect(gx,gy+gh-fh,gw,fh);ctx.restore();
  ctx.strokeStyle=K;ctx.lineWidth=4;rr(ctx,gx,gy,gw,gh,14);ctx.stroke();
}
function toolPos(t){
  const st=step();const spin=G.screws.find(s=>s.spin);
  if(st.type==='hold'){const [fx,fy]=toScreen(...G.def.fuelPos);return [fx+18,fy-18,G.holding?Math.sin(t*30)*.1:Math.sin(t*3)*.1]}
  if(spin){const [sx,sy]=toScreen(spin.x,spin.y);return [sx,sy,Math.sin(t*40)*.35]}
  if(P.down||t-P.lastT<1.6){const mv=t-P.lastMove<.12;return [P.x,P.y,mv?Math.sin(t*22)*.15:0]}
  return [G.chX+G.chW*.92,G.chB-G.chH*.3,Math.sin(t*2.5)*.12];
}
function drawTool(t){
  const st=step();if(!st||!st.tool||(G.phase!=='play'&&G.phase!=='stepdone'))return;
  let [x,y,rot]=toolPos(t);if(st.type==='tap'&&G.toolHit>0)rot-=G.toolHit*4;
  if(st.id==='weld'&&P.down){const g=ctx.createRadialGradient(x,y,0,x,y,46);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.3,'rgba(165,216,255,.6)');g.addColorStop(1,'rgba(165,216,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,46,0,7);ctx.fill()}
  const sz=78;ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.font=`${sz}px ${EMO}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(sz*.28,-sz*.28,sz*.55,0,7);ctx.fill();ctx.fillStyle='#000';ctx.fillText(st.tool,sz*.28,-sz*.28);ctx.restore();
}
function drawPart(type,x,y,r){
  ctx.save();ctx.translate(x,y);
  if(type==='wheel'){ctx.fillStyle='#343a40';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.strokeStyle=K;ctx.lineWidth=r*.1;ctx.stroke();ctx.fillStyle='#dee2e6';ctx.beginPath();ctx.arc(0,0,r*.52,0,7);ctx.fill();ctx.lineWidth=r*.07;ctx.stroke();ctx.fillStyle='#868e96';ctx.beginPath();ctx.arc(0,0,r*.16,0,7);ctx.fill()}
  else{ctx.fillStyle='#000';ctx.font=`${r*2}px ${EMO}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⚙️',0,0)}
  ctx.restore();
}
function drawDrag(){
  const d=G.drag;if(!d)return;
  if(d.kind==='part'){const s=G.slots[d.i];drawPart(s.t,d.x,d.y-20,Math.max(s.r*G.s,34))}
  else{ctx.fillStyle='#000';ctx.font=`70px ${EMO}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(d.ch,d.x,d.y-30)}
}
function drawHint(t){
  if(G.phase!=='play'||G.idle<4||P.down||G.drag)return;const st=step();let hx=null,hy=null;
  if(st.type==='tap'){const o=(st.target==='dents'?G.dents:G.screws).find(o=>!o.done&&!o.spin);if(o)[hx,hy]=toScreen(o.x,o.y)}
  else if(st.type==='hold')[hx,hy]=toScreen(...G.def.fuelPos);
  else if(st.type==='sticker')[hx,hy]=toScreen(G.def.w/2,G.def.h/2);
  else if(st.type==='drag'){const el=$('#tray .tItem:not(.gone)');const s=el&&G.slots[+el.dataset.i];if(el&&s){const r=el.getBoundingClientRect();const [tx,ty]=toScreen(s.x,s.y);const k=ease((t*.6)%1);hx=r.left+r.width/2+(tx-r.left-r.width/2)*k;hy=r.top+r.height/2+(ty-r.top-r.height/2)*k}}
  else if(G.hint)[hx,hy]=toScreen(G.hint.x,G.hint.y);
  if(hx==null)return;const b=st.type==='drag'?0:Math.abs(Math.sin(t*5))*16;
  ctx.fillStyle='#000';ctx.font=`64px ${EMO}`;ctx.textAlign='center';ctx.textBaseline='top';ctx.globalAlpha=.95;ctx.fillText('👆',hx,hy+8+b);ctx.globalAlpha=1;
}

/* ================= Schleife ================= */
let lastT=performance.now();
function loop(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;if(G&&!G.dead){update(dt,now/1000);if(G)render(now/1000)}requestAnimationFrame(loop)}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,200));

/* ================= Start ================= */
(function decorate(){document.querySelectorAll('.screen').forEach(s=>{for(let i=0;i<9;i++){const b=document.createElement('div');b.className='deco';const z=rand(30,110);b.style.width=b.style.height=z+'px';b.style.left=rand(0,100)+'vw';b.style.animationDuration=rand(9,20)+'s';b.style.animationDelay=(-rand(0,20))+'s';s.appendChild(b)}})})();
(function icon(){try{const c=mk(180,180),x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,180);g.addColorStop(0,'#74c0fc');g.addColorStop(1,'#1c7ed6');x.fillStyle=g;x.fillRect(0,0,180,180);
  x.fillStyle='#000';x.font=`96px ${EMO}`;x.textAlign='center';x.textBaseline='middle';x.fillText('🚗',90,100);x.font=`50px ${EMO}`;x.fillText('🫧',140,48);x.fillText('🔧',40,48);$('#appIcon').href=c.toDataURL('image/png')}catch(e){}})();
resize();toChar();requestAnimationFrame(loop);
</script>
</body>
</html>
